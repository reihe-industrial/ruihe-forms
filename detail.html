  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1c2b22; --muted: #66776c; --paper: #f3f1e9; --card: #ffffff; --line: #dfe2d7;
      --brand: #2f6f4e; --brand-dark: #1e4a32; --brand-soft: #e9f1ec; --danger: #a3352c; --radius: 10px;
      --t-factory: #3d5a80; --t-factory-soft: #e6ecf4; --t-land: #8a6a1f; --t-land-soft: #f5eedb; --t-house: #8c3f5a; --t-house-soft: #f6e7ec;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif; background: var(--paper); margin: 0; padding: 20px 16px 60px; color: var(--ink); line-height: 1.55; }
    .container { max-width: 1180px; margin: 0 auto; }
    .crumb { font-size: 14px; color: var(--muted); margin: 0 0 10px; }
    .crumb a { color: var(--brand-dark); font-weight: 700; text-decoration: none; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
    .head { display: flex; gap: 18px; align-items: flex-start; flex-wrap: wrap; }
    .head-main { flex: 1 1 420px; min-width: 0; }
    .title { font-size: 22px; font-weight: 700; margin: 0 0 6px; line-height: 1.3; }
    .tags span { display: inline-block; font-size: 12.5px; font-weight: 700; border-radius: 6px; padding: 2px 9px; margin: 0 6px 4px 0; background: #eef0ea; color: var(--muted); }
    .tags .t-factory { background: var(--t-factory-soft); color: var(--t-factory); }
    .tags .t-land { background: var(--t-land-soft); color: var(--t-land); }
    .tags .t-house { background: var(--t-house-soft); color: var(--t-house); }
    .tags .ok { background: var(--brand-soft); color: var(--brand-dark); }
    .tags .warn { background: #fbebe9; color: var(--danger); }
    .sub { color: var(--muted); font-size: 13.5px; margin-top: 4px; line-height: 1.6; }
    .sub b { color: var(--ink); font-weight: 500; }
    .price { flex: 0 0 auto; text-align: right; margin-left: auto; }
    .price .big { font-size: 28px; font-weight: 700; color: #b3261e; line-height: 1.1; }
    .price .u { color: var(--muted); font-size: 14px; margin-top: 4px; line-height: 1.6; }
    .btns { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; margin-top: 12px; }
    .btn { height: 38px; padding: 0 16px; border-radius: 9px; border: 1px solid var(--brand-dark); background: var(--brand-dark); color: #fff; font-weight: 700; font-size: 14px;
      display: inline-flex; align-items: center; white-space: nowrap; cursor: pointer; text-decoration: none; font-family: inherit; }
    .btn.blue { background: var(--t-factory); border-color: var(--t-factory); }
    .btn.ghost { background: #fff; color: var(--brand-dark); }
    .btn:disabled { opacity: .55; cursor: default; }
    h3 { margin: 0 0 6px; font-size: 15px; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
    h3:before { content: ""; width: 4px; height: 16px; background: var(--brand-dark); border-radius: 2px; flex: 0 0 auto; }
    .kv { display: grid; grid-template-columns: 1fr; column-gap: 20px; margin: 0; font-size: 14px; }
    .kv > div { display: flex; gap: 10px; border-bottom: 1px solid #eeede6; padding: 4px 2px; min-width: 0; }
    .kv > div.long { grid-column: 1 / -1; }
    .kv dt { width: 112px; color: var(--muted); flex: 0 0 auto; }
    .kv dd { margin: 0; font-weight: 500; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
    .kv.one { grid-template-columns: 1fr; }
    .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
    .bld { line-height: 1.9; font-size: 14.5px; padding-left: 4px; }
    .bld .nb { white-space: nowrap; }
    .bld .nbsep { color: var(--line); margin: 0 4px; }
    .feat { white-space: pre-line; line-height: 1.7; font-size: 14.5px; }
    .secs { column-count: 2; column-gap: 10px; }
    .secs > .card { break-inside: avoid; display: inline-block; width: 100%; vertical-align: top; }
    .photos { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
    .photos button { padding: 0; border: 0; border-radius: 9px; overflow: hidden; cursor: zoom-in; background: #e6e9e2; aspect-ratio: 4 / 3; }
    .photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .muted { color: var(--muted); font-size: 14px; }
    #map { height: 280px; border-radius: 9px; border: 1px solid var(--line); }
    .agents { display: flex; gap: 12px; flex-wrap: wrap; }
    .ag { flex: 1 1 160px; border: 1px solid var(--line); border-radius: 9px; padding: 6px 12px; }
    .ag b { font-size: 15px; } .ag div { color: var(--muted); font-size: 14px; margin-top: 2px; }
    .ag a, .kv a { color: var(--brand-dark); }
    .owner-box { border-left: 4px solid #c9a227; }
    .agline { margin-top:8px; font-size:14px; display:flex; flex-wrap:wrap; gap:4px 18px; align-items:baseline; }
    .agline .agl { color:var(--muted); }
    .agline .ag { border:none; padding:0; flex:none; }
    .agline .ag a { color:var(--brand-dark); }
    .loading { padding: 50px 0; text-align: center; color: var(--muted); }
    .err { padding: 30px; text-align: center; color: var(--danger); }
    #lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.85); display: none; align-items: center; justify-content: center; z-index: 9000; flex-direction: column; gap: 10px; }
    #lightbox.on { display: flex; }
    #lightbox img { max-width: 94vw; max-height: 82vh; border-radius: 6px; }
    #lightbox .lb-bar { display: flex; gap: 10px; }
    #lightbox .lb-bar button { height: 38px; padding: 0 16px; border-radius: 9px; border: 0; font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; }
    #lightbox .lb-note { color: #ddd; font-size: 14px; }
    #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 9999; padding: 12px 18px; border-radius: 10px; background: var(--brand-dark); color: #fff; display: none; max-width: 90%; }
    #toast.error { background: var(--danger); }
    @media (max-width: 760px) {
      .secs { column-count: 1; }
      body { padding: 14px 12px 50px; }
      .kv, .grid2 { grid-template-columns: 1fr; }
      .kv dt { width: 108px; }
      .photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .price { text-align: left; margin-left: 0; width: 100%; }
      .btns { justify-content: flex-start; }
      .title { font-size: 21px; }
    }

  <script>
  (function() {
    var page = location.pathname.split('/').pop();
    var edit = /[?&]mode=edit(&|$)/.test(location.search);
    var key = page === 'land-registry.html' ? 'registry' : page === 'summary.html' || page === 'detail.html' ? 'summary'
      : page === 'master-table.html' ? 'master' : page === 'secretary.html' ? 'secretary'
      : page === 'client-summary.html' ? 'csummary' : page === 'map.html' ? 'map' : page === 'matching.html' ? 'matching'
      : page === 'client-needs.html' ? (edit ? 'edit' : 'needs')
      : (edit ? 'edit' : 'listing');
    // 登入後才看得到的連結（data-auth）；再依身分（data-roles）顯示：這個分頁登入的人、身分，存在 sessionStorage
    window.ruiheUpdateNav_ = function() {
      var o = null;
      try { o = JSON.parse(localStorage.getItem('ruihe_login_v1') || 'null'); } catch (e) {}
      var loggedIn = !!(o && o.name && o.code), role = (o && o.role) || '';
      var els = document.querySelectorAll('#siteNav [data-auth]');
      for (var j = 0; j < els.length; j++) {
        var roles = els[j].getAttribute('data-roles');
        var okRole = !roles || roles.split(',').indexOf(role) !== -1;
        els[j].style.display = (loggedIn && okRole) ? '' : 'none';
      }
      var home = document.querySelector('#siteNav [data-home]');
      if (home) home.textContent = loggedIn ? '首頁' : '登入';
    };
    // 預先把「新增物件」表單的選項（業務名單、地段）載到這台裝置，第一次打開新增物件就不用等
    if (page !== 'listing.html') {
      setTimeout(function() {
        try {
          if (localStorage.getItem('ruihe_listing_options_v1')) return;
          fetch('https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec', { method: 'POST', body: JSON.stringify({ fn: 'getListingFormOptions', args: [] }) })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res && res.ok && res.result && res.result.districtData && Object.keys(res.result.districtData).length) localStorage.setItem('ruihe_listing_options_v1', JSON.stringify(res.result)); })
            .catch(function() {});
        } catch (e) {}
      }, 2500);
    }
    window.ruiheUpdateNav_();
    var links = document.querySelectorAll('#siteNav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-key') === key) { links[i].className = 'active'; links[i].setAttribute('aria-current', 'page'); }
    }
  })();

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec';
function $(id) { return document.getElementById(id); }
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function runServer(fn) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) }).then(function(r) { return r.json(); }).then(function(res) {
    if (!res.ok) { var e = new Error(res.message || '系統發生錯誤'); e.fromServer = true; throw e; }
    return res.result;
  });
}
var toastTimer = null;
function toast(text, isError) {
  var el = $('toast'); el.textContent = text; el.className = isError ? 'error' : ''; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function() { el.style.display = 'none'; }, 2600);
}
function goHome_() { var here = location.pathname.split('/').pop() + location.search; location.replace('index.html?next=' + encodeURIComponent(here)); }
function loginGet_() {
  try {
    var o = JSON.parse(localStorage.getItem('ruihe_login_v1') || 'null'), lim = 30;
    try { var st = (JSON.parse(localStorage.getItem('ruihe_settings_v1') || 'null') || {}).values; if (st && isFinite(Number(st.idleMinutes))) lim = Number(st.idleMinutes); } catch (e2) {}
    var t = parseInt(localStorage.getItem('ruihe_last_active_v1'), 10) || 0;
    if (t > 0 && Date.now() - t > lim * 60000) return null;
    return o && o.name && o.code ? o : null;
  } catch (e) { return null; }
}
// 有動作就算「有在用」（跟其他頁一起算自動登出）
(function() {
  var last = 0;
  ['click', 'keydown', 'touchstart', 'scroll'].forEach(function(ev) {
    window.addEventListener(ev, function() { var n = Date.now(); if (n - last < 15000) return; last = n; try { localStorage.setItem('ruihe_last_active_v1', String(n)); } catch (e) {} }, { passive: true, capture: true });
  });
})();

// ---------------- 數字 ----------------
var PING = 3.305785;
function num(v) { var m = String(v == null ? '' : v).replace(/,/g, '').match(/-?\d+(\.\d+)?/); return m ? parseFloat(m[0]) : null; }
function r2(n) { return (Math.round(n * 100) / 100).toLocaleString('en-US', { maximumFractionDigits: 2 }); }
function toWan(text) {
  var t = String(text == null ? '' : text).replace(/[,\s]/g, '');
  var yi = t.match(/(\d+(?:\.\d+)?)億(?:(\d+(?:\.\d+)?)萬)?/);
  if (yi) return parseFloat(yi[1]) * 10000 + (yi[2] ? parseFloat(yi[2]) : 0);
  var n = num(t); if (n === null) return null;
  if (/元/.test(t) && !/萬/.test(t)) return n / 10000;
  return n;
}
// 民國或西元日期 → Date
function parseDate(v) {
  var s = String(v || '').trim().replace(/^民國\s*/, ''), m;
  if ((m = s.match(/^(\d{2,3})\s*年\s*(\d{1,2})\s*月\s*(\d{1,2})/))) return new Date(+m[1] + 1911, +m[2] - 1, +m[3]);
  if ((m = s.match(/^(\d{2,3})[\/.\-](\d{1,2})[\/.\-](\d{1,2})$/))) return new Date(+m[1] + 1911, +m[2] - 1, +m[3]);
  if ((m = s.match(/^(\d{4})[\/.\-年](\d{1,2})[\/.\-月](\d{1,2})/))) return new Date(+m[1], +m[2] - 1, +m[3]);
  return null;
}
function rocText(d) { return d ? (d.getFullYear() - 1911) + '/' + (d.getMonth() + 1) + '/' + d.getDate() : ''; }
function daysLeft(d) { var t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((d.getTime() - t.getTime()) / 86400000); }
function typeClass(t) { return /廠房/.test(t) ? 't-factory' : /土地|農地|建地|工業地/.test(t) ? 't-land' : 't-house'; }

// ---------------- 欄位分組（同一個欄位只出現一次；沒列到的放「其他資料」） ----------------
var AREA_M2 = ['土地面積(m²)', '全筆土地面積(m²)', '主建物面積(m²)', '附屬建物面積(m²)', '共同使用面積(m²)', '加蓋面積(m²)', '全筆主建物面積(m²)'];
var SECTIONS = RuiheOutputs.SECTIONS; // 欄位分組放在 lib/outputs.js（DM、業務銷講、後台設定共用）
var OWNER = [['委託人', ['委託人姓名', '身份證字號或統編', '委託人連絡電話', '委託人聯絡地址', '簽約人身分']],
  ['代理人', ['代理人姓名', '代理人身分證字號', '代理人電話', '代理人地址', '代理人與委託人關係']],
  ['代理人 2', ['代理人2姓名', '代理人2身分證字號', '代理人2電話', '代理人2地址', '代理人2與委託人關係']]];
var HIDE_ON_PAGE = ['合約起始', '填寫日期']; // 物件內容頁不顯示（115/11/04）；合約到期只有這件的業務、秘書、管理員拿得到（後端控制，115/11/09）
var HEAD_USED = ['合約起始', '填寫日期', '案名', '單價', '總價', '案件坐落', '詳細地址', '特色說明', '其他備註說明', '主要業務名稱', '次要業務名稱', '主要業務人員比例', '次要業務人員比例', '中人比例', '類型', '業務人員'];
var LONG = /說明|嫌惡|環境|交通|他項|所有權人|取得原因/;

var auth = loginGet_();
var KEY = (function() { var m = location.search.match(/[?&]key=([^&#]+)/); try { return m ? decodeURIComponent(m[1]) : ''; } catch (e) { return ''; } })();
var D = null;            // listingDetailGet 的結果
var PH = { thumbs: [], ids: [], loaded: false, big: {} };
var LISTING = null;      // 給「產生 DM」用（物件總表那一列）

function F(l) { return D && D.fields[l] != null ? String(D.fields[l]) : ''; }
function areaText(l) {
  var v = F(l); if (!v) return '';
  if (AREA_M2.indexOf(l) === -1) return v;
  var n = num(v); if (n === 0) return '-'; return n === null ? v : r2(n) + ' m²（' + r2(n / PING) + ' 坪）';
}
function bldTotal() {
  var s = 0, any = false;
  ['主建物面積(m²)', '附屬建物面積(m²)', '共同使用面積(m²)'].forEach(function(l) { var n = num(F(l)); if (n !== null) { s += n; any = true; } });
  if (any && s > 0) return s / PING;
  var p = num(F('主建物面積(坪)')); return p;
}
// 115/11/09：資料是 0（等於沒有資訊）顯示「-」，不顯示 0
function isZeroish_(v) { return /^\s*0+(\.0+)?\s*(m²|㎡|平方公尺|坪|米|公尺|m|%|％|元|萬|萬元|個|位|層|樓|F|戶|台|部)?\s*$/i.test(String(v == null ? '' : v)); }
function valueText(l) {
  if (l.charAt(0) !== '_' && F(l) && isZeroish_(F(l))) return '-';
  if (l === '__建物合計') { var b = bldTotal(); return b ? r2(b) + ' 坪（主建物＋附屬＋共有）' : ''; }
  if (l === '__屋齡') {
    var d = parseDate(F('建築完成日')); if (!d) return '';
    var now = new Date(), m = (now.getFullYear() - d.getFullYear()) * 12 + (now.getMonth() - d.getMonth()) - (now.getDate() < d.getDate() ? 1 : 0);
    if (m < 0) return '';
    return Math.floor(m / 12) + ' 年' + (m % 12 ? ' ' + (m % 12) + ' 個月' : '') + '（從建築完成日 ' + rocText(d) + ' 算到今天 ' + rocText(now) + '）';
  }
  if (l === '面臨路寬' || l === '基地面寬' || l === '基地深度') { var v = F(l); return v && /^\d+(\.\d+)?$/.test(v) ? v + ' 米' : v; }
  if (/電話/.test(l)) { var t = F(l); return t ? t.split(/[、,，;；\s]+/).filter(Boolean).map(function(x) { return '<a href="tel:' + esc(x.replace(/[^\d+]/g, '')) + '">' + esc(x) + '</a>'; }).join('、') : ''; }
  return areaText(l);
}
function labelText(l) { return l === '__建物合計' ? '建物面積合計' : l === '__屋齡' ? '屋齡' : l.replace(/\((廠房|土地|房屋)\)$/, '').replace(/\(m²\)$/, ''); }
// 其他備註說明：「・」開頭的行（分棟資訊）一棟一行，名稱粗體、欄位用「｜」分開且每欄不斷行；其他行照原樣
function noteHtml_(t) {
  return String(t).split('\n').map(function(line) {
    var m = /^[・•]\s*([^：:]+)[：:]\s*(.*)$/.exec(line);
    if (!m) return '<div class="feat">' + (esc(line) || '&nbsp;') + '</div>';
    var parts = m[2].split(/\s*｜\s*/).filter(Boolean).map(function(p) { return '<span class="nb">' + esc(p) + '</span>'; }).join('<span class="nbsep">｜</span>');
    return '<div class="bld"><b>' + esc(m[1]) + '</b>　' + parts + '</div>';
  }).join('');
}
function kvHtml(labels, cls) {
  var rows = labels.map(function(l) {
    var v = valueText(l); if (!v) return '';
    var html = /電話/.test(l) ? v : esc(v);
    return '<div' + (LONG.test(l) || v.length > 30 ? ' class="long"' : '') + '><dt>' + esc(labelText(l)) + '</dt><dd>' + html + '</dd></div>';
  }).join('');
  return rows ? '<dl class="kv' + (cls ? ' ' + cls : '') + '">' + rows + '</dl>' : '';
}
function usedLabels() {
  var u = HEAD_USED.slice(); SECTIONS.forEach(function(s) { u = u.concat(s.labels); }); OWNER.forEach(function(o) { u = u.concat(o[1]); });
  return u;
}

function unitLines() {
  var total = toWan(F('總價')), out = [];

function initMap() {
  try {
    var map = L.map('map', { center: D.coord, zoom: 16, scrollWheelZoom: false });
    L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', { maxZoom: 19, attribution: '© 內政部國土測繪中心' }).addTo(map);
    L.circleMarker(D.coord, { radius: 10, weight: 3, color: '#fff', fillColor: '#b3261e', fillOpacity: 0.95 }).addTo(map);
  } catch (e) {}
}

var lbAt = 0;
function showPhoto(i) {

  var want = lbAt;
  runServer('dmGetPhotos', auth.name, auth.code, D.key, [PH.ids[want]]).then(function(r) {
    var src = r && r.photos && r.photos[0]; if (!src) return;
    PH.big[want] = src;

  }).catch(function() { if (lbAt === want) $('lbNote').textContent = (want + 1) + '／' + PH.thumbs.length + '　（清晰版讀不到，顯示小圖）'; });

document.addEventListener('click', function(e) { var b = e.target.closest('[data-ph]'); if (b) showPhoto(parseInt(b.getAttribute('data-ph'), 10)); });

  if (!$('lightbox').classList.contains('on')) return;

// 另開 sheet.html，內容準備好再傳過去（不用 document.write，下載圖片才能用）
function openSheet_(contentP) {
  var w = window.open('sheet.html', '_blank');
  if (!w) { toast('瀏覽器擋住了新視窗，請允許這個網站開新視窗。', true); return; }
  var readyP = new Promise(function(ok) {
    var h = function(e) { if (e.source === w && e.data && e.data.ruiheSheetReady) { window.removeEventListener('message', h); ok(); } };
    window.addEventListener('message', h);
  });
  Promise.all([readyP, contentP]).then(function(all) { w.postMessage({ ruiheSheet: all[1] }, location.origin); })
    .catch(function(err) { readyP.then(function() { w.postMessage({ ruiheSheetError: '產生失敗：' + (err && err.message || err) }, location.origin); }); });
}

 // 115/11/11：物件特色比較長時排成左右兩欄（用空白行分段，同一段不拆到兩欄），右邊不會空一大塊
function dmFeatText_(text, cols) {
  text = String(text || '').replace(/\r/g, '').trim();
  var all = text.split('\n'), n = all.filter(function(l) { return l.trim(); }).length;
  if (!cols || (n < 7 && text.length < 160)) return '<div class="txt">' + esc(text) + '</div>';
  // 分成左右兩欄、兩邊差不多高：盡量切在空白行（段落之間），不要切在標題（■、【】、冒號結尾）後面
  var head = function(l) { return /^\s*(■|□|●|◆|★|【|#)/.test(l) || /[：:]\s*$/.test(l); };
  var w = function(l) { return Math.max(1, Math.ceil(String(l).length / 26)); }; // 一行大約 26 字，長的算兩行
  var tot = all.reduce(function(a, l) { return a + (l.trim() ? w(l) : 0.5); }, 0), acc = 0, best = -1, bestScore = 1e9;
  for (var k = 1; k < all.length; k++) {
    acc += all[k - 1].trim() ? w(all[k - 1]) : 0.5;
    var sc = Math.abs(acc - tot / 2) - (!all[k - 1].trim() || !all[k].trim() ? 0.75 : 0) + (head(all[k - 1]) ? 6 : 0);
    // 左欄最後一段只剩標題＋1 行、右欄開頭只剩 1 行就接空白行：都不好看，盡量避開
    var a0 = k - 1; while (a0 >= 0 && all[a0].trim()) a0--;
    if (all[k - 1].trim() && head(all[a0 + 1] || '') && k - 1 - a0 < 3) sc += 4;
    var b0 = k; while (b0 < all.length && all[b0].trim()) b0++;
    if (all[k].trim() && all[k - 1].trim() && b0 - k < 2) sc += 4;
    if (sc < bestScore) { bestScore = sc; best = k; }
  }
  var trimBlank = function(a) { while (a.length && !a[0].trim()) a.shift(); while (a.length && !a[a.length - 1].trim()) a.pop(); return a; };
  var L = trimBlank(all.slice(0, best)), R = trimBlank(all.slice(best));
  return '<div class="txt cols2"><div>' + esc(L.join('\n')) + '</div><div>' + esc(R.join('\n')) + '</div></div>';
}

      var mw = kind === 'short' ? 500 : 640, mh = kind === 'short' ? 500 : 320;
      var mp = on('__map') && D.coord && window.RuiheDM && RuiheDM.mapImage ? RuiheDM.mapImage(D.coord, mw, mh, 16).catch(function() { return null; }) : Promise.resolve(null);
      return Promise.all([bigPhotos_(ids, thumbs), mp]);
    }).then(function(all) { return kind === 'short' ? dmShortHtml(all[0], all[1]) : dmHtml(all[0], all[1]); }));
  };
  var on = RuiheOutputs.chooser(OUT.cfg, 'dm');
  pickPhotos_(go, !(OUT.loaded && !on('__photos')));
}
function openTour() {
  if (!D) return;
  openSheet_(loadOutputConfig_().then(function() {
    var on = RuiheOutputs.chooser(OUT.cfg, 'talk');
    return Promise.all([on('__photos') ? bigPhotos_(PH.ids.slice(0, 4), PH.thumbs.slice(0, 4)) : Promise.resolve([]), mapP_(on)]);
  }).then(function(all) { return talkHtml(all[0], all[1]); }));
}

// ---------------- 開始 ----------------
// 換頁加快（115/11/11）：看過的物件把資料存在這個分頁（sessionStorage，關掉分頁就清掉），
// 再開同一件先用上次的畫面，同時去讀最新的，有變才換。
var CK_ = 'ruihe_detail_cache_v1';
function cacheGet_() { try { var o = JSON.parse(sessionStorage.getItem(CK_) || '{}'); var e = o[auth.name + '|' + KEY]; return e && e.res ? e : null; } catch (e) { return null; } }
function cachePut_(res) {
  try {
    var o = JSON.parse(sessionStorage.getItem(CK_) || '{}'); o[auth.name + '|' + KEY] = { at: Date.now(), res: res, out: { cfg: OUT.cfg, requester: OUT.requester, company: OUT.company } };
    var ks = Object.keys(o).sort(function(x, y) { return o[y].at - o[x].at; }); ks.slice(12).forEach(function(k) { delete o[k]; });
    sessionStorage.setItem(CK_, JSON.stringify(o));
  } catch (e) {}
}
(function start() {
  if (!auth) { goHome_(); return; }
  if (!KEY) { $('page').innerHTML = '<div class="err">網址少了物件編號，請從物件總表點案名進來。</div>'; return; }
  loadPhotos();
  loadOutputConfig_();
  var cached = cacheGet_(), shown = false, shownJson = '';
  if (cached) { // 先用上次的資料畫出來
    try {
      if (cached.out && cached.out.cfg !== undefined && !OUT.loaded) { OUT.cfg = cached.out.cfg; OUT.requester = cached.out.requester; OUT.company = cached.out.company; }
      D = cached.res; render(); shown = true; shownJson = JSON.stringify(cached.res) + JSON.stringify(OUT.cfg); if (PH.loaded) renderPhotos(PH_NOTE);
    } catch (e) { shown = false; D = null; }
  }
  // 等明細和顯示設定都到了才畫（兩個同時讀）
  Promise.all([runServer('listingDetailGet', auth.name, auth.code, KEY), OUT_P0]).then(function(rs) {
    var res = rs[0];
    cachePut_(res);
    var js = JSON.stringify(res) + JSON.stringify(OUT.cfg);
    if (shown && js === shownJson) return; // 沒變，不用重畫
    D = res; render(); if (PH.loaded) renderPhotos(PH_NOTE);
  }).catch(function(err) {
    if (err.fromServer && /通關碼|姓名|登入/.test(err.message)) { goHome_(); return; }
    if (shown) { toast('連不上系統，目前顯示的是上次看到的資料', true); return; }
    $('page').innerHTML = '<div class="err">' + esc(err.message || '讀取失敗') + '<br><a href="summary.html">回物件總表</a></div>';
  });
})();
</script>
