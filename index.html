<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>首頁｜瑞禾不動產</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1c2b22;
      --muted: #66776c;
      --paper: #f3f1e9;
      --card: #ffffff;
      --line: #dfe2d7;
      --brand: #2f6f4e;
      --brand-dark: #1e4a32;
      --brand-soft: #e9f1ec;
      --danger: #a3352c;
      --danger-soft: #fbebe9;
      --radius: 10px;
      --t-factory: #3d5a80;  --t-factory-soft: #e6ecf4;
      --t-land: #8a6a1f;     --t-land-soft: #f5eedb;
      --t-house: #8c3f5a;    --t-house-soft: #f6e7ec;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--paper); margin: 0; padding: 20px 16px 60px;
      color: var(--ink); line-height: 1.5;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    .narrow { max-width: 640px; }

    .site-nav { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 16px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
    .site-nav a { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
      color: var(--ink); font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .site-nav a:hover { border-color: var(--brand); color: var(--brand); }
    .site-nav a.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    h1 {
      font-family: "Noto Serif TC", "Noto Sans TC", serif;
      font-size: 23px; font-weight: 700; letter-spacing: 0.02em;
      margin: 4px 0 6px; color: var(--brand-dark);
    }
    .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
    .card h2::before { content: ""; display: inline-block; width: 4px; height: 15px; background: var(--brand); border-radius: 2px; flex-shrink: 0; }

    .field { margin-bottom: 16px; }
    label, .flabel { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
    label.required::after { content: " *"; color: var(--danger); font-weight: 700; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; line-height: 1.55; }
    input, select {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    select { appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2366776c' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 10px center; background-size: 18px; padding-right: 34px; }
    button { font-family: inherit; }
    button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 2px; }

    .btn { border: none; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; padding: 11px 18px; cursor: pointer; }
    .btn:disabled { background: #b9c3ba; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; padding: 7px 13px; }
    .btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
    .btn.ghost:disabled { background: #fff; color: #a9b0a2; }

    .msg { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .msg.error { display: block; background: var(--danger-soft); color: var(--danger); }
    .login-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

    /* 登入後的頂列 */
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
    .topbar .who { font-weight: 700; font-size: 14px; }
    .topbar .status { font-size: 13px; color: var(--muted); flex: 1 1 auto; }
    .topbar .status.warn { color: var(--danger); }
    .topbar .actions { display: flex; gap: 6px; }

    /* 篩選 */
    .filters { padding: 16px 18px; }
    .filter-toggle { display: none; }
    .filter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; align-items: end; }
    .filter-grid .span2 { grid-column: span 2; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button {
      border: 1px solid var(--line); background: #fbfaf6; color: var(--ink); border-radius: 999px;
      padding: 6px 13px; font-size: 13.5px; cursor: pointer;
    }
    .chips button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .range { display: flex; align-items: center; gap: 6px; }
    .range input { padding: 9px 10px; }
    .range span { color: var(--muted); flex: 0 0 auto; }
    .row-sel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-foot { grid-column: 2 / -1; display: flex; justify-content: flex-end; }
    @media (max-width: 899px) { .filter-foot { grid-column: auto; } }

    /* 結果列 */
    .resultbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 10px; }
    .count { font-size: 15px; font-weight: 700; color: var(--brand-dark); }
    .count small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
    .sort-mobile { display: none; max-width: 180px; padding: 7px 30px 7px 10px; font-size: 13.5px; }

    .tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: #eef0ea; color: var(--muted); }
    .tag.t-factory { background: var(--t-factory-soft); color: var(--t-factory); }
    .tag.t-land { background: var(--t-land-soft); color: var(--t-land); }
    .tag.t-house { background: var(--t-house-soft); color: var(--t-house); }
    .tag.rs { background: #fff; border: 1px solid var(--line); color: var(--ink); }
    .tag.ct-warn { background: #fff2cc; border: 1px solid #e0c341; color: #6b5200; }

    /* 電腦：表格 */
    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 120px); }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #f8f7f2; z-index: 1; white-space: nowrap; padding: 0; }
    th button { all: unset; display: block; padding: 10px; font-weight: 700; font-size: 13px; color: var(--brand-dark); cursor: pointer; white-space: nowrap; }
    th button:focus-visible { outline: 3px solid var(--brand-soft); }
    th .arrow { color: var(--brand); margin-left: 3px; font-size: 11px; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    td { white-space: nowrap; }
    td.name { font-weight: 700; white-space: normal; min-width: 8em; max-width: 14em; }
    tbody tr:hover { background: #fafaf5; }

    /* 手機：卡片 */
    .cards { display: grid; gap: 10px; }
    .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .item > summary { list-style: none; cursor: pointer; padding: 14px 14px 12px; }
    .item > summary::-webkit-details-marker { display: none; }
    .item-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-name { font-size: 16px; font-weight: 700; margin-right: auto; }
    .item-price { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .item-price b { font-size: 19px; color: var(--brand-dark); }
    .item-price span { font-size: 13.5px; color: var(--muted); }
    .item-meta { font-size: 13.5px; color: var(--ink); margin-top: 3px; }
    .item-meta.muted { color: var(--muted); }
    .item-more-hint { font-size: 12.5px; color: var(--brand); margin-top: 6px; }
    .item[open] .item-more-hint .open-t { display: none; }
    .item:not([open]) .item-more-hint .close-t { display: none; }
    .item-more { margin: 0; padding: 4px 14px 14px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
    .item-more dt { color: var(--muted); padding-top: 6px; }
    .item-more dd { margin: 0; padding-top: 6px; }

    .empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
    .loading { text-align: center; padding: 40px 16px; color: var(--muted); }

    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; background: var(--brand-dark); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; max-width: 90%; text-align: center; }
    #toast.error { background: var(--danger); }

    @media (max-width: 899px) {
      .filter-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: none; padding: 0; font-size: 15px; font-weight: 700; color: var(--brand-dark); cursor: pointer; }
      .filters:not(.open) .filter-body { display: none; }
      .filters.open .filter-toggle { margin-bottom: 14px; }
      .filter-grid { grid-template-columns: 1fr; gap: 14px; }
      .filter-grid .span2 { grid-column: auto; }
      .sort-mobile { display: block; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .item[open] .item-more { animation: open .15s ease-out; }
      @keyframes open { from { opacity: 0; } to { opacity: 1; } }
    }
  
    .hello { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 12px; margin: 0 0 14px; }
    .hello .who { font-size: 16px; font-weight: 700; color: var(--brand-dark); }
    .hello .role { font-size: 12.5px; font-weight: 700; border-radius: 999px; padding: 2px 10px; background: var(--brand-soft); color: var(--brand-dark); }
    .hello .grow { flex: 1 1 auto; }
    .seg { display: inline-flex; gap: 3px; background: #fff; border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
    .seg button { border: none; background: none; border-radius: 999px; padding: 5px 14px; font-size: 13.5px; font-weight: 600; color: var(--muted); cursor: pointer; font-family: inherit; }
    .seg button[aria-pressed="true"] { background: var(--brand-soft); color: var(--brand-dark); }
    .sec-title { display: flex; align-items: center; gap: 10px; margin: 18px 2px 10px; flex-wrap: wrap; }
    .sec-title h2 { margin: 0; font-size: 17px; color: var(--brand-dark); font-family: "Noto Serif TC", "Noto Sans TC", serif; }
    .sec-title .note { font-size: 12.5px; color: var(--muted); }
    .rem { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; }
    .rem > summary { list-style: none; cursor: pointer; padding: 13px 16px; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 15px; }
    .rem > summary::-webkit-details-marker { display: none; }
    .rem > summary::after { content: "▾"; margin-left: auto; color: var(--muted); font-size: 13px; }
    .rem[open] > summary::after { content: "▴"; }
    .badge { min-width: 24px; text-align: center; border-radius: 999px; padding: 1px 9px; font-size: 13px; font-weight: 700; background: #eef0ea; color: var(--muted); }
    .badge.hot { background: #fbe4e1; color: var(--danger); }
    .badge.warn { background: #fff2cc; color: #6b5200; }
    .rem-body { border-top: 1px solid var(--line); }
    .rem-row { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 11px 16px; border-bottom: 1px solid var(--line); align-items: center; }
    .rem-row:last-child { border-bottom: none; }
    .rem-row .nm { font-weight: 700; word-break: break-all; }
    .rem-row .meta { grid-column: 1; font-size: 13px; color: var(--muted); }
    .rem-row .when { grid-column: 1; font-size: 13.5px; }
    .rem-row .when b { color: var(--danger); }
    .rem-row .go { grid-row: 1 / 4; grid-column: 2; align-self: center; }
    .rem-empty { padding: 14px 16px; color: var(--muted); font-size: 13.5px; }
    .rem-error { padding: 14px 16px; color: var(--danger); font-size: 13.5px; }
    .link-btn { display: inline-block; border: 1px solid var(--brand); color: var(--brand); border-radius: 8px; padding: 6px 12px; font-size: 13.5px; font-weight: 700; text-decoration: none; background: #fff; white-space: nowrap; }
    .link-btn:hover { background: var(--brand-soft); }
    .entries { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
    .entry { display: block; background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; text-decoration: none; color: var(--ink); }
    .entry:hover { border-color: var(--brand); box-shadow: 0 2px 10px rgba(30,74,50,.08); }
    .entry b { display: block; font-size: 15.5px; color: var(--brand-dark); margin-bottom: 3px; }
    .entry span { font-size: 13px; color: var(--muted); line-height: 1.5; }
    .g-box { display: flex; flex-direction: column; align-items: center; gap: 8px; margin: 2px 0 14px; min-height: 44px; }
    .g-note { font-size: 12.5px; color: var(--muted); text-align: center; line-height: 1.5; }
    .g-note.warn { color: #8a5a00; }
    .back-link { border: none; background: none; padding: 0; margin: 0 0 12px; font-family: inherit; font-size: 14px; color: var(--brand); cursor: pointer; }
    .or-line { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; margin: 4px 0 14px; }
    .or-line::before, .or-line::after { content: ""; flex: 1 1 auto; height: 1px; background: var(--line); }
    .method-card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-top: 10px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
    .method-card .lbl { font-weight: 700; color: var(--brand-dark); }
    .method-card .st { font-size: 14px; }
    .method-card .grow { flex: 1 1 auto; }
    .notice { background: #fff8e1; border: 1px solid #e0c341; border-radius: 10px; padding: 11px 14px; margin: 0 0 14px; font-size: 13.5px; color: #5a4a00; }
      .ann { background: #fff; border: 1px solid var(--line); border-left: 5px solid var(--brand); border-radius: 12px; padding: 12px 16px; margin-bottom: 10px; }
    .ann.important { border-left-color: #B3261E; background: #FFF6F5; }
    .ann h3 { margin: 0 0 4px; font-size: 16px; }
    .ann .ann-tag { display: inline-block; background: #B3261E; color: #fff; font-size: 12px; border-radius: 6px; padding: 1px 7px; margin-right: 6px; vertical-align: 2px; }
    .ann .ann-body { white-space: pre-wrap; font-size: 14.5px; line-height: 1.7; }
    .ann .ann-meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="container">
    <h1>瑞禾不動產　業務系統</h1>
    <div class="subtitle" id="subtitle">登入後可以使用物件、客需的各項功能</div>

    <div class="card narrow" id="loginView">
      <h2>登入</h2>
      <div id="chooseBox">
        <div class="g-box"><div id="googleBtn"></div><div class="g-note" id="googleNote"></div></div>
        <div class="or-line">或</div>
        <button type="button" class="btn" id="showCodeBtn" style="width:100%;">使用通關碼登入</button>
      </div>
      <div id="codeBox" hidden>
        <button type="button" class="back-link" id="backBtn">← 其他登入方式</button>
        <div class="field">
          <label class="required" for="loginName">姓名</label>
          <select id="loginName"><option value="">載入中…</option></select>
        </div>
        <div class="field">
          <label class="required" for="loginCode">通關碼</label>
          <div class="hint">英文和數字，不分大小寫</div>
          <input type="password" id="loginCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
        </div>
        <button type="button" class="btn" id="loginBtn" style="width:100%;">登入</button>
      </div>
      <div class="msg" id="loginMsg"></div>
      <div class="login-note">在共用電腦上用完，請按「登出」。30 分鐘沒有動作會自動登出。</div>
    </div>

    <div id="portal" hidden>
      <div class="notice" id="portalNotice" style="display:none;"></div>
      <div class="hello">
        <span class="who" id="whoName"></span><span class="role" id="whoRole"></span>
        <span class="grow"></span>
        <span class="seg" id="scopeSeg" style="display:none;" role="group" aria-label="待辦範圍">
          <button type="button" data-scope="mine" aria-pressed="true">我的</button>
          <button type="button" data-scope="all" aria-pressed="false">全公司</button>
        </span>
        <button type="button" class="btn ghost" id="refreshBtn">重新整理</button>
        <button type="button" class="btn ghost" id="logoutBtn">登出</button>
      </div>

      <div id="annBox" hidden></div>
      <div class="sec-title"><h2>功能</h2></div>
      <div class="entries" id="entries"></div>
      <div class="sec-title"><h2>待辦提醒</h2><span class="note" id="remNote"></span></div>
      <details class="rem" id="remDue" open>
        <summary>客需：今天要聯絡<span class="badge" id="cntDue">…</span></summary>
        <div class="rem-body" id="bodyDue"><div class="rem-empty">讀取中…</div></div>
      </details>
      <details class="rem" id="remStale" open>
        <summary>客需：超過 30 天沒追蹤<span class="badge" id="cntStale">…</span></summary>
        <div class="rem-body" id="bodyStale"><div class="rem-empty">讀取中…</div></div>
      </details>
      <details class="rem" id="remContract" open>
        <summary>物件：合約 30 天內到期<span class="badge" id="cntContract">…</span></summary>
        <div class="rem-body" id="bodyContract"><div class="rem-empty">讀取中…</div></div>
      </details>
      <details class="rem" id="remMatch" open hidden>
        <summary>新物件符合你的客需（最近 <span id="matchDays">7</span> 天）<span class="badge" id="cntMatch">…</span></summary>
        <div class="rem-body" id="bodyMatch"></div>
      </details>
      <details class="rem" id="remReq" open hidden>
        <summary>人員異動申請（待審核）<span class="badge" id="cntReq">…</span></summary>
        <div class="rem-body" id="bodyReq"></div>
      </details>
      <details class="rem" id="remDup" open hidden>
        <summary>物件：相同、需要確認或相似<span class="badge" id="cntDup">…</span></summary>
        <div class="rem-body" id="bodyDup"><div class="rem-empty">讀取中…</div></div>
      </details>

      <div class="sec-title"><h2>登入方式</h2></div>
      <div class="method-card" id="methodCard">
        <span class="lbl">Google 帳號</span>
        <span class="st" id="gStatus">讀取中…</span>
        <span class="grow"></span>
        <div id="gBindBtn"></div>
        <button type="button" class="btn ghost" id="gUnbindBtn" style="display:none;">解除綁定</button>
      </div>
    </div>
  </div>

    return '<div class="rem-row"><div class="nm">' + esc(x.L.name || '（未填案名）') + '</div>' +
      '<div class="meta">' + esc([x.L.typesText, x.L.rs, x.L.placeText, x.L.priceText, x.L.date + ' 登錄'].filter(Boolean).join('｜')) + '</div>' +
      '<div class="when">符合你的客需：' + esc(x.c.types.join('、') + '・' + x.c.demand.join('、') + (x.c.regionText ? '（' + x.c.regionText + '）' : '')) +
      (x.m.warn ? '　<b>' + esc(x.m.warn) + '</b>' : '') + '</div>' +
      '<div class="go"><a class="link-btn" href="client-needs.html?mode=edit&key=' + encodeURIComponent(x.c.key) + '">看這筆客需</a></div></div>';
  }).join('') + (items.length > 8 ? '<div class="rem-empty">還有 ' + (items.length - 8) + ' 筆，請到客需的「配對物件」看。</div>' : '');
}
function renderReqReminder() {
  var box = $('remReq');
  var c = auth ? readJson(sessionStorage, 'ruihe_secretary_cache_v1') : null;
  var reqs = (role === '管理員' && c && c.name === auth.name && c.people && c.people.requests) ? c.people.requests.filter(function(r) { return r.status === '待審核'; }) : [];
  box.hidden = !reqs.length;
  if (!reqs.length) return;
  setBadge('cntReq', reqs.length, 'hot');
  $('bodyReq').innerHTML = reqs.slice(0, 8).map(function(r) {
    var ch = [];
    if (r.fromRole !== r.toRole) ch.push('身分 ' + r.fromRole + ' → ' + r.toRole);
    if (r.fromGroups !== r.toGroups) ch.push('組別 ' + (r.fromGroups || '（無）') + ' → ' + (r.toGroups || '（無）'));
    return '<div class="rem-row"><div class="nm">' + esc(r.target) + '</div><div class="meta">' + esc(r.by) + ' 申請｜' + esc(r.at) + '</div>' +
      '<div class="when"><b>' + esc(ch.join('；')) + '</b></div><div class="go"><a class="link-btn" href="secretary.html?tab=people">審核</a></div></div>';
  }).join('');
}
function renderDupReminder() {
  renderReqReminder();
  var box = $('remDup');
  var can = role === '秘書' || role === '管理員';
  box.hidden = !can;
  if (!can || !auth) return;
  var c = readJson(sessionStorage, 'ruihe_master_cache_v1');
  if (!c || c.name !== auth.name || !c.tabs) { $('bodyDup').innerHTML = '<div class="rem-empty">讀取中…</div>'; $('cntDup').textContent = '…'; $('cntDup').className = 'badge'; return; }
  var items = [];
  c.tabs.forEach(function(t) {
    var ni = (t.columns || []).indexOf('案名');
    (t.dup || []).forEach(function(d, i) { if (d) items.push({ name: ni === -1 ? '' : t.rows[i][ni], type: t.type, why: d }); });
  });
  var order = { '相同': 0, '需要確認': 1, '相似': 2 };
  items.sort(function(a, b) { return order[a.why.split('｜')[0]] - order[b.why.split('｜')[0]]; });
  setBadge('cntDup', items.length, items.length ? 'hot' : '');
  if (!items.length) { $('bodyDup').innerHTML = '<div class="rem-empty">目前沒有相同、需要確認或相似的物件。</div>'; return; }
  $('bodyDup').innerHTML = items.slice(0, 8).map(function(it) {
    return '<div class="rem-row"><div class="nm">' + esc(it.name || '（未填案名）') + '</div><div class="meta">' + esc(it.type) + '</div>' +
      '<div class="when"><b>' + esc(it.why.split('｜')[0]) + '</b>　' + esc(it.why.split('｜').slice(1).join('｜')) + '</div><div class="go"><a class="link-btn" href="master-table.html?dup=1">看物件總表</a></div></div>';
  }).join('') + (items.length > 8 ? '<div class="rem-empty">還有 ' + (items.length - 8) + ' 件，請到物件總表勾「只看相同、需要確認或相似的」。</div>' : '');
}

// ---------------- 預先載入各功能頁的資料 ----------------
// 登入首頁後，在背景把物件簡表／物件地圖、客需簡表（主管以上再加物件總表，秘書、管理員再加秘書專區）的資料先抓好，
// 存在各頁面原本就會用的暫存位置，點進去就直接顯示。已經是最新的（版本一樣）後端只回「沒變」，不會重抓整份。
// 3 分鐘內預先載入過就不再做。
function readJson(store, key) { try { return JSON.parse(store.getItem(key) || 'null'); } catch (e) { return null; } }
function prefetchPages() {
  if (!auth) return;
  var last = parseInt(sessionStorage.getItem('ruihe_prefetch_at') || '0', 10);
  if (Date.now() - last < 3 * 60 * 1000) return;
  try { sessionStorage.setItem('ruihe_prefetch_at', String(Date.now())); } catch (e) {}
  var who = auth.name, code = auth.code, r = role;
  // 物件簡表＋物件地圖：同一份資料，地圖多了座標
  var sc = readJson(localStorage, 'ruihe_summary_cache_v1'), mc = readJson(localStorage, 'ruihe_map_cache_v1');
  var known = (sc && mc && sc.version === mc.version && mc.coords && mc.keys && sc.dates && sc.keys && sc.coords) ? sc.version : '';
  post(OBJ_API, 'summaryGetListings', [who, code, known]).then(function(res) {
    if (res.unchanged || !auth) return;
    var now = Date.now();
    try {
      localStorage.setItem('ruihe_summary_cache_v1', JSON.stringify({ version: res.version, columns: res.columns || [], rows: res.rows || [], dates: res.dates || [], keys: res.keys || [], coords: res.coords || [], checkedAt: now }));
      localStorage.setItem('ruihe_map_cache_v1', JSON.stringify({ version: res.version, columns: res.columns || [], rows: res.rows || [], coords: res.coords || [], keys: res.keys || [], checkedAt: now }));
    } catch (e) {}
  }).then(function() { renderMatchReminder(); }, function() {});
  // 客需簡表
  var cc = readJson(localStorage, 'ruihe_client_summary_cache_v1');
  post(CLIENT_API, 'clientSummaryGet', [who, code, cc && cc.version ? cc.version : '']).then(function(res) {
    if (res.unchanged || !auth) return;
    try { localStorage.setItem('ruihe_client_summary_cache_v1', JSON.stringify({ version: res.version, columns: res.columns || [], rows: res.rows || [], checkedAt: Date.now() })); } catch (e) {}
  }).then(function() { renderMatchReminder(); }, function() {});
  // 物件總表（只存在這個分頁）
  if (r === '主管' || r === '秘書' || r === '管理員') {
    var tc = readJson(sessionStorage, 'ruihe_master_cache_v1');
    post(OBJ_API, 'masterTableGet', [who, code, tc && tc.name === who ? tc.version : '']).then(function(res) {
      if (res.unchanged || !auth) return;
      try { sessionStorage.setItem('ruihe_master_cache_v1', JSON.stringify({ name: who, role: res.role || r, version: res.version, tabs: res.tabs || [] })); } catch (e) {}
      renderDupReminder();
    }).then(function() { renderDupReminder(); }, function() {});
  }
  // 秘書專區（只存在這個分頁）
  if (r === '秘書' || r === '管理員') {
    Promise.all([post(OBJ_API, 'adminListPeople', [who, code]), post(REG_API, 'regListRequests', [who, code])]).then(function(all) {
      if (!auth) return;
      try { sessionStorage.setItem('ruihe_secretary_cache_v1', JSON.stringify({ name: who, people: all[0], reg: all[1] })); } catch (e) {}
      renderReqReminder();
    }).catch(function() {});
  }
}

// ---------------- 登入紀錄用：裝置、IP（IP 是網頁自己向外部服務問來的，只能參考） ----------------
function deviceText() {
  var ua = navigator.userAgent || '';
  var os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X|Macintosh/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : '其他';
  var br = /Line\//.test(ua) ? 'LINE 內建瀏覽器' : /FBAN|FBAV/.test(ua) ? 'Facebook 內建瀏覽器' : /Edg\//.test(ua) ? 'Edge' : /OPR\//.test(ua) ? 'Opera' : /SamsungBrowser/.test(ua) ? 'Samsung 瀏覽器' : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /FxiOS|Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : '其他瀏覽器';
  return os + '・' + br;
}
var clientIp = '';
(function lookupIp() {
  try {
    var done = false;
    setTimeout(function() { done = true; }, 3000);
    fetch('https://api.ipify.org?format=json').then(function(r) { return r.json(); }).then(function(j) { if (!done && j && j.ip) clientIp = String(j.ip); }).catch(function() {});
  } catch (e) {}
})();
function clientInfo() { return { device: deviceText(), ip: clientIp }; }

// ---------------- Google 登入、綁定 ----------------
// 登入畫面和首頁的「登入方式」不會同時出現，所以每次畫按鈕前重新設定這次按下去要做什麼
var googleReady = null;
function whenGoogle() {
  if (googleReady) return googleReady;
  googleReady = new Promise(function(resolve, reject) {
    var t0 = Date.now();
    (function wait() {
      if (window.google && google.accounts && google.accounts.id) { resolve(google.accounts.id); return; }
      if (Date.now() - t0 > 10000) { googleReady = null; reject(new Error('Google 登入元件載入失敗')); return; }
      setTimeout(wait, 200);
    })();
  });
  return googleReady;
}
function inAppBrowser() { return /Line\/|FBAN|FBAV|Instagram|MicroMessenger/i.test(navigator.userAgent || ''); }
function renderGoogleLogin() {
  var note = $('googleNote');
  if (inAppBrowser()) { note.className = 'g-note warn'; note.textContent = '在 LINE 等 App 裡打開時，Google 登入可能沒辦法用，請改用 Chrome 或 Safari 開啟，或用下面的通關碼登入。'; }
  whenGoogle().then(function(gid) {
    gid.initialize({ client_id: GOOGLE_CLIENT_ID, callback: onGoogleLogin, auto_select: false, cancel_on_tap_outside: true });
    $('googleBtn').innerHTML = '';
    gid.renderButton($('googleBtn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', width: 280, locale: 'zh_TW' });
  }).catch(function() { if (!inAppBrowser()) { note.className = 'g-note'; note.textContent = 'Google 登入暫時無法使用，請用通關碼登入。'; } });
}
function onGoogleLogin(resp) {
  if (!resp || !resp.credential) return;
  showLoginMsg('Google 登入中…', false);
  post(OBJ_API, 'googleLogin', [resp.credential, clientInfo()]).then(function(res) {
    showLoginMsg('');
    afterLogin(res, res.token);
  }).catch(function(err) { showLoginMsg(err.message || '連不上系統', true); });
}
function loadGoogleStatus() {
  if (!auth) return;
  $('gStatus').textContent = '讀取中…'; $('gUnbindBtn').style.display = 'none'; $('gBindBtn').innerHTML = '';
  post(OBJ_API, 'googleStatus', [auth.name, auth.code]).then(function(st) {
    // Google 帳號由管理員在人員管理設定；這裡只顯示狀態
    if (st.bound) $('gStatus').textContent = (st.email || '') + '（由管理員設定）' + (st.linked ? '，可以直接按「使用 Google 帳戶登入」' : '，第一次按「使用 Google 帳戶登入」後就完成連結');
    else $('gStatus').textContent = '還沒設定。要用 Google 登入，請洽管理員設定你的 Gmail。';
  }).catch(function(err) {
    if (isAuthError(err)) { logoutToLogin(err.message); return; }
    $('gStatus').textContent = '讀取失敗：' + (err.message || '連不上系統');
  });
}
function onGoogleBind(resp) {
  if (!resp || !resp.credential || !auth) return;
  $('gStatus').textContent = '綁定中…';
  post(OBJ_API, 'googleBind', [auth.name, auth.code, resp.credential]).then(function(st) {
    toast('已綁定 Google 帳號 ' + (st.email || ''));
    loadGoogleStatus();
  }).catch(function(err) {
    if (isAuthError(err)) { logoutToLogin(err.message); return; }
    toast(err.message || '綁定失敗', true); loadGoogleStatus();
  });
}
$('gUnbindBtn').addEventListener('click', function() {
  if (!auth || !confirm('確定要解除 Google 帳號綁定嗎？之後要用通關碼登入，或再綁定一次。')) return;
  post(OBJ_API, 'googleUnbind', [auth.name, auth.code]).then(function() { toast('已解除綁定'); loadGoogleStatus(); })
    .catch(function(err) { toast(err.message || '解除失敗', true); });
});

function showLoginChoice(code) {
  $('chooseBox').hidden = !!code; $('codeBox').hidden = !code;
  if (code) setTimeout(function() { try { $('loginName').focus(); } catch (e) {} }, 0);
}
$('showCodeBtn').addEventListener('click', function() { showLoginChoice(true); });
$('backBtn').addEventListener('click', function() { showLoginChoice(false); });

// ---------------- 事件 ----------------
$('loginBtn').addEventListener('click', function() { login(); });
$('loginCode').addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
$('refreshBtn').addEventListener('click', function() { loadReminders(true); loadAnnouncements(); });
$('logoutBtn').addEventListener('click', function() { logoutToLogin(''); });
$('scopeSeg').addEventListener('click', function(e) {
  var b = e.target.closest('button'); if (!b) return;
  scope = b.getAttribute('data-scope');
  [].forEach.call(document.querySelectorAll('#scopeSeg button'), function(x) { x.setAttribute('aria-pressed', String(x === b)); });
  state.client = null; state.contract = null; state.clientErr = ''; state.contractErr = '';
  ['Due', 'Stale', 'Contract'].forEach(function(k) { $('body' + k).innerHTML = '<div class="rem-empty">讀取中…</div>'; $('cnt' + k).textContent = '…'; $('cnt' + k).className = 'badge'; });
  $('remNote').textContent = scope === 'all' ? (role === '主管' ? '你那一組' : '全公司') : '只有你負責的';
  loadReminders(false);
});

// 起始：被功能頁帶回來時顯示原因（例如 30 分鐘沒動作自動登出）
(function init() {
  var msg = ''; try { msg = sessionStorage.getItem('ruihe_login_msg') || ''; } catch (e) {}
  loadLoginNames_($('loginName'), function() {
    return post(OBJ_API, 'getEditLoginOptions', []).then(function(res) { return res.personList || []; });
  }, function(err) { $('loginName').innerHTML = '<option value="">載入失敗，請重新整理頁面</option>'; showLoginMsg(err.message || '連不上系統', true); });
  idleWatch_(function() { return !!auth; }, function(m) { logoutToLogin(m); });
  var saved = sharedLoginGet_();
  if (!saved) renderGoogleLogin();
  if (saved) { login(saved); }
  else if (msg) { showLoginMsg(msg, true); try { sessionStorage.removeItem('ruihe_login_msg'); } catch (e) {} }
})();
</script>
