  // 新增物件、新增客需、調謄本只給登入的同仁用（115/10/22）：這個分頁沒有登入、或太久沒動作，就帶到首頁登入，登入後回來
  (function() {
    var ok = false;
    try {
      var v = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'), lim = 30;
      try { var st = (JSON.parse(localStorage.getItem('ruihe_settings_v1') || 'null') || {}).values; if (st && isFinite(Number(st.idleMinutes))) lim = Number(st.idleMinutes); } catch (e2) {}
      var t = parseInt(sessionStorage.getItem('ruihe_last_active_v1'), 10) || 0;
      ok = !!(v && v.name && v.code) && !(t > 0 && Date.now() - t > lim * 60000);
    } catch (e) {}
    if (!ok) { try { sessionStorage.setItem('ruihe_login_msg', '請先登入'); } catch (e) {} location.replace('index.html?next=' + encodeURIComponent(location.pathname.split('/').pop() + location.search)); return; }
    // 填表單時有動作就算「有在用」，其他頁面不會因為 30 分鐘沒動作而登出
    var last = 0;
    ['click', 'keydown', 'input', 'touchstart', 'scroll'].forEach(function(ev) {
      window.addEventListener(ev, function() { var n = Date.now(); if (n - last < 15000) return; last = n; try { sessionStorage.setItem('ruihe_last_active_v1', String(n)); } catch (e) {} }, { passive: true, capture: true });
    });
  })();
  </script>

// ---------- 讀資料等太久自動重試（115/10/15）----------
// 只針對「讀資料」的請求（不會改到資料的），超過 20 秒沒回應就放棄這次、自動再試一次；
// 兩次都沒回應就回「連線比較慢，請按重新整理」。送出、儲存這類會改資料的請求不重試（避免重複）。
(function() {
  if (window.__ruiheFetchWrapped || !window.fetch) return;
  window.__ruiheFetchWrapped = true;
  var orig = window.fetch.bind(window);
  var READS = ['summaryGetListings', 'clientSummaryGet', 'masterTableGet', 'adminListPeople', 'regListRequests', 'editListCases', 'clientEditList',
    'editLoadCase', 'clientEditLoad', 'clientReminders', 'contractReminders', 'googleStatus', 'getEditLoginOptions', 'getListingFormOptions',
    'getListingFormPersons', 'myVisibleNames', 'adminLoginLog', 'clientTracksView', 'submissionStatus', 'getLandRegistryFormOptions'];
  function once(url, opts) {
    if (!window.AbortController) return orig(url, opts);
    var ctrl = new AbortController(), timer = setTimeout(function() { ctrl.abort(); }, 20000);
    var o = {}; for (var k in opts) o[k] = opts[k]; o.signal = ctrl.signal;
    return orig(url, o).then(function(r) { clearTimeout(timer); return r; }, function(e) { clearTimeout(timer); throw e; });
  }
  window.fetch = function(url, opts) {
    var fn = '';
    try { if (opts && opts.method === 'POST' && typeof opts.body === 'string' && /script\.google\.com/.test(String(url))) fn = (JSON.parse(opts.body) || {}).fn || ''; } catch (e) {}
    var isTokenVerify = fn === 'summaryVerifyLogin' && /"S_[A-Z0-9]+"/.test(opts.body);   // 換頁時用登入憑證驗證＝只讀
    if (READS.indexOf(fn) === -1 && !isTokenVerify) return orig(url, opts);
    return once(url, opts).catch(function() {
      return new Promise(function(res) { setTimeout(res, 600); }).then(function() { return once(url, opts); });
    }).catch(function() { throw new Error('連線比較慢，請按「重新整理」或重新打開這一頁再試一次。'); });
  };
})();
  (function() {
    var page = location.pathname.split('/').pop();
    var edit = /[?&]mode=edit(&|$)/.test(location.search);
    var key = page === 'land-registry.html' ? 'registry' : page === 'summary.html' ? 'summary'
      : page === 'master-table.html' ? 'master' : page === 'secretary.html' ? 'secretary'
      : page === 'client-summary.html' ? 'csummary' : page === 'map.html' ? 'map' : page === 'matching.html' ? 'matching'
      : page === 'client-needs.html' ? (edit ? 'edit' : 'needs')
      : (edit ? 'edit' : 'listing');
    // 登入後才看得到的連結（data-auth）；再依身分（data-roles）顯示：這個分頁登入的人、身分，存在 sessionStorage
    window.ruiheUpdateNav_ = function() {
      var o = null;
      try { o = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'); } catch (e) {}
      var loggedIn = !!(o && o.name && o.code), role = (o && o.role) || '';
      var els = document.querySelectorAll('#siteNav [data-auth]');
      for (var j = 0; j < els.length; j++) {
        var roles = els[j].getAttribute('data-roles');
        var okRole = !roles || roles.split(',').indexOf(role) !== -1;
        els[j].style.display = (loggedIn && okRole) ? '' : 'none';
      }
      var home = document.querySelector('#siteNav [data-home]');
      if (home) home.textContent = loggedIn ? '首頁' : '登入';
    };
    // 預先把「新增物件」表單的選項（業務名單、地段）載到這台裝置，第一次打開新增物件就不用等
    if (page !== 'listing.html') {
      setTimeout(function() {
        try {
          if (localStorage.getItem('ruihe_listing_options_v1')) return;
          fetch('https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec', { method: 'POST', body: JSON.stringify({ fn: 'getListingFormOptions', args: [] }) })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res && res.ok && res.result && res.result.districtData && Object.keys(res.result.districtData).length) localStorage.setItem('ruihe_listing_options_v1', JSON.stringify(res.result)); })
            .catch(function() {});
        } catch (e) {}
      }, 2500);
    }
    window.ruiheUpdateNav_();
    var links = document.querySelectorAll('#siteNav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-key') === key) { links[i].className = 'active'; links[i].setAttribute('aria-current', 'page'); }
    }
  })();
  </script>

<script>
// 部署 Apps Script 後，把「管理部署作業」裡的網頁應用程式網址（結尾 /exec）貼在這裡
var API_URL = 'https://script.google.com/macros/s/AKfycbxBxEn3c_mfLtT_gH-O2MgT6byDTNdJCWEf0IxFtYVp1oqYJxmFbGXuXzcX3SEam93E/exec';
var PERSON_LIST = [];

function runServer(fnName) {
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn: fnName, args: args }) })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) throw new Error(res.message || '後端發生錯誤');
      return res.result;
    });
}

var toastTimer_;
function showToast(message, type, noScroll) {
  var toast = document.getElementById('toastNotice');
  toast.className = type === 'error' ? 'error' : 'success';
  toast.textContent = message;
  toast.style.display = 'block';
  if (!noScroll) window.scrollTo({ top: 0, behavior: 'smooth' });
  clearTimeout(toastTimer_);
  toastTimer_ = setTimeout(function() { toast.style.display = 'none'; }, 5000);
}
// 必填沒填：把缺的區塊用紅框標出並寫明原因，自動捲到第一個；改到那個區塊紅框就消失
function clearMissingMarks_() {
  document.querySelectorAll('.field-missing').forEach(function(f) { f.classList.remove('field-missing'); });
  document.querySelectorAll('.missing-msg').forEach(function(m) { m.remove(); });
}
function markEl_(el, msg) {
  el.classList.add('field-missing');
  var m = document.createElement('div');
  m.className = 'missing-msg';
  m.textContent = msg;
  var lab = Array.prototype.slice.call(el.children).filter(function(c) { return c.tagName === 'LABEL'; })[0];
  if (lab) lab.insertAdjacentElement('afterend', m); else el.insertBefore(m, el.firstChild);
}
function scrollToFirstMissing_() {
  var first = document.querySelector('.field-missing');
  if (!first) return;
  if (first.scrollIntoView) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
}
['input', 'change'].forEach(function(evt) {
  document.querySelector('.container').addEventListener(evt, function(e) {
    var box = e.target.closest('.district-entry, .card');
    if (box) { box.classList.remove('field-missing'); var m = box.querySelector(':scope > .missing-msg'); if (m) m.remove(); }
  });
});
var DISTRICT_DATA = {};
var TRANSCRIPT_TYPES = [];
var entryCount = 0;

// 建立一筆「地段」區塊：縣市/鄉鎮/段連動選單 + 地號/建號 + 謄本種類 + 備註
function createDistrictEntry() {
  entryCount++;
  var entryId = entryCount;

  var wrap = document.createElement('div');
  wrap.className = 'district-entry';
  wrap.setAttribute('data-entry-id', entryId);

  var title = document.createElement('div');
  title.className = 'district-entry-title';
  title.textContent = '地段 #' + entryId;
  wrap.appendChild(title);

  // 縣市/鄉鎮/段
  var locBlock = document.createElement('div');
  locBlock.className = 'field-block';
  var locLabel = document.createElement('label');
  locLabel.className = 'field-label';
  locLabel.innerHTML = '縣市 / 鄉鎮市區 / 段名<span class="required-star">*</span>';
  locBlock.appendChild(locLabel);

  var locRow = document.createElement('div');
  locRow.className = 'row-3';

  var countySelect = document.createElement('select');
  countySelect.className = 'countySelect';
  var blankCounty = document.createElement('option');
  blankCounty.value = ''; blankCounty.textContent = '縣市';
  countySelect.appendChild(blankCounty);
  Object.keys(DISTRICT_DATA).forEach(function(county) {
    var o = document.createElement('option');
    o.value = county; o.textContent = county;
    countySelect.appendChild(o);
  });

  var townSelect = document.createElement('select');
  townSelect.className = 'townSelect';
  var blankTown = document.createElement('option');
  blankTown.value = ''; blankTown.textContent = '鄉鎮市區';
  townSelect.appendChild(blankTown);

  var districtSelect = document.createElement('select');
  districtSelect.className = 'districtSelect';
  var blankDistrict = document.createElement('option');
  blankDistrict.value = ''; blankDistrict.textContent = '段名';
  districtSelect.appendChild(blankDistrict);

  countySelect.addEventListener('change', function() {
    townSelect.innerHTML = '';
    townSelect.appendChild(blankTown.cloneNode(true));
    districtSelect.innerHTML = '';
    districtSelect.appendChild(blankDistrict.cloneNode(true));
    var towns = DISTRICT_DATA[countySelect.value] || {};
    Object.keys(towns).forEach(function(town) {
      var o = document.createElement('option');
      o.value = town; o.textContent = town;
      townSelect.appendChild(o);
    });
  });

  townSelect.addEventListener('change', function() {
    districtSelect.innerHTML = '';
    districtSelect.appendChild(blankDistrict.cloneNode(true));
    var towns = DISTRICT_DATA[countySelect.value] || {};
    var districts = towns[townSelect.value] || [];
    districts.forEach(function(d) {
      var o = document.createElement('option');
      o.value = d; o.textContent = d;
      districtSelect.appendChild(o);
    });
  });

  locRow.appendChild(countySelect);
  locRow.appendChild(townSelect);
  locRow.appendChild(districtSelect);
  locBlock.appendChild(locRow);
  wrap.appendChild(locBlock);

  // 地號 / 建號
  var numRow = document.createElement('div');
  numRow.className = 'row-2 field-block';

  var lotBlock = document.createElement('div');
  var lotLabel = document.createElement('label');
  lotLabel.className = 'field-label';
  lotLabel.textContent = '地號';
  var lotHint = document.createElement('div');
  lotHint.className = 'hint';
  lotHint.style.marginBottom = '6px';
  lotHint.textContent = '土地類請填寫，可留空。多筆用逗號分隔，例如 375,376,377';
  var lotInput = document.createElement('input');
  lotInput.type = 'text';
  lotInput.className = 'lotInput';
  lotBlock.appendChild(lotLabel);
  lotBlock.appendChild(lotHint);
  lotBlock.appendChild(lotInput);

  var buildingBlock = document.createElement('div');
  var buildingLabel = document.createElement('label');
  buildingLabel.className = 'field-label';
  buildingLabel.textContent = '建號';
  var buildingHint = document.createElement('div');
  buildingHint.className = 'hint';
  buildingHint.style.marginBottom = '6px';
  buildingHint.textContent = '建物類請填寫，可留空。多筆用逗號分隔，例如 595-1,595';
  var buildingInput = document.createElement('input');
  buildingInput.type = 'text';
  buildingInput.className = 'buildingInput';
  buildingBlock.appendChild(buildingLabel);
  buildingBlock.appendChild(buildingHint);
  buildingBlock.appendChild(buildingInput);

  numRow.appendChild(lotBlock);
  numRow.appendChild(buildingBlock);
  wrap.appendChild(numRow);

  // 謄本種類
  var typeBlock = document.createElement('div');
  typeBlock.className = 'field-block';
  var typeLabel = document.createElement('label');
  typeLabel.className = 'field-label';
  typeLabel.innerHTML = '謄本種類<span class="required-star">*</span>';
  typeBlock.appendChild(typeLabel);
  var typeGroup = document.createElement('div');
  typeGroup.className = 'checkbox-group transcriptTypeGroup';
  TRANSCRIPT_TYPES.forEach(function(t) {
    var lbl = document.createElement('label');
    var cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.value = t;
    cb.className = 'transcriptTypeCheckbox';
    lbl.appendChild(cb);
    lbl.appendChild(document.createTextNode(t));
    typeGroup.appendChild(lbl);
  });
  typeBlock.appendChild(typeGroup);
  wrap.appendChild(typeBlock);

  // 地址（有填建號時必填）
  var addrBlock = document.createElement('div');
  addrBlock.className = 'field-block';
  var addrLabel = document.createElement('label');
  addrLabel.className = 'field-label';
  addrLabel.innerHTML = '地址<span class="required-star addrStar" style="display:none;">*</span>';
  var addrHint = document.createElement('div');
  addrHint.className = 'hint';
  addrHint.style.marginBottom = '6px';
  addrHint.textContent = '有填建號的話必填，例如 台中市大雅區工業二路15號';
  var addrInput = document.createElement('input');
  addrInput.type = 'text';
  addrInput.className = 'addressInput';
  addrBlock.appendChild(addrLabel);
  addrBlock.appendChild(addrHint);
  addrBlock.appendChild(addrInput);
  wrap.appendChild(addrBlock);
  buildingInput.addEventListener('input', function() {
    addrLabel.querySelector('.addrStar').style.display = buildingInput.value.trim() ? '' : 'none';
  });

  // 備註
  var noteBlock = document.createElement('div');
  noteBlock.className = 'field-block';
  var noteLabel = document.createElement('label');
  noteLabel.className = 'field-label';
  noteLabel.textContent = '備註';
  var noteHint = document.createElement('div');
  noteHint.className = 'hint';
  noteHint.style.marginBottom = '6px';
  noteHint.textContent = '有其他需求事項可以寫在這邊給秘書';
  var noteInput = document.createElement('textarea');
  noteInput.className = 'noteInput';
  noteBlock.appendChild(noteLabel);
  noteBlock.appendChild(noteHint);
  noteBlock.appendChild(noteInput);
  wrap.appendChild(noteBlock);

  // 刪除按鈕（第一筆不給刪，至少要留一筆）
  if (entryId > 1 || document.querySelectorAll('.district-entry').length > 0) {
    var removeBtn = document.createElement('button');
    removeBtn.type = 'button';
    removeBtn.className = 'remove-entry-btn';
    removeBtn.textContent = '刪除這筆';
    removeBtn.addEventListener('click', function() {
      var allEntries = document.querySelectorAll('.district-entry');
      if (allEntries.length <= 1) {
        alert('至少要保留一筆地段資料');
        return;
      }
      wrap.remove();
    });
    wrap.appendChild(removeBtn);
  }

  document.getElementById('districtEntries').appendChild(wrap);
}

document.getElementById('addEntryBtn').addEventListener('click', createDistrictEntry);

// 頁面載入時，抓業務名單跟縣市地段資料
var REGISTRY_OPTIONS_KEY = 'ruihe_registry_options_v1';
function fetchRegistryOptions_() {
  return runServer('getLandRegistryFormOptions').then(function(o) {
    if (o && o.personList && o.districtData && Object.keys(o.districtData).length) { try { localStorage.setItem(REGISTRY_OPTIONS_KEY, JSON.stringify(o)); } catch (e) {} }
    return o;
  });
}
var cachedRegistryOptions_ = null;
try { cachedRegistryOptions_ = JSON.parse(localStorage.getItem(REGISTRY_OPTIONS_KEY) || 'null'); } catch (e) {}
if (cachedRegistryOptions_ && !(cachedRegistryOptions_.districtData && Object.keys(cachedRegistryOptions_.districtData).length)) cachedRegistryOptions_ = null;
if (cachedRegistryOptions_) {
  // 背景拿最新的；業務名單有變而且還沒選人，就靜靜地換成最新的
  fetchRegistryOptions_().then(function(fresh) {
    if (!fresh || !fresh.personList) return;
    if (JSON.stringify(fresh.personList) === JSON.stringify(PERSON_LIST)) return;
    if (document.querySelector('.bizCheckbox:checked')) return;
    PERSON_LIST = fresh.personList;
    if (document.getElementById('businessNameGroup').querySelector('.bizCheckbox')) renderBizGroup_();
  }).catch(function() {});
}
// 負責業務：勾選（可以好幾位，跟新增物件一樣），送出時用「、」接起來
function renderBizGroup_() {
  var box = document.getElementById('businessNameGroup');
  box.innerHTML = '';
  PERSON_LIST.concat(['其他']).forEach(function(name) {
    var lb = document.createElement('label');
    var cb = document.createElement('input'); cb.type = 'checkbox'; cb.className = 'bizCheckbox'; cb.value = name;
    lb.appendChild(cb); lb.appendChild(document.createTextNode(name));
    box.appendChild(lb);
    if (name === '其他') cb.addEventListener('change', function() {
      var other = document.getElementById('businessNameOtherInput');
      other.style.display = cb.checked ? 'block' : 'none';
      if (!cb.checked) other.value = '';
    });
  });
  preselectMe_();
}
// 調謄本：預設勾選登入的人（115/10/22）
function preselectMe_() {
  var me = ''; try { me = (JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null') || {}).name || ''; } catch (e) {}
  if (!me || document.querySelector('.bizCheckbox:checked')) return;
  document.querySelectorAll('.bizCheckbox').forEach(function(cb) { if (cb.value === me && cb.value !== '其他') cb.checked = true; });
}
function selectedBiz_() {
  var names = [];
  document.querySelectorAll('.bizCheckbox:checked').forEach(function(cb) {
    if (cb.value === '其他') {
      String(document.getElementById('businessNameOtherInput').value || '').split(/[、,，\/\s]+/).forEach(function(x) { x = x.trim(); if (x && names.indexOf(x) === -1) names.push(x); });
    } else if (names.indexOf(cb.value) === -1) names.push(cb.value);
  });
  return names.join('、');
}
(cachedRegistryOptions_ ? Promise.resolve(cachedRegistryOptions_) : fetchRegistryOptions_()).then(function(options) {
  PERSON_LIST = options.personList || [];
  DISTRICT_DATA = options.districtData || {};
  TRANSCRIPT_TYPES = options.transcriptTypes || [];

  renderBizGroup_();

  createDistrictEntry(); // 預設先給一筆
}).catch(function(err) {
  var msgBox = document.getElementById('msgBox');
  msgBox.className = 'msg error';
  msgBox.textContent = '載入資料失敗：' + (err && err.message ? err.message : err);
});

document.getElementById('submitBtn').addEventListener('click', function() {
  var msgBox = document.getElementById('msgBox');
  msgBox.style.display = 'none';

  var businessName = selectedBiz_();
  clearMissingMarks_();
  if (!businessName) {
    msgBox.className = 'msg error';
    msgBox.textContent = '請勾選負責業務。';
    markEl_(document.getElementById('businessNameGroup').closest('.card'), '請勾選負責業務');
    scrollToFirstMissing_();
    showToast('請勾選負責業務', 'error', true);
    return;
  }

  var entries = [];
  var missingParts = [];
  document.querySelectorAll('.district-entry').forEach(function(entryEl, idx) {
    var county = entryEl.querySelector('.countySelect').value;
    var town = entryEl.querySelector('.townSelect').value;
    var district = entryEl.querySelector('.districtSelect').value;
    var lot = entryEl.querySelector('.lotInput').value.trim();
    var building = entryEl.querySelector('.buildingInput').value.trim();
    var note = entryEl.querySelector('.noteInput').value.trim();
    var address = entryEl.querySelector('.addressInput').value.trim();
    var checkedTypes = Array.prototype.slice.call(entryEl.querySelectorAll('.transcriptTypeCheckbox:checked'))
      .map(function(cb) { return cb.value; });

    var entryProblems = [];
    if (!county || !town || !district) { missingParts.push('第 ' + (idx + 1) + ' 筆：縣市/鄉鎮市區/段名'); entryProblems.push('縣市／鄉鎮市區／段名還沒選完'); }
    if (checkedTypes.length === 0) { missingParts.push('第 ' + (idx + 1) + ' 筆：謄本種類（至少勾選一項）'); entryProblems.push('謄本種類至少要勾選一項'); }
    if (building && !address) { missingParts.push('第 ' + (idx + 1) + ' 筆：地址（有填建號的話必填）'); entryProblems.push('有填建號，地址要填'); }
    if (entryProblems.length) markEl_(entryEl, entryProblems.join('；'));

    entries.push({ county: county, town: town, district: district, lot: lot, building: building,
      transcriptTypes: checkedTypes, note: note, address: address });
  });

  if (missingParts.length > 0) {
    msgBox.className = 'msg error';
    msgBox.textContent = '請填寫以下必填欄位：\n' + missingParts.join('\n');
    scrollToFirstMissing_();
    showToast('還有 ' + missingParts.length + ' 項必填沒填，請看紅框標示處', 'error', true);
    return;
  }

  var submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '送出中...';

  runServer('submitLandRegistryRequest', businessName, entries).then(function(result) {
    submitBtn.disabled = false;
    submitBtn.textContent = '送出申請';
    if (result && result.success) {
      msgBox.className = 'msg success';
      msgBox.textContent = result.message || '送出成功！';
      showToast(result.message || '申請送出成功！', 'success');
      bigNotice_('success', '調謄本申請已送出', (result.message || '申請送出成功！') + '\n秘書會依申請幫你調謄本。');
      document.querySelectorAll('.bizCheckbox').forEach(function(cb) { cb.checked = false; });
      document.getElementById('businessNameOtherInput').value = '';
      document.getElementById('businessNameOtherInput').style.display = 'none';
      preselectMe_();
      document.getElementById('districtEntries').innerHTML = '';
      createDistrictEntry();
    } else {
      msgBox.className = 'msg error';
      msgBox.textContent = '送出失敗，請稍後再試。';
      showToast('送出失敗，請稍後再試。', 'error');
      bigNotice_('error', '沒有送出', '送出失敗，請稍後再試。');
    }
    window.scrollTo(0, 0);
  }).catch(function(err) {
    submitBtn.disabled = false;
    submitBtn.textContent = '送出申請';
    msgBox.className = 'msg error';
    msgBox.textContent = '送出失敗：' + (err && err.message ? err.message : err);
    showToast('送出失敗：' + (err && err.message ? err.message : err), 'error');
    bigNotice_('error', '沒有送出', '送出失敗：' + (err && err.message ? err.message : err) + '\n請檢查網路後再按一次「送出申請」。');
    window.scrollTo(0, 0);
  });
});

// 填到一半要離開這一頁（例如點上面的選單）時先提醒；送出成功後表單會清空，就不會再提醒
function registryHasContent_() {
  if (document.querySelector('.bizCheckbox:checked')) return true;
  var els = document.querySelectorAll('#districtEntries input, #districtEntries select, #districtEntries textarea');
  for (var i = 0; i < els.length; i++) {
    var el = els[i];
    if (el.type === 'checkbox' || el.type === 'radio') { if (el.checked) return true; }
    else if (String(el.value || '').trim()) return true;
  }
  return false;
}
window.addEventListener('beforeunload', function(e) {
  if (registryHasContent_()) { e.preventDefault(); e.returnValue = ''; }
});
</script>

<script>
// 第五批改版第 3 次（115/10/16）：左側目錄、底部送出列（lib/formui.js）。
// 底部的件數用 registryCheck_：跟送出時同樣的規則，但不標紅框、不改畫面
var regCheckEls_ = {};
function registryCheck_() {
  regCheckEls_ = {};
  var out = [], add = function(label, el) { out.push(label); regCheckEls_[label.replace(/（.*$/, '')] = el; };
  if (!selectedBiz_()) add('負責業務', document.getElementById('businessNameGroup').closest('.card'));
  document.querySelectorAll('.district-entry').forEach(function(el, idx) {
    var county = el.querySelector('.countySelect').value, town = el.querySelector('.townSelect').value, district = el.querySelector('.districtSelect').value;
    var building = el.querySelector('.buildingInput').value.trim(), address = el.querySelector('.addressInput').value.trim();
    var types = el.querySelectorAll('.transcriptTypeCheckbox:checked').length;
    if (!county || !town || !district) add('第 ' + (idx + 1) + ' 筆：縣市/鄉鎮市區/段名', el);
    if (!types) add('第 ' + (idx + 1) + ' 筆：謄本種類（至少勾選一項）', el);
    if (building && !address) add('第 ' + (idx + 1) + ' 筆：地址（有填建號的話必填）', el);
  });
  return out;
}
RuiheFormUI.init({
  form: document.getElementById('lrForm'),
  sectionSelector: '.card, .district-entry',
  titleSelector: ':scope > h2, :scope > .district-entry-title, :scope > .field-label',
  submitBtn: document.getElementById('submitBtn'),
  check: registryCheck_,
  findField: function(name) { return regCheckEls_[name] || null; }
});
</script>
<script>
// 送出結果的大彈窗（115/10/22）：畫面正中間、不會自動消失，要按「知道了」才關；送出中也會顯示「處理中」
function bigNotice_(kind, title, text, btnText) {
  var ov = document.getElementById('bigNoticeOv');
  if (!ov) {
    ov = document.createElement('div'); ov.id = 'bigNoticeOv';
    ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-modal', 'true'); ov.setAttribute('aria-labelledby', 'bigNoticeTitle');
    ov.style.cssText = 'position:fixed;inset:0;z-index:10000;background:rgba(20,32,24,.55);display:none;align-items:center;justify-content:center;padding:20px;';
    ov.innerHTML = '<div style="background:#fff;border-radius:18px;max-width:480px;width:100%;padding:30px 26px 24px;text-align:center;box-shadow:0 18px 50px rgba(0,0,0,.25);">' +
      '<div id="bigNoticeIcon" style="width:76px;height:76px;border-radius:50%;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:800;color:#fff;"></div>' +
      '<div id="bigNoticeTitle" style="font-size:26px;font-weight:800;margin-bottom:10px;"></div>' +
      '<div id="bigNoticeText" style="font-size:17px;line-height:1.7;color:#333;white-space:pre-line;margin-bottom:22px;"></div>' +
      '<button type="button" id="bigNoticeBtn" style="width:100%;height:54px;border:none;border-radius:12px;font-size:19px;font-weight:800;color:#fff;cursor:pointer;">知道了</button></div>';
    document.body.appendChild(ov);
    document.getElementById('bigNoticeBtn').addEventListener('click', function() { ov.style.display = 'none'; });
    document.addEventListener('keydown', function(e) { if (ov.style.display === 'flex' && (e.key === 'Escape' || e.key === 'Enter')) { e.preventDefault(); ov.style.display = 'none'; } });
  }
  var C = { success: ['#2f6f4e', '✓'], error: ['#B3261E', '!'], wait: ['#8a6d1d', '…'] }[kind] || ['#2f6f4e', '✓'];
  var ic = document.getElementById('bigNoticeIcon'); ic.style.background = C[0]; ic.textContent = C[1];
  document.getElementById('bigNoticeTitle').style.color = C[0];
  document.getElementById('bigNoticeTitle').textContent = title;
  document.getElementById('bigNoticeText').textContent = text || '';
  var b = document.getElementById('bigNoticeBtn'); b.style.background = C[0];
  b.textContent = btnText || (kind === 'wait' ? '先關掉（處理完會再通知）' : '知道了');
  ov.style.display = 'flex';
  setTimeout(function() { try { b.focus(); } catch (e) {} }, 30);
}
</script>
