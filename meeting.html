<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>週會｜瑞禾業務系統</title>
  <script>
  (function() { var ok = false; try { var v = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'); ok = !!(v && v.name && v.code); } catch (e) {}
    if (!ok) location.replace('index.html?next=meeting.html'); })();
  </script>
  <style>
    body { margin: 0; }
    .container { max-width: 1180px; margin: 0 auto; padding: 16px 16px 60px; }
    h1 { font-size: 24px; color: var(--brand); margin: 6px 0 2px; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 12px; }
    .btn { height: 40px; padding: 0 16px; border-radius: 10px; border: none; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    .btn.ghost { background: #fff; color: var(--brand); border: 1px solid var(--line); }
    .btn:disabled { opacity: .6; cursor: default; }
    .bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 14px; }
    .bar .wk { font-size: 18px; font-weight: 800; min-width: 10em; text-align: center; }
    .nav-btn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: #fff; font-size: 20px; cursor: pointer; }
    .bar select { height: 38px; border-radius: 10px; border: 1px solid var(--line); padding: 0 10px; font: inherit; }
    .item { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 4px 14px; }
    .item .no { grid-row: span 3; width: 36px; height: 36px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 800; display: flex; align-items: center; justify-content: center; }
    .item .ttl { font-size: 17px; font-weight: 800; }
    .ktag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; margin-right: 6px; vertical-align: 2px; }
    .ktag.k物件 { background: #E6F0E9; color: #1E4A32; } .ktag.k宣導 { background: #FDECEA; color: #B3261E; } .ktag.k上課 { background: #E8F0FB; color: #1F4E8C; } .ktag.k其他 { background: #F1EFE8; color: #5D6B62; }
    .item .meta { color: var(--muted); font-size: 13.5px; }
    .item .acts { display: flex; gap: 6px; align-items: flex-start; flex-wrap: wrap; justify-content: flex-end; }
    .item .acts button { height: 32px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 13px; cursor: pointer; }
    .item .acts .del { color: #B3261E; }
    .links { grid-column: 2 / -1; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .links a { font-size: 13.5px; padding: 5px 10px; border-radius: 999px; border: 1px solid #CFE3D6; background: #F3F8F5; color: var(--brand); text-decoration: none; font-weight: 700; }
    .note { grid-column: 2 / -1; font-size: 14px; white-space: pre-wrap; background: #FAFBF9; border-left: 3px solid #CFE3D6; padding: 6px 10px; margin-top: 4px; }
    .minutes { grid-column: 2 / -1; margin-top: 6px; }
    .minutes textarea { width: 100%; box-sizing: border-box; min-height: 56px; border-radius: 8px; border: 1px solid var(--line); padding: 8px; font: inherit; }
    .minutes .lbl { font-size: 12.5px; font-weight: 700; color: var(--brand); }
    .empty { background: #fff; border: 1px dashed var(--line); border-radius: 14px; padding: 30px; text-align: center; color: var(--muted); }
    .pick { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 6px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .pick:hover { background: #F3F8F5; }
    .f-label { font-weight: 700; margin: 10px 0 4px; display: block; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip { border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; background: #fff; cursor: pointer; font: inherit; font-size: 13.5px; }
    .chip.on { background: var(--brand); color: #fff; border-color: var(--brand); }
    .lrow { display: flex; gap: 6px; margin-top: 6px; }
    .lrow input { flex: 1; height: 36px; border-radius: 8px; border: 1px solid var(--line); padding: 0 8px; font: inherit; }
    textarea.full { width: 100%; box-sizing: border-box; border-radius: 8px; border: 1px solid var(--line); padding: 8px; font: inherit; }
    /* 播放 */
    #show { position: fixed; inset: 0; background: #0F1F17; color: #fff; z-index: 200; display: none; flex-direction: column; }
    #show.on { display: flex; }
    #show .top { display: flex; align-items: center; gap: 12px; padding: 12px 18px; background: #173326; }
    #show .top .cnt { margin-left: auto; opacity: .8; }
    #show .top button, #show .ctl button { height: 38px; padding: 0 14px; border-radius: 10px; border: 1px solid rgba(255,255,255,.3); background: transparent; color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
    #show .body { flex: 1; display: grid; grid-template-columns: minmax(0, 3fr) minmax(0, 2fr); gap: 18px; padding: 18px; min-height: 0; }
    #show .ph { background: #000; border-radius: 12px; display: flex; align-items: center; justify-content: center; overflow: hidden; min-height: 0; }
    #show .ph img { max-width: 100%; max-height: 100%; object-fit: contain; }
    #show .thumbs { display: flex; gap: 6px; margin-top: 8px; }
    #show .thumbs img { width: 90px; height: 64px; object-fit: cover; border-radius: 6px; opacity: .6; cursor: pointer; border: 2px solid transparent; }
    #show .thumbs img.on { opacity: 1; border-color: #9FD3B1; }
    #show .info { overflow-y: auto; }
    #show .info h2 { font-size: 30px; margin: 0 0 4px; }
    #show .info .tg { opacity: .8; }
    #show .info .pr { font-size: 34px; font-weight: 800; color: #FFB4A8; margin: 8px 0; }
    #show .info dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 0; font-size: 17px; }
    #show .info dt { opacity: .7; }
    #show .info .ft { font-size: 16px; white-space: pre-wrap; line-height: 1.7; margin-top: 8px; }
    #show .info .lk a { display: inline-block; margin: 4px 6px 0 0; padding: 6px 12px; border-radius: 999px; background: rgba(255,255,255,.12); color: #fff; text-decoration: none; font-weight: 700; }
    #show .ctl { display: flex; justify-content: center; gap: 10px; padding: 10px; }
    @media (max-width: 800px) { #show .body { grid-template-columns: 1fr; overflow-y: auto; } .item { grid-template-columns: 36px minmax(0,1fr); } .item .acts { grid-column: 2; justify-content: flex-start; } }
  </style>

<body>
  <div class="container">
  <nav class="site-nav" id="siteNav" aria-label="表單選單">
    <a href="index.html" data-key="home" data-home="1">登入</a>
    <a href="listing.html" data-key="listing" data-auth="1" style="display:none;">新增物件</a>
    <a href="client-needs.html" data-key="needs" data-auth="1" style="display:none;">新增客需</a>
    <a href="land-registry.html" data-key="registry" data-auth="1" style="display:none;">調謄本</a>
    <span data-auth="1" aria-hidden="true" style="display:none;flex:0 0 1px;background:#dfe2d7;margin:4px 4px;"></span>
    <a href="listing.html?mode=edit" data-key="edit" data-auth="1" style="display:none;">修改物件／客需／物件配對</a>
    <a href="summary.html" data-key="summary" data-auth="1" style="display:none;">物件簡表</a>
    <a href="client-summary.html" data-key="csummary" data-auth="1" style="display:none;">客需簡表</a>
    <a href="map.html" data-key="map" data-auth="1" style="display:none;">物件地圖</a>
    <a href="meeting.html" data-key="meeting" data-auth="1" style="display:none;">週會</a>
    <a href="master-table.html" data-key="master" data-auth="1" data-roles="主管,秘書,管理員" style="display:none;">物件／客需總表</a>
    <a href="secretary.html" data-key="secretary" data-auth="1" data-roles="秘書,管理員" style="display:none;">秘書專區</a>
    <a href="help.html" data-key="help" data-auth="1" style="display:none;">使用說明</a>

  <script>
  (function() {
    var page = location.pathname.split('/').pop();
    var edit = /[?&]mode=edit(&|$)/.test(location.search);
    var key = page === 'meeting.html' ? 'meeting' : page === 'land-registry.html' ? 'registry' : page === 'summary.html' ? 'summary'
      : page === 'master-table.html' ? 'master' : page === 'secretary.html' ? 'secretary'
      : page === 'client-summary.html' ? 'csummary' : page === 'map.html' ? 'map' : page === 'matching.html' ? 'matching'
      : page === 'client-needs.html' ? (edit ? 'edit' : 'needs')
      : (edit ? 'edit' : 'listing');
    // 登入後才看得到的連結（data-auth）；再依身分（data-roles）顯示：這個分頁登入的人、身分，存在 sessionStorage
    window.ruiheUpdateNav_ = function() {
      var o = null;
      try { o = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'); } catch (e) {}
      var loggedIn = !!(o && o.name && o.code), role = (o && o.role) || '';
      var els = document.querySelectorAll('#siteNav [data-auth]');
      for (var j = 0; j < els.length; j++) {
        var roles = els[j].getAttribute('data-roles');
        var okRole = !roles || roles.split(',').indexOf(role) !== -1;
        els[j].style.display = (loggedIn && okRole) ? '' : 'none';
      }
      var home = document.querySelector('#siteNav [data-home]');
      if (home) home.textContent = loggedIn ? '首頁' : '登入';
    };
    // 預先把「新增物件」表單的選項（業務名單、地段）載到這台裝置，第一次打開新增物件就不用等
    if (page !== 'listing.html') {
      setTimeout(function() {
        try {
          if (localStorage.getItem('ruihe_listing_options_v1')) return;
          fetch('https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec', { method: 'POST', body: JSON.stringify({ fn: 'getListingFormOptions', args: [] }) })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res && res.ok && res.result && res.result.districtData && Object.keys(res.result.districtData).length) localStorage.setItem('ruihe_listing_options_v1', JSON.stringify(res.result)); })
            .catch(function() {});
        } catch (e) {}
      }, 2500);
    }
    window.ruiheUpdateNav_();
    var links = document.querySelectorAll('#siteNav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-key') === key) { links[i].className = 'active'; links[i].setAttribute('aria-current', 'page'); }
    }
  })();
  </script>
    <h1>週會</h1>
    <div class="subtitle">每週三週會的議程：物件介紹、重要事項宣導、上課資料。先把要報告的加進來，週會時按「開始播放」。</div>
    <div class="bar">
      <button type="button" class="nav-btn" id="prevW" aria-label="上一週">‹</button>
      <span class="wk" id="wk">…</span>
      <button type="button" class="nav-btn" id="nextW" aria-label="下一週">›</button>
      <span style="margin-left:6px;">主持人：</span><span id="hostBox">…</span>
      <span style="flex:1"></span>
      <button type="button" id="addBtn" hidden></button>
      <button type="button" class="btn ghost" id="addAgendaBtn">＋ 加入物件／宣導／上課</button>
      <button type="button" class="btn" id="playBtn">▶ 開始播放</button>
    </div>
    <div id="agendaSum" style="font-size:14px;color:var(--muted);margin:0 0 10px;"></div>
    <div id="list"><div class="loading">讀取中…</div></div>
  </div>
  <div id="show" role="dialog" aria-modal="true" aria-label="週會播放">
    <div class="top"><b id="sTitle"></b><span class="cnt" id="sCnt"></span><button type="button" id="sClose">結束播放</button></div>
    <div class="body"><div style="display:flex;flex-direction:column;min-height:0;"><div class="ph" id="sPh" style="flex:1;"></div><div class="thumbs" id="sThumbs"></div></div><div class="info" id="sInfo"></div></div>
    <div class="ctl"><button type="button" id="sPrev">← 上一項</button><button type="button" id="sNext">下一項 →</button></div>
  </div>
<script src="lib/match.js?v=20261021c"></script>
<script src="lib/dm.js?v=20261022b"></script>
<script>
var API = 'https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec';
var auth = null; try { auth = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'); } catch (e) {}
var $ = function(id) { return document.getElementById(id); };
function esc(v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function toast(t) { var d = document.createElement('div'); d.textContent = t; d.style.cssText = 'position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#1E4A32;color:#fff;padding:10px 18px;border-radius:999px;z-index:300;font-weight:700;'; document.body.appendChild(d); setTimeout(function() { d.remove(); }, 2200); }
function post(fn, args) {
  return fetch(API, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) }).then(function(r) { return r.json(); }).then(function(j) {
    if (!j.ok) { var e = new Error(j.message || '發生錯誤'); if (/通關碼|請選擇姓名|登入/.test(e.message)) { try { sessionStorage.removeItem('ruihe_login_v1'); } catch (x) {} location.replace('index.html?next=meeting.html'); } throw e; }
    return j.result;
  });
}
var M = null, listings = [], byKey = {};
var TYPE_LINKS = ['PPT', 'PDF', 'Word', '網址', '雲端資料夾', '影片'];
function iso(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function shift(dateIso, days) { var d = new Date(dateIso + 'T12:00:00'); d.setDate(d.getDate() + days); return iso(d); }
function wkText(dt) { var d = new Date(dt + 'T12:00:00'); return (d.getFullYear() - 1911) + ' 年 ' + (d.getMonth() + 1) + ' 月 ' + d.getDate() + ' 日（三）'; }
function L(it) { return byKey[it.key] || null; }
function mapLinks(it) {
  if (!it.key) { var pl = it.extra && it.extra.place; return pl ? ['<a href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(pl) + '" target="_blank" rel="noopener">Google 地圖</a>'] : []; }
  var l = L(it), out = [];
  if (l && l.coord) out.push('<a href="https://www.google.com/maps?q=' + l.coord[0] + ',' + l.coord[1] + '" target="_blank" rel="noopener">Google 地圖</a>');
  out.push('<a href="map.html?k=' + encodeURIComponent(it.key) + '" target="_blank" rel="noopener">物件地圖（國土測繪）</a>');
  return out;
}
function render() {
  $('wk').textContent = wkText(M.date);
  $('hostBox').innerHTML = M.canSetHost ? '<select id="hostSel" aria-label="主持人"><option value="">（還沒選）</option>' + M.people.map(function(p) { return '<option' + (p === M.host ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('') + '</select>' : '<b>' + esc(M.host || '還沒選') + '</b>';
  if ($('hostSel')) $('hostSel').addEventListener('change', function() { post('meetingSetHost', [auth.name, auth.code, M.date, this.value]).then(function(r) { M = r; render(); toast('已設定主持人'); }).catch(function(e) { alert(e.message); }); });
  $('playBtn').disabled = !M.items.length;
  var cnt = { '宣導': 0, '物件': 0, '上課': 0, '其他': 0 }; M.items.forEach(function(x) { cnt[x.itemKind || '物件']++; });
  $('agendaSum').textContent = M.items.length ? '本週議程：' + [cnt['宣導'] ? '宣導 ' + cnt['宣導'] + ' 項' : '', cnt['物件'] ? '物件 ' + cnt['物件'] + ' 件' : '', cnt['上課'] ? '上課 ' + cnt['上課'] + ' 堂' : '', cnt['其他'] ? '其他 ' + cnt['其他'] + ' 項' : ''].filter(Boolean).join('、') : '';
  if (!M.items.length) { $('list').innerHTML = '<div class="empty">這一週還沒有議程。按「＋ 加入物件／宣導／上課」。</div>'; return; }
  $('list').innerHTML = M.items.map(function(it, i) {
    var l = L(it), mine = it.agent === auth.name, can = M.canManage;
    var ex = it.extra || {}, kind = it.itemKind || '物件';
    if (kind !== '物件') {
      return '<div class="item" data-id="' + esc(it.id) + '"><div class="no">' + (i + 1) + '</div>' +
        '<div><div class="ttl"><span class="ktag k' + kind + '">' + ({ '上課': '上課資料', '宣導': '宣導', '其他': '其他' })[kind] + '</span>' + esc(it.caseName) + '</div><div class="meta">' + esc(kind === '上課' && ex.teacher ? '講師 ' + ex.teacher : it.agent) + '</div></div>' +
        '<div class="acts">' + (can ? '<button type="button" data-up="' + i + '"' + (i ? '' : ' disabled') + '>↑</button><button type="button" data-down="' + i + '"' + (i < M.items.length - 1 ? '' : ' disabled') + '>↓</button>' : '') +
          (mine || can ? '<button type="button" data-edit="' + esc(it.id) + '">編輯</button><button type="button" class="del" data-del="' + esc(it.id) + '">移除</button>' : '') + '</div>' +
        ((it.links || []).length ? '<div class="links">' + it.links.map(function(k) { return '<a href="' + esc(k.url) + '" target="_blank" rel="noopener">' + (k.image ? '🖼 ' : '') + esc(k.label) + '</a>'; }).join('') + '</div>' : '') +
        (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') +
        (can ? '<div class="minutes"><div class="lbl">會議紀錄</div><textarea data-min="' + esc(it.id) + '">' + esc(it.minutes || '') + '</textarea></div>'
             : (it.minutes ? '<div class="minutes"><div class="lbl">會議紀錄</div><div class="note" style="margin:0;">' + esc(it.minutes) + '</div></div>' : '')) + '</div>';
    }
    var sum = !it.key ? [it.typeTab, ex.rs, ex.price, ex.place, ex.land ? '土地 ' + ex.land + ' 坪' : '', ex.bld ? '建物 ' + ex.bld + ' 坪' : ''].filter(Boolean).join('・') + '（自己填）'
      : l ? [l.typesText, l.rs === '租' ? '出租' : l.rs === '售' ? '出售' : '', l.priceText || '', l.placeText || ''].filter(Boolean).join('・') : (it.typeTab || '');
    return '<div class="item" data-id="' + esc(it.id) + '"><div class="no">' + (i + 1) + '</div>' +
      '<div><div class="ttl"><span class="ktag k物件">物件</span>' + esc(it.caseName || (l && l.name) || '（案名）') + '</div><div class="meta">' + esc(it.agent) + '｜' + esc(sum) + '</div></div>' +
      '<div class="acts">' + (can ? '<button type="button" data-up="' + i + '"' + (i ? '' : ' disabled') + '>↑</button><button type="button" data-down="' + i + '"' + (i < M.items.length - 1 ? '' : ' disabled') + '>↓</button>' : '') +
        (mine || can ? '<button type="button" data-edit="' + esc(it.id) + '">編輯</button><button type="button" class="del" data-del="' + esc(it.id) + '">移除</button>' : '') + '</div>' +
      '<div class="links">' + mapLinks(it).concat((it.links || []).map(function(k) { return '<a href="' + esc(k.url) + '" target="_blank" rel="noopener">' + esc(k.label) + '</a>'; })).join('') + '</div>' +
      (it.note ? '<div class="note">' + esc(it.note) + '</div>' : '') +
      (can ? '<div class="minutes"><div class="lbl">會議紀錄</div><textarea data-min="' + esc(it.id) + '" placeholder="例：甲公司有興趣，下週帶看">' + esc(it.minutes || '') + '</textarea></div>'
           : (it.minutes ? '<div class="minutes"><div class="lbl">會議紀錄</div><div class="note" style="margin:0;">' + esc(it.minutes) + '</div></div>' : '')) +
      '</div>';
  }).join('');
}
function load(date) {
  $('list').innerHTML = '<div class="loading">讀取中…</div>';
  return post('meetingGet', [auth.name, auth.code, date || '']).then(function(r) { M = r; render(); }).catch(function(e) { $('list').innerHTML = '<div class="empty" style="color:#B3261E;">讀取失敗：' + esc(e.message) + '</div>'; });
}
$('prevW').addEventListener('click', function() { if (M) load(shift(M.date, -7)); });
$('nextW').addEventListener('click', function() { if (M) load(shift(M.date, 7)); });
// 加入物件／編輯
function linkRows(links) {
  links = (links && links.length ? links : [{ label: '網址', url: '' }]);
  return links.map(function(k) { return '<div class="lrow"' + (k.image ? ' data-img="' + esc(k.id) + '"' : '') + '><input type="text" class="lLabel" value="' + esc(k.label) + '" style="max-width:8em;" list="lTypes"><input type="url" class="lUrl" placeholder="https://…" value="' + esc(k.url) + '">' + (k.image ? '<span title="圖片會直接顯示在播放畫面" style="align-self:center;font-size:12px;color:var(--brand);">🖼</span>' : '') + '</div>'; }).join('');
}
