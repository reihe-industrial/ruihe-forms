<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>秘書專區｜瑞禾不動產</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1c2b22;
      --muted: #66776c;
      --paper: #f3f1e9;
      --card: #ffffff;
      --line: #dfe2d7;
      --brand: #2f6f4e;
      --brand-dark: #1e4a32;
      --brand-soft: #e9f1ec;
      --danger: #a3352c;
      --danger-soft: #fbebe9;
      --radius: 10px;
      --t-factory: #3d5a80;  --t-factory-soft: #e6ecf4;
      --t-land: #8a6a1f;     --t-land-soft: #f5eedb;
      --t-house: #8c3f5a;    --t-house-soft: #f6e7ec;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--paper); margin: 0; padding: 20px 16px 60px;
      color: var(--ink); line-height: 1.5;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    .narrow { max-width: 640px; }

    .site-nav { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 16px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
    .site-nav a { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
      color: var(--ink); font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .site-nav a:hover { border-color: var(--brand); color: var(--brand); }
    .site-nav a.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    h1 {
      font-family: "Noto Serif TC", "Noto Sans TC", serif;
      font-size: 23px; font-weight: 700; letter-spacing: 0.02em;
      margin: 4px 0 6px; color: var(--brand-dark);
    }
    .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
    .card h2::before { content: ""; display: inline-block; width: 4px; height: 15px; background: var(--brand); border-radius: 2px; flex-shrink: 0; }

    .field { margin-bottom: 16px; }
    label, .flabel { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
    label.required::after { content: " *"; color: var(--danger); font-weight: 700; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; line-height: 1.55; }
    input, select {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    select { appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2366776c' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 10px center; background-size: 18px; padding-right: 34px; }
    button { font-family: inherit; }
    button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 2px; }

    .btn { border: none; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; padding: 11px 18px; cursor: pointer; }
    .btn:disabled { background: #b9c3ba; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; padding: 7px 13px; }
    .btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
    .btn.ghost:disabled { background: #fff; color: #a9b0a2; }

    .msg { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .msg.error { display: block; background: var(--danger-soft); color: var(--danger); }
    .login-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

    /* 登入後的頂列 */
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
    .topbar .who { font-weight: 700; font-size: 14px; }
    .topbar .status { font-size: 13px; color: var(--muted); flex: 1 1 auto; }
    .topbar .status.warn { color: var(--danger); }
    .topbar .actions { display: flex; gap: 6px; }

    /* 篩選 */
    .filters { padding: 16px 18px; }
    .filter-toggle { display: none; }
    .filter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; align-items: end; }
    .filter-grid .span2 { grid-column: span 2; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button {
      border: 1px solid var(--line); background: #fbfaf6; color: var(--ink); border-radius: 999px;
      padding: 6px 13px; font-size: 13.5px; cursor: pointer;
    }
    .chips button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .range { display: flex; align-items: center; gap: 6px; }
    .range input { padding: 9px 10px; }
    .range span { color: var(--muted); flex: 0 0 auto; }
    .row-sel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-foot { grid-column: 2 / -1; display: flex; justify-content: flex-end; }
    @media (max-width: 899px) { .filter-foot { grid-column: auto; } }

    /* 結果列 */
    .resultbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 10px; }
    .count { font-size: 15px; font-weight: 700; color: var(--brand-dark); }
    .count small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
    .sort-mobile { display: none; max-width: 180px; padding: 7px 30px 7px 10px; font-size: 13.5px; }

    .tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: #eef0ea; color: var(--muted); }
    .tag.t-factory { background: var(--t-factory-soft); color: var(--t-factory); }
    .tag.t-land { background: var(--t-land-soft); color: var(--t-land); }
    .tag.t-house { background: var(--t-house-soft); color: var(--t-house); }
    .tag.rs { background: #fff; border: 1px solid var(--line); color: var(--ink); }

    /* 電腦：表格 */
    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 120px); }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #f8f7f2; z-index: 1; white-space: nowrap; padding: 0; }
    th button { all: unset; display: block; padding: 10px; font-weight: 700; font-size: 13px; color: var(--brand-dark); cursor: pointer; white-space: nowrap; }
    th button:focus-visible { outline: 3px solid var(--brand-soft); }
    th .arrow { color: var(--brand); margin-left: 3px; font-size: 11px; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    td { white-space: nowrap; }
    td.wrap { white-space: normal; min-width: 8em; max-width: 16em; }
    th { padding: 10px; font-size: 13px; font-weight: 700; color: var(--brand-dark); }
    td input[type=text], td select { padding: 6px 8px; font-size: 13.5px; min-width: 7em; }
    td.chk, th.chk { width: 36px; text-align: center; }
    tr.dirty td { background: #fffbea; }
    .tabs { display: flex; gap: 6px; margin-bottom: 14px; }
    .tabs button { flex: 0 0 auto; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px; padding: 8px 16px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; }
    .tabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand); color: #fff; }
    .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 4px 2px 10px; }
    .bar select { width: auto; padding: 7px 30px 7px 10px; font-size: 13.5px; }
    .bar .grow { flex: 1 1 auto; }
    .status-tag { font-size: 12px; font-weight: 700; border-radius: 5px; padding: 1px 7px; }
    .st-待申請 { background: #fff2cc; } .st-申請中 { background: #cfe2f3; } .st-已取得 { background: #d9ead3; } .st-異常待補 { background: #f4cccc; }
    .modal-back { position: fixed; inset: 0; background: rgba(20,30,25,.45); display: none; align-items: center; justify-content: center; z-index: 60; padding: 16px; }
    .modal { background: #fff; border-radius: 12px; padding: 20px; max-width: 420px; width: 100%; }
    .modal h3 { margin: 0 0 10px; font-size: 16px; color: var(--brand-dark); }
    .modal .code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 26px; letter-spacing: 3px; font-weight: 700; text-align: center; padding: 14px; background: var(--brand-soft); border-radius: 8px; margin: 10px 0; }
    .modal .actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 12px; }
    .people-add { display: grid; grid-template-columns: 1fr 160px auto; gap: 10px; align-items: end; }
    @media (max-width: 600px) { .people-add { grid-template-columns: 1fr; } }
    .pcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
    .pcard .row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .pcard .row1 b { font-size: 16px; margin-right: auto; }
    .pcard .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .pcard .row3 { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .rcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
    .rcard.dirty { background: #fffbea; }
    .rcard .row1 { display: flex; gap: 8px; align-items: center; }
    .rcard .row1 b { margin-right: auto; }
    .rcard .meta { font-size: 13.5px; margin-top: 4px; }
    .rcard .edit { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .rcard .edit .wide { grid-column: 1 / -1; }
    td.name { font-weight: 700; white-space: normal; min-width: 8em; max-width: 14em; }
    tbody tr:hover { background: #fafaf5; }

    /* 手機：卡片 */
    .cards { display: grid; gap: 10px; }
    .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .item > summary { list-style: none; cursor: pointer; padding: 14px 14px 12px; }
    .item > summary::-webkit-details-marker { display: none; }
    .item-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-name { font-size: 16px; font-weight: 700; margin-right: auto; }
    .item-price { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .item-price b { font-size: 19px; color: var(--brand-dark); }
    .item-price span { font-size: 13.5px; color: var(--muted); }
    .item-meta { font-size: 13.5px; color: var(--ink); margin-top: 3px; }
    .item-meta.muted { color: var(--muted); }
    .item-more-hint { font-size: 12.5px; color: var(--brand); margin-top: 6px; }
    .item[open] .item-more-hint .open-t { display: none; }
    .item:not([open]) .item-more-hint .close-t { display: none; }
    .item-more { margin: 0; padding: 4px 14px 14px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
    .item-more dt { color: var(--muted); padding-top: 6px; }
    .item-more dd { margin: 0; padding-top: 6px; }

    .empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
    .loading { text-align: center; padding: 40px 16px; color: var(--muted); }

    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; background: var(--brand-dark); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; max-width: 90%; text-align: center; }
    #toast.error { background: var(--danger); }

    @media (max-width: 899px) {
      .filter-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: none; padding: 0; font-size: 15px; font-weight: 700; color: var(--brand-dark); cursor: pointer; }
      .filters:not(.open) .filter-body { display: none; }
      .filters.open .filter-toggle { margin-bottom: 14px; }
      .filter-grid { grid-template-columns: 1fr; gap: 14px; }
      .filter-grid .span2 { grid-column: auto; }
      .sort-mobile { display: block; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .item[open] .item-more { animation: open .15s ease-out; }
      @keyframes open { from { opacity: 0; } to { opacity: 1; } }
    }
  </style>
</head>
<body>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="modal-back" id="modalBack" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h3 id="modalTitle"></h3>
      <div id="modalBody"></div>
      <div class="actions" id="modalActions"></div>
    </div>
  </div>
  <div class="container">
    <nav class="site-nav" id="siteNav" aria-label="表單選單">
    <a href="index.html" data-key="home" data-home="1">登入</a>
    <a href="listing.html" data-key="listing">新增物件</a>
    <a href="client-needs.html" data-key="needs">新增客需</a>
    <a href="land-registry.html" data-key="registry">調謄本</a>
    <span data-auth="1" aria-hidden="true" style="display:none;flex:0 0 1px;background:#dfe2d7;margin:4px 4px;"></span>
    <a href="listing.html?mode=edit" data-key="edit" data-auth="1" style="display:none;">修改物件／客需</a>
    <a href="summary.html" data-key="summary" data-auth="1" style="display:none;">物件簡表</a>
    <a href="client-summary.html" data-key="csummary" data-auth="1" style="display:none;">客需簡表</a>
    <a href="map.html" data-key="map" data-auth="1" style="display:none;">物件地圖</a>
    <a href="master-table.html" data-key="master" data-auth="1" data-roles="主管,秘書,管理員" style="display:none;">物件總表</a>
    <a href="secretary.html" data-key="secretary" data-auth="1" data-roles="秘書,管理員" style="display:none;">秘書專區</a>
  </nav>
  <script>
  (function() {
    var page = location.pathname.split('/').pop();
    var edit = /[?&]mode=edit(&|$)/.test(location.search);
    var key = page === 'land-registry.html' ? 'registry' : page === 'summary.html' ? 'summary'
      : page === 'master-table.html' ? 'master' : page === 'secretary.html' ? 'secretary'
      : page === 'client-summary.html' ? 'csummary' : page === 'map.html' ? 'map'
      : page === 'client-needs.html' ? (edit ? 'edit' : 'needs')
      : (edit ? 'edit' : 'listing');
    // 登入後才看得到的連結（data-auth）；再依身分（data-roles）顯示：這個分頁登入的人、身分，存在 sessionStorage
    window.ruiheUpdateNav_ = function() {
      var o = null;
      try { o = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'); } catch (e) {}
      var loggedIn = !!(o && o.name && o.code), role = (o && o.role) || '';
      var els = document.querySelectorAll('#siteNav [data-auth]');
      for (var j = 0; j < els.length; j++) {
        var roles = els[j].getAttribute('data-roles');
        var okRole = !roles || roles.split(',').indexOf(role) !== -1;
        els[j].style.display = (loggedIn && okRole) ? '' : 'none';
      }
      var home = document.querySelector('#siteNav [data-home]');
      if (home) home.textContent = loggedIn ? '首頁' : '登入';
    };
    // 預先把「新增物件」表單的選項（業務名單、地段）載到這台裝置，第一次打開新增物件就不用等
    if (page !== 'listing.html') {
      setTimeout(function() {
        try {
          if (localStorage.getItem('ruihe_listing_options_v1')) return;
          fetch('https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec', { method: 'POST', body: JSON.stringify({ fn: 'getListingFormOptions', args: [] }) })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res && res.ok && res.result && res.result.districtData && Object.keys(res.result.districtData).length) localStorage.setItem('ruihe_listing_options_v1', JSON.stringify(res.result)); })
            .catch(function() {});
        } catch (e) {}
      }, 2500);
    }
    window.ruiheUpdateNav_();
    var links = document.querySelectorAll('#siteNav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-key') === key) { links[i].className = 'active'; links[i].setAttribute('aria-current', 'page'); }
    }
  })();
  </script>

    <h1>秘書專區</h1>
    <div class="subtitle">申調謄本清單、人員管理（只有秘書可以使用）</div>

    <div class="card narrow" id="loginView">
      <h2>登入</h2>
      <div class="field">
        <label class="required" for="loginName">姓名</label>
        <select id="loginName"><option value="">載入中…</option></select>
      </div>
      <div class="field">
        <label class="required" for="loginCode">通關碼</label>
        <div class="hint">輸入修改案件用的同一組通關碼（英文和數字，不分大小寫）</div>
        <input type="password" id="loginCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
      </div>
      <button type="button" class="btn" id="loginBtn" style="width:100%;">登入</button>
      <div class="msg" id="loginMsg"></div>
      <div class="login-note">在共用電腦上用完，請按「登出」。</div>
    </div>

    <div id="mainView" hidden>
      <div class="topbar">
        <span class="who" id="whoName"></span>
        <span class="status" id="statusText"></span>
        <span class="actions">
          <button type="button" class="btn ghost" id="refreshBtn">重新整理</button>
          <button type="button" class="btn ghost" id="logoutBtn">登出</button>
        </span>
      </div>
      <div class="tabs" role="tablist">
        <button type="button" role="tab" id="tabReg" aria-selected="true">申調謄本</button>
        <button type="button" role="tab" id="tabPeople" aria-selected="false">人員管理</button>
      </div>

      <!-- 申調謄本 -->
      <div id="regView">
        <div class="card filters" id="regFilterCard">
          <button type="button" class="filter-toggle" id="regFilterToggle" aria-expanded="false"><span id="regFilterText">篩選</span><span aria-hidden="true">▾</span></button>
          <div class="filter-body">
            <div class="filter-grid">
              <div class="span2">
                <span class="flabel">狀態</span>
                <div class="chips" id="regStatusChips" role="group" aria-label="狀態"></div>
              </div>
              <div>
                <label for="regAgent">業務</label>
                <select id="regAgent"><option value="">全部業務</option></select>
              </div>
              <div>
                <label for="regKeyword">關鍵字</label>
                <input type="search" id="regKeyword" placeholder="地段、地號、備註…" autocomplete="off">
              </div>
            </div>
          </div>
        </div>
        <div class="bar">
          <span class="count" id="regCount"></span>
          <span class="grow"></span>
          <label style="display:flex;align-items:center;gap:6px;margin:0;font-weight:600;font-size:13.5px;">勾選的改成
            <select id="regBulkStatus"></select></label>
          <button type="button" class="btn ghost" id="regBulkBtn">套用</button>
          <button type="button" class="btn" id="regSaveBtn" style="padding:8px 14px;font-size:14px;">儲存變更</button>
        </div>
        <div id="regResults"><div class="loading">讀取中…</div></div>
      </div>

      <!-- 人員管理 -->
      <div id="peopleView" hidden>
        <div class="card">
          <h2>新增人員</h2>
          <div class="people-add">
            <div><label for="newName">姓名</label><input type="text" id="newName" maxlength="20" autocomplete="off"></div>
            <div id="newRoleWrap" style="display:none;"><label for="newRole">身分</label><select id="newRole"><option>業務</option><option>主管</option><option>秘書</option><option>管理員</option></select></div>
            <div><button type="button" class="btn" id="addPersonBtn">新增並產生通關碼</button></div>
          </div>
        </div>
        <div class="bar">
          <span class="count" id="peopleCount"></span>
          <span class="grow"></span>
          <label style="display:flex;align-items:center;gap:6px;margin:0;font-size:13.5px;"><input type="checkbox" id="showInactive" style="width:auto;"> 顯示不在職的人</label>
        </div>
        <div id="peopleResults"></div>
      </div>
    </div>
  </div>

<script>
var LISTING_API_URL = 'https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec';  // 物件後端（人員管理、登入）
var REG_API_URL = 'https://script.google.com/macros/s/AKfycbxBxEn3c_mfLtT_gH-O2MgT6byDTNdJCWEf0IxFtYVp1oqYJxmFbGXuXzcX3SEam93E/exec';      // 調謄本後端
// ---------- 共用登入（同一個瀏覽器分頁裡，登入一次就能用修改物件／客需、物件簡表、客需簡表） ----------
// 存在 sessionStorage：只在這個分頁有效，關掉分頁就清掉；按「登出」也會清掉（連同兩個簡表的快取）。
var SHARED_LOGIN_KEY = 'ruihe_login_v1';
// 30 分鐘沒有動作（點、打字、捲動、移動滑鼠）自動登出；同一個分頁裡的頁面一起算
var IDLE_LIMIT_MS = 30 * 60 * 1000;
var IDLE_KEY = 'ruihe_last_active_v1';
var idleLastWrite_ = 0;
function idleTouch_(force) {
  var now = Date.now();
  if (!force && now - idleLastWrite_ < 15000) return;
  idleLastWrite_ = now;
  try { sessionStorage.setItem(IDLE_KEY, String(now)); } catch (e) {}
}
function idleExpired_() {
  var t = 0;
  try { t = parseInt(sessionStorage.getItem(IDLE_KEY), 10) || 0; } catch (e) {}
  return t > 0 && Date.now() - t > IDLE_LIMIT_MS;
}
// isLoggedIn()：這一頁現在有沒有登入；onTimeout(訊息)：這一頁的登出
function idleWatch_(isLoggedIn, onTimeout) {
  ['click', 'keydown', 'input', 'touchstart', 'scroll', 'mousemove'].forEach(function(ev) {
    window.addEventListener(ev, function() { if (isLoggedIn()) idleTouch_(); }, { passive: true, capture: true });
  });
  function check() { if (isLoggedIn() && idleExpired_()) onTimeout('30 分鐘沒有動作，已自動登出，請重新登入。'); }
  setInterval(check, 30000);
  document.addEventListener('visibilitychange', function() { if (!document.hidden) check(); });
}
function sharedLoginGet_() {
  if (idleExpired_()) { sharedLoginClear_(); return null; }
  try { var o = JSON.parse(sessionStorage.getItem(SHARED_LOGIN_KEY) || 'null'); return o && o.name && o.code ? o : null; }
  catch (e) { return null; }
}
function sharedLoginSet_(name, code, role) {
  if (!role) { var prev = null; try { prev = JSON.parse(sessionStorage.getItem(SHARED_LOGIN_KEY) || 'null'); } catch (e) {} role = prev && prev.name === name ? prev.role : ''; }
  try { sessionStorage.setItem(SHARED_LOGIN_KEY, JSON.stringify({ name: name, code: code, role: role || '業務' })); } catch (e) {}
  if (window.ruiheUpdateNav_) window.ruiheUpdateNav_();
  try { localStorage.setItem('ruihe_summary_last_name', name); } catch (e) {}
  idleTouch_(true);
}
function sharedRole_() {
  try { var o = JSON.parse(sessionStorage.getItem(SHARED_LOGIN_KEY) || 'null'); return (o && o.role) || '業務'; } catch (e) { return '業務'; }
}
// 沒登入、或登入失效（通關碼失效、30 分鐘沒動作）：回首頁登入，登入後回到原本的頁面
function ruiheGoHome_(msg) {
  try { if (msg) sessionStorage.setItem('ruihe_login_msg', msg); } catch (e) {}
  var here = location.pathname.split('/').pop() + location.search;
  location.replace('index.html?next=' + encodeURIComponent(here));
}
function sharedLoginClear_() {
  // 登出：讓後端的登入憑證馬上失效（憑證才會失效，不影響通關碼）
  try {
    var o_ = JSON.parse(sessionStorage.getItem(SHARED_LOGIN_KEY) || 'null');
    if (o_ && /^S_/.test(o_.code || '')) fetch('https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec', { method: 'POST', body: JSON.stringify({ fn: 'sessionLogout', args: [o_.name, o_.code] }), keepalive: true }).catch(function() {});
  } catch (e) {}
  try { ['ruihe_home_cache_v1', 'ruihe_master_cache_v1', 'ruihe_secretary_cache_v1', 'ruihe_prefetch_at'].forEach(function(k) { sessionStorage.removeItem(k); }); sessionStorage.removeItem(SHARED_LOGIN_KEY); sessionStorage.removeItem(IDLE_KEY); } catch (e) {}
  if (window.ruiheUpdateNav_) window.ruiheUpdateNav_();
  try { localStorage.removeItem('ruihe_summary_cache_v1'); localStorage.removeItem('ruihe_client_summary_cache_v1'); localStorage.removeItem('ruihe_map_cache_v1'); } catch (e) {}
  try { sessionStorage.removeItem('ruihe_edit_lists_v1'); } catch (e) {}
}
// 姓名清單：先用上次存在這台裝置的清單（馬上可以選），同時到後端拿最新的換上
var LOGIN_NAMES_KEY = 'ruihe_login_names_v1';
function fillLoginNames_(sel, names) {
  var keep = sel.value, last = '';
  try { last = localStorage.getItem('ruihe_summary_last_name') || ''; } catch (e) {}
  sel.innerHTML = '';
  var o0 = document.createElement('option'); o0.value = ''; o0.textContent = '請選擇'; sel.appendChild(o0);
  names.forEach(function(n) { var o = document.createElement('option'); o.value = n; o.textContent = n; sel.appendChild(o); });
  var want = keep || last;
  if (want && names.indexOf(want) !== -1) sel.value = want;
}
function loadLoginNames_(sel, fetchNames, onError) {
  var cached = null;
  try { cached = JSON.parse(localStorage.getItem(LOGIN_NAMES_KEY) || 'null'); } catch (e) {}
  var hasCache = Array.isArray(cached) && cached.length > 0;
  if (hasCache) fillLoginNames_(sel, cached);
  fetchNames().then(function(names) {
    try { localStorage.setItem(LOGIN_NAMES_KEY, JSON.stringify(names)); } catch (e) {}
    fillLoginNames_(sel, names);
  }).catch(function(err) { if (!hasCache) onError(err); });
}

var DESKTOP_QUERY = window.matchMedia('(min-width: 900px)');
var auth = null, tab = 'reg', busy = false;
var reg = null;              // { columns, statuses, statusIdx, noteIdx, feeIdx, rows }
var regEdits = {};           // row → { status?, note?, fee? }
var regChecked = {};         // row → true
var regFilters = { status: '', agent: '', keyword: '' };
var people = null, me = '', canEditRoles = false, myRole = '';

function $(id) { return document.getElementById(id); }
function esc(v) {
  return String(v == null ? '' : v).replace(/[&<>"']/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function post(url, fn, args) {
  return fetch(url, { method: 'POST', body: JSON.stringify({ fn: fn, args: args }) })
    .then(function(r) { return r.json(); })
    .then(function(res) {
      if (!res.ok) { var e = new Error(res.message || '系統發生錯誤'); e.fromServer = true; throw e; }
      return res.result;
    });
}
function isAuthError(err) { return err && err.fromServer && /通關碼|請選擇姓名/.test(err.message); }
var toastTimer = null;
function toast(text, isError) {
  var el = $('toast'); el.textContent = text; el.className = isError ? 'error' : ''; el.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function() { el.style.display = 'none'; }, 3000);
}
function handleErr(err) {
  if (isAuthError(err)) { logout(err.message); return; }
  toast(err.message || '連不上系統', true);
}

// ---------- 小視窗 ----------
function modal(title, bodyHtml, buttons) {
  $('modalTitle').textContent = title;
  $('modalBody').innerHTML = bodyHtml;
  var box = $('modalActions'); box.innerHTML = '';
  buttons.forEach(function(b) {
    var btn = document.createElement('button');
    btn.type = 'button'; btn.className = b.primary ? 'btn' : 'btn ghost'; btn.textContent = b.text;
    btn.addEventListener('click', function() { if (b.onClick && b.onClick() === false) return; closeModal(); });
    box.appendChild(btn);
  });
  $('modalBack').style.display = 'flex';
  var first = $('modalBody').querySelector('input'); if (first) first.focus();
}
function closeModal() { $('modalBack').style.display = 'none'; }
function showCode(personName, code) {
  modal(personName + ' 的通關碼', '<div class="code" id="codeText">' + esc(code) + '</div><div class="hint">只會顯示這一次，請抄下來交給本人（不分大小寫）。</div>', [
    { text: '複製', onClick: function() { try { navigator.clipboard.writeText(code); toast('已複製'); } catch (e) {} return false; } },
    { text: '我抄好了', primary: true },
  ]);
}

// ---------- 申調謄本 ----------
function regCol(label) { return reg ? reg.columns.indexOf(label) : -1; }
function regVal(r, label) { var i = regCol(label); return i === -1 ? '' : (r.values[i] || ''); }
function regStatus(r) { var e = regEdits[r.row]; return e && e.status !== undefined ? e.status : (r.values[reg.statusIdx] || '待申請'); }
function regAgentList() {
  var m = {};
  reg.rows.forEach(function(r) { var a = regVal(r, '業務名稱'); if (a) m[a] = (m[a] || 0) + 1; });
  return Object.keys(m).sort(function(a, b) { return m[b] - m[a]; });
}
function regRenderFilters() {
  var opts = [['', '全部']].concat(reg.statuses.map(function(s) { return [s, s]; }));
  $('regStatusChips').innerHTML = opts.map(function(o) {
    var n = o[0] ? reg.rows.filter(function(r) { return regStatus(r) === o[0]; }).length : reg.rows.length;
    return '<button type="button" data-v="' + esc(o[0]) + '" aria-pressed="' + (regFilters.status === o[0]) + '">' + esc(o[1]) + '（' + n + '）</button>';
  }).join('');
  var agents = regAgentList();
  if (regFilters.agent && agents.indexOf(regFilters.agent) === -1) regFilters.agent = '';
  $('regAgent').innerHTML = '<option value="">全部業務</option>' + agents.map(function(a) { return '<option value="' + esc(a) + '">' + esc(a) + '</option>'; }).join('');
  $('regAgent').value = regFilters.agent;
  $('regBulkStatus').innerHTML = reg.statuses.map(function(s) { return '<option' + (s === '已取得' ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('');
}
// 顯示的欄位：時間戳記、Email、狀態、內部備註、費用另外處理
function regShowCols() {
  return reg.columns.map(function(c, i) { return { c: c, i: i }; }).filter(function(x) {
    return x.c && x.i !== 0 && !/^email/i.test(x.c) && x.i !== reg.statusIdx && x.i !== reg.noteIdx && x.i !== reg.feeIdx;
  });
}
function regFiltered() {
  var words = regFilters.keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);
  return reg.rows.filter(function(r) {
    if (regFilters.status && regStatus(r) !== regFilters.status) return false;
    if (regFilters.agent && regVal(r, '業務名稱') !== regFilters.agent) return false;
    var hay = r.values.join(' ').toLowerCase();
    for (var k = 0; k < words.length; k++) if (hay.indexOf(words[k]) === -1) return false;
    return true;
  });
}
function regField(r, key, idx) {
  var e = regEdits[r.row];
  return e && e[key] !== undefined ? e[key] : (idx === -1 ? '' : r.values[idx] || '');
}
function statusSelect(r) {
  var cur = regStatus(r);
  return '<select data-row="' + r.row + '" data-k="status" aria-label="狀態">' + reg.statuses.map(function(s) {
    return '<option' + (s === cur ? ' selected' : '') + '>' + esc(s) + '</option>';
  }).join('') + '</select>';
}
function regRender() {
  if (!reg) return;
  var list = regFiltered();
  var dirty = Object.keys(regEdits).length;
  $('regCount').textContent = '共 ' + list.length + ' 筆' + (dirty ? '｜還沒儲存 ' + dirty + ' 筆' : '');
  $('regSaveBtn').disabled = !dirty;
  $('regSaveBtn').textContent = dirty ? '儲存變更（' + dirty + '）' : '儲存變更';
  var n = (regFilters.status ? 1 : 0) + (regFilters.agent ? 1 : 0) + (regFilters.keyword.trim() ? 1 : 0);
  $('regFilterText').textContent = n ? '篩選（已套用 ' + n + ' 項）' : '篩選';
  if (!reg.rows.length) { $('regResults').innerHTML = '<div class="empty">目前沒有申請。</div>'; return; }
  if (!list.length) { $('regResults').innerHTML = '<div class="empty">沒有符合條件的申請。</div>'; return; }
  var cols = regShowCols();
  if (DESKTOP_QUERY.matches) {
    var allChecked = list.every(function(r) { return regChecked[r.row]; });
    var head = '<th class="chk"><input type="checkbox" id="regCheckAll" aria-label="全選"' + (allChecked ? ' checked' : '') + '></th><th>申請時間</th>' +
      cols.map(function(x) { return '<th>' + esc(x.c) + '</th>'; }).join('') + '<th>狀態</th>' +
      (reg.noteIdx !== -1 ? '<th>內部備註</th>' : '') + (reg.feeIdx !== -1 ? '<th>費用</th>' : '');
    var body = list.map(function(r) {
      return '<tr class="' + (regEdits[r.row] ? 'dirty' : '') + '"><td class="chk"><input type="checkbox" data-chk="' + r.row + '"' + (regChecked[r.row] ? ' checked' : '') + ' aria-label="勾選"></td>' +
        '<td>' + esc(r.ts) + '</td>' + cols.map(function(x) { return '<td class="wrap">' + esc(r.values[x.i]) + '</td>'; }).join('') +
        '<td>' + statusSelect(r) + '</td>' +
        (reg.noteIdx !== -1 ? '<td><input type="text" data-row="' + r.row + '" data-k="note" value="' + esc(regField(r, 'note', reg.noteIdx)) + '" aria-label="內部備註"></td>' : '') +
        (reg.feeIdx !== -1 ? '<td><input type="text" data-row="' + r.row + '" data-k="fee" value="' + esc(regField(r, 'fee', reg.feeIdx)) + '" style="min-width:5em;width:6em;" aria-label="費用"></td>' : '') + '</tr>';
    }).join('');
    $('regResults').innerHTML = '<div class="table-wrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
  } else {
    $('regResults').innerHTML = '<div class="cards">' + list.map(function(r) {
      var place = [regVal(r, '縣市'), regVal(r, '鄉鎮'), regVal(r, '段')].join('');
      var lines = cols.filter(function(x) { return ['業務名稱', '縣市', '鄉鎮', '段'].indexOf(x.c) === -1 && r.values[x.i]; }).map(function(x) {
        return '<div class="meta"><span style="color:var(--muted);">' + esc(x.c) + '：</span>' + esc(r.values[x.i]) + '</div>';
      }).join('');
      return '<div class="rcard' + (regEdits[r.row] ? ' dirty' : '') + '"><div class="row1"><input type="checkbox" data-chk="' + r.row + '" style="width:auto;"' + (regChecked[r.row] ? ' checked' : '') + ' aria-label="勾選">' +
        '<b>' + esc(place || '（沒有地段）') + '</b><span class="status-tag st-' + esc(regStatus(r)) + '">' + esc(regStatus(r)) + '</span></div>' +
        '<div class="meta" style="color:var(--muted);">' + esc(regVal(r, '業務名稱')) + '｜' + esc(r.ts) + '</div>' + lines +
        '<div class="edit"><div>' + statusSelect(r) + '</div>' +
        (reg.feeIdx !== -1 ? '<div><input type="text" data-row="' + r.row + '" data-k="fee" placeholder="費用" value="' + esc(regField(r, 'fee', reg.feeIdx)) + '"></div>' : '<div></div>') +
        (reg.noteIdx !== -1 ? '<div class="wide"><input type="text" data-row="' + r.row + '" data-k="note" placeholder="內部備註" value="' + esc(regField(r, 'note', reg.noteIdx)) + '"></div>' : '') +
        '</div></div>';
    }).join('') + '</div>';
  }
}
function regSetEdit(row, key, value) {
  var r = reg.rows.filter(function(x) { return x.row === row; })[0];
  if (!r) return;
  var idx = key === 'status' ? reg.statusIdx : key === 'note' ? reg.noteIdx : reg.feeIdx;
  var orig = key === 'status' ? (r.values[idx] || '待申請') : (r.values[idx] || '');
  var e = regEdits[row] || {};
  if (String(value) === String(orig)) delete e[key]; else e[key] = value;
  if (Object.keys(e).length) regEdits[row] = e; else delete regEdits[row];
}
function regLoad(manual) {
  if (!auth) return Promise.resolve();
  return post(REG_API_URL, 'regListRequests', [auth.name, auth.code]).then(function(res) {
    reg = res; regChecked = {}; regEdits = {};
    saveSecCache_('reg', res);
    regRenderFilters(); regRender();
    $('statusText').textContent = '讀取時間 ' + new Date().toTimeString().substring(0, 5);
    if (manual) toast('已重新整理');
  });
}
function regSave() {
  var rows = Object.keys(regEdits);
  if (!rows.length) return;
  var items = rows.map(function(row) {
    var r = reg.rows.filter(function(x) { return String(x.row) === String(row); })[0];
    return Object.assign({ row: Number(row), ts: r.ts }, regEdits[row]);
  });
  var btn = $('regSaveBtn'); btn.disabled = true; btn.textContent = '儲存中…';
  post(REG_API_URL, 'regUpdateRequests', [auth.name, auth.code, items])
    .then(function(res) { toast('已儲存 ' + res.updated + ' 筆'); return regLoad(); })
    .catch(function(err) { handleErr(err); regLoad().catch(function() {}); });
}

// ---------- 人員管理 ----------
function peopleLoad() {
  return post(LISTING_API_URL, 'adminListPeople', [auth.name, auth.code]).then(applyPeople_);
}
// 秘書專區暫存在這個分頁：換頁回來先顯示上次的人員和謄本清單，背景再更新；登出清掉
var SEC_CACHE_KEY = 'ruihe_secretary_cache_v1';
function loadSecCache_(name) { try { var c = JSON.parse(sessionStorage.getItem(SEC_CACHE_KEY) || 'null'); return c && c.name === name ? c : null; } catch (e) { return null; } }
function saveSecCache_(part, value) {
  if (!auth) return;
  try { var c = loadSecCache_(auth.name) || { name: auth.name }; c[part] = value; sessionStorage.setItem(SEC_CACHE_KEY, JSON.stringify(c)); } catch (e) {}
}
function applyPeople_(res) {
  saveSecCache_('people', res);
  people = res.people; me = res.me; canEditRoles = !!res.canEditRoles; myRole = res.myRole || '';
  $('newRoleWrap').style.display = canEditRoles ? '' : 'none';
  peopleRender();
}
// 只有管理員能改身分；秘書看得到但不能改，也不能動管理員的資料
function lockedFor_(p) { return !canEditRoles && p.role === '管理員'; }
function roleSelect(p) {
  if (!canEditRoles || p.name === me) return '<span class="tag">' + esc(p.role) + '</span>';
  return '<select data-p="' + esc(p.name) + '" data-k="role" aria-label="身分">' +
    ['業務', '主管', '秘書', '管理員'].map(function(r) { return '<option' + (r === p.role ? ' selected' : '') + '>' + r + '</option>'; }).join('') + '</select>';
}
// Google 登入用的 Gmail：只有管理員能設定、修改、清除；秘書只能看
function googleCell_(p) {
  var txt = p.google ? esc(p.google) + (p.googleLinked ? '' : ' <span style="color:var(--muted);font-size:12.5px;">（還沒用 Google 登入過）</span>') : '<span style="color:var(--muted);">未設定</span>';
  if (!canEditRoles) return txt;
  var btn = 'class="btn ghost" style="padding:4px 10px;font-size:12.5px;"';
  return txt + ' <button type="button" ' + btn + ' data-gset="' + esc(p.name) + '">' + (p.google ? '修改' : '設定') + '</button>' +
    (p.google ? ' <button type="button" ' + btn + ' data-gunbind="' + esc(p.name) + '">清除</button>' : '');
}
function codeButtons_(p) {
  if (lockedFor_(p)) return '<span style="color:var(--muted);font-size:13px;">管理員自己管理</span>';
  return '<button type="button" class="btn ghost" data-gen="' + esc(p.name) + '">產生新通關碼</button> <button type="button" class="btn ghost" data-set="' + esc(p.name) + '">自訂通關碼</button>';
}
function activeSelect(p) {
  return '<select data-p="' + esc(p.name) + '" data-k="active" aria-label="在職"' + (p.name === me || lockedFor_(p) ? ' disabled title="不能改"' : '') + '>' +
    '<option value="1"' + (p.active ? ' selected' : '') + '>在職</option><option value="0"' + (!p.active ? ' selected' : '') + '>不在職</option></select>';
}
function peopleRender() {
  if (!people) return;
  var showAll = $('showInactive').checked;
  var list = people.filter(function(p) { return showAll || p.active; });
  $('peopleCount').textContent = '在職 ' + people.filter(function(p) { return p.active; }).length + ' 人' + (showAll ? '，共 ' + people.length + ' 人' : '');
  if (DESKTOP_QUERY.matches) {
    $('peopleResults').innerHTML = '<div class="table-wrap"><table><thead><tr><th>姓名</th><th>在職</th><th>身分</th><th>通關碼</th><th>Google 登入</th><th></th></tr></thead><tbody>' +
      list.map(function(p) {
        return '<tr><td class="name">' + esc(p.name) + (p.name === me ? '（你）' : '') + '</td><td>' + activeSelect(p) + '</td><td>' + roleSelect(p) + '</td>' +
          '<td>' + (p.hasCode ? '已設定' : '<span style="color:var(--danger);font-weight:700;">還沒有</span>') + '</td>' +
          '<td class="wrap">' + googleCell_(p) + '</td>' +
          '<td>' + codeButtons_(p) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  } else {
    $('peopleResults').innerHTML = '<div class="cards">' + list.map(function(p) {
      return '<div class="pcard"><div class="row1"><b>' + esc(p.name) + (p.name === me ? '（你）' : '') + '</b>' +
        (p.hasCode ? '<span class="tag">已設定通關碼</span>' : '<span class="tag" style="color:var(--danger);">還沒有通關碼</span>') + '</div>' +
        '<div class="row2">' + activeSelect(p) + roleSelect(p) + '</div>' +
        '<div class="meta" style="margin-top:8px;font-size:13.5px;">Google 登入：' + googleCell_(p) + '</div>' +
        '<div class="row3">' + codeButtons_(p) + '</div></div>';
    }).join('') + '</div>';
  }
}
function savePerson(personName, changes) {
  var p = people.filter(function(x) { return x.name === personName; })[0];
  if (!p) return;
  var person = { name: p.name, active: changes.active !== undefined ? changes.active : p.active, role: changes.role || p.role };
  post(LISTING_API_URL, 'adminSavePerson', [auth.name, auth.code, person])
    .then(function(res) { applyPeople_(res); toast('已更新 ' + personName); })
    .catch(function(err) { handleErr(err); peopleRender(); });
}
function genCode(personName, custom) {
  return post(LISTING_API_URL, 'adminSetPasscode', [auth.name, auth.code, personName, custom || ''])
    .then(function(res) {
      people.forEach(function(p) { if (p.name === personName) p.hasCode = true; });
      peopleRender(); showCode(res.name, res.code);
    });
}

// ---------- 登入 ----------
function showLoginError(text) { var m = $('loginMsg'); m.textContent = text; m.className = 'msg error'; }
function login(auto) {
  var name = auto ? auto.name : $('loginName').value, code = auto ? auto.code : $('loginCode').value.replace(/\s+/g, '');
  if (!name || !code) { showLoginError('請選擇姓名並輸入通關碼。'); return; }
  var btn = $('loginBtn'); btn.disabled = true; btn.textContent = '登入中…'; $('loginMsg').className = 'msg';
  auth = { name: name, code: code };
  var sc = auto ? loadSecCache_(name) : null;
  if (sc && sc.people) {   // 先顯示上次的資料，背景同時更新人員和謄本
    applyPeople_(sc.people);
    if (sc.reg) { reg = sc.reg; regChecked = {}; regEdits = {}; regRenderFilters(); regRender(); }
    $('whoName').textContent = name; $('loginView').hidden = true; $('mainView').hidden = false;
    showTab(tab);
    btn.disabled = false; btn.textContent = '登入';
    peopleLoad().catch(handleErr);
    if (!Object.keys(regEdits).length) regLoad().catch(handleErr);
    return;
  }
  // 人員清單（只有秘書、管理員可以）和謄本清單同時讀
  var regP = regLoad();
  regP.catch(function() {});   // 錯誤等登入成功後再處理
  peopleLoad().then(function() {
    sharedLoginSet_(name, code, myRole || '秘書');
    $('loginCode').value = ''; $('whoName').textContent = name;
    $('loginView').hidden = true; $('mainView').hidden = false;
    showTab(tab);
    return regP.catch(handleErr);
  }).catch(function(err) {
    if (!$('mainView').hidden) { handleErr(err); return; }
    auth = null;
    if (isAuthError(err)) { sharedLoginClear_(); ruiheGoHome_(err.message); return; }
    if (/只有.{0,6}可以/.test(err.message || '')) { ruiheGoHome_(err.message); return; }
    showLoginError(err.message || '連不上系統');
  }).then(function() { btn.disabled = false; btn.textContent = '登入'; });
}
function logout(reason) { logoutLocal_(reason); ruiheGoHome_(reason); }
function logoutLocal_(reason) {
  sharedLoginClear_();
  auth = null; reg = null; people = null; regEdits = {}; regChecked = {};
  $('mainView').hidden = true; $('loginView').hidden = false;
  $('regResults').innerHTML = '<div class="loading">讀取中…</div>';
  if (reason) showLoginError(reason); else $('loginMsg').className = 'msg';
}
function showTab(t) {
  tab = t;
  $('tabReg').setAttribute('aria-selected', String(t === 'reg'));
  $('tabPeople').setAttribute('aria-selected', String(t === 'people'));
  $('regView').hidden = t !== 'reg';
  $('peopleView').hidden = t !== 'people';
}

// ---------- 事件 ----------
$('loginBtn').addEventListener('click', function() { login(); });
$('loginCode').addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
$('logoutBtn').addEventListener('click', function() {
  if (Object.keys(regEdits).length && !confirm('還有沒儲存的變更，確定要登出嗎？')) return;
  logout();
});
$('refreshBtn').addEventListener('click', function() {
  if (tab === 'reg') {
    if (Object.keys(regEdits).length && !confirm('還有沒儲存的變更，重新整理會不見，確定嗎？')) return;
    regLoad(true).catch(handleErr);
  } else peopleLoad().then(function() { toast('已重新整理'); }).catch(handleErr);
});
$('tabReg').addEventListener('click', function() { showTab('reg'); });
$('tabPeople').addEventListener('click', function() { showTab('people'); });
$('regFilterToggle').addEventListener('click', function() {
  var card = $('regFilterCard'), open = !card.classList.contains('open');
  card.classList.toggle('open', open); this.setAttribute('aria-expanded', String(open));
});
$('regStatusChips').addEventListener('click', function(e) {
  var b = e.target.closest('button'); if (!b) return;
  regFilters.status = b.getAttribute('data-v'); regRenderFilters(); regRender();
});
$('regAgent').addEventListener('change', function() { regFilters.agent = this.value; regRender(); });
var kwT = null;
$('regKeyword').addEventListener('input', function() { var v = this.value; clearTimeout(kwT); kwT = setTimeout(function() { regFilters.keyword = v; regRender(); }, 200); });
$('regResults').addEventListener('change', function(e) {
  var t = e.target;
  if (t.id === 'regCheckAll') { regFiltered().forEach(function(r) { if (t.checked) regChecked[r.row] = true; else delete regChecked[r.row]; }); regRender(); return; }
  if (t.getAttribute('data-chk')) { var rw = Number(t.getAttribute('data-chk')); if (t.checked) regChecked[rw] = true; else delete regChecked[rw]; return; }
  if (t.getAttribute('data-k')) { regSetEdit(Number(t.getAttribute('data-row')), t.getAttribute('data-k'), t.value); regRenderFilters(); regRender(); }
});
$('regBulkBtn').addEventListener('click', function() {
  var rows = Object.keys(regChecked);
  if (!rows.length) { toast('請先勾選要改的申請', true); return; }
  var st = $('regBulkStatus').value;
  rows.forEach(function(r) { regSetEdit(Number(r), 'status', st); });
  regChecked = {}; regRenderFilters(); regRender();
  toast('已把 ' + rows.length + ' 筆改成「' + st + '」，按「儲存變更」才會存進去');
});
$('regSaveBtn').addEventListener('click', regSave);
$('showInactive').addEventListener('change', peopleRender);
$('peopleResults').addEventListener('change', function(e) {
  var t = e.target, p = t.getAttribute('data-p');
  if (!p) return;
  if (t.getAttribute('data-k') === 'role') savePerson(p, { role: t.value });
  else savePerson(p, { active: t.value === '1' });
});
$('peopleResults').addEventListener('click', function(e) {
  var gs = e.target.closest('[data-gset]');
  if (gs) {
    var sn = gs.getAttribute('data-gset');
    var cur = (people.filter(function(x) { return x.name === sn; })[0] || {}).google || '';
    modal('設定「' + sn + '」的 Gmail', '<div class="field"><label for="gmailInput">Gmail</label><div class="hint">填他用來登入的 Google 帳號，例如 abc@gmail.com；同一個 Gmail 也要加到 Google Cloud 的「測試使用者」</div><input type="email" id="gmailInput" maxlength="80" autocomplete="off" value="' + esc(cur) + '"></div><div class="msg" id="gmailMsg"></div>', [
      { text: '取消' },
      { text: '儲存', primary: true, onClick: function() {
        var v = $('gmailInput').value.trim();
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)) { var m = $('gmailMsg'); m.textContent = '請輸入正確的 Gmail。'; m.className = 'msg error'; return false; }
        post(LISTING_API_URL, 'adminSetGoogle', [auth.name, auth.code, sn, v]).then(function(res) { applyPeople_(res); toast('已設定 ' + sn + ' 的 Gmail'); }).catch(handleErr);
      } },
    ]);
    return;
  }
  var gu = e.target.closest('[data-gunbind]');
  if (gu) {
    var gn = gu.getAttribute('data-gunbind');
    modal('清除 Google 設定', '<div>要清除「' + esc(gn) + '」的 Gmail 設定嗎？清除後他只能用通關碼登入。</div>', [
      { text: '取消' },
      { text: '清除', primary: true, onClick: function() {
        post(LISTING_API_URL, 'adminUnbindGoogle', [auth.name, auth.code, gn]).then(function(res) { applyPeople_(res); toast('已清除 ' + gn + ' 的 Google 設定'); }).catch(handleErr);
      } },
    ]);
    return;
  }
  var g = e.target.closest('[data-gen]'), s = e.target.closest('[data-set]');
  if (g) {
    var n = g.getAttribute('data-gen');
    modal('產生新通關碼', '<div>要幫「' + esc(n) + '」產生新的通關碼嗎？舊的通關碼會馬上失效。</div>', [
      { text: '取消' },
      { text: '產生', primary: true, onClick: function() { genCode(n).catch(handleErr); } },
    ]);
  }
  if (s) {
    var n2 = s.getAttribute('data-set');
    modal('自訂通關碼', '<div class="field"><label for="customCode">「' + esc(n2) + '」的新通關碼</label><div class="hint">6～20 個英文或數字</div><input type="text" id="customCode" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"></div><div class="msg" id="customMsg"></div>', [
      { text: '取消' },
      { text: '設定', primary: true, onClick: function() {
        var v = $('customCode').value.replace(/\s+/g, '').toUpperCase();
        if (!/^[A-Z0-9]{6,20}$/.test(v)) { var m = $('customMsg'); m.textContent = '請輸入 6～20 個英文或數字。'; m.className = 'msg error'; return false; }
        genCode(n2, v).catch(handleErr);
      } },
    ]);
  }
});
$('addPersonBtn').addEventListener('click', function() {
  var n = $('newName').value.trim(), role = $('newRole').value;
  if (!n) { toast('請填姓名', true); return; }
  var btn = this; btn.disabled = true; btn.textContent = '新增中…';
  post(LISTING_API_URL, 'adminSavePerson', [auth.name, auth.code, { name: n, role: role, active: true, isNew: true }])
    .then(function(res) { applyPeople_(res); $('newName').value = ''; return genCode(n); })
    .catch(handleErr)
    .then(function() { btn.disabled = false; btn.textContent = '新增並產生通關碼'; });
});
$('modalBack').addEventListener('click', function(e) { if (e.target === this) closeModal(); });
document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeModal(); });
window.addEventListener('beforeunload', function(e) { if (Object.keys(regEdits).length) { e.preventDefault(); e.returnValue = ''; } });
var lastDesktop = DESKTOP_QUERY.matches;
window.addEventListener('resize', function() { if (DESKTOP_QUERY.matches !== lastDesktop) { lastDesktop = DESKTOP_QUERY.matches; regRender(); peopleRender(); } });

loadLoginNames_($('loginName'), function() {
  return post(LISTING_API_URL, 'getEditLoginOptions', []).then(function(res) { return res.personList || []; });
}, function(err) { $('loginName').innerHTML = '<option value="">載入失敗，請重新整理頁面</option>'; showLoginError(err.message || '連不上系統'); });
idleWatch_(function() { return !!auth; }, function(msg) { logout(msg); });
if (sharedLoginGet_()) login(sharedLoginGet_()); else ruiheGoHome_();
</script>
</body>
</html>
