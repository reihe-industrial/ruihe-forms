<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }
    #toastNotice {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 9999; max-width: 90%; padding: 14px 20px; border-radius: 10px;
      font-size: 15px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      display: none; text-align: center;
    }
    #toastNotice.success { background: #2f6f4e; color: #fff; }
    #toastNotice.error { background: #c0392b; color: #fff; }
    :root {
      --ink: #1c2b22;
      --muted: #66776c;
      --paper: #f3f1e9;
      --card: #ffffff;
      --line: #dfe2d7;
      --brand: #2f6f4e;
      --brand-dark: #1e4a32;
      --brand-soft: #e9f1ec;
      --danger: #a3352c;
      --danger-soft: #fbebe9;
      --radius: 10px;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--paper);
      margin: 0;
      padding: 20px 16px 60px;
      color: var(--ink);
      line-height: 1.5;
    }
    .container { max-width: 760px; margin: 0 auto; }

    h1 {
      font-family: "Noto Serif TC", "Noto Sans TC", serif;
      font-size: 23px; font-weight: 700; letter-spacing: 0.02em;
      margin: 4px 0 6px; color: var(--brand-dark);
    }
    .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 20px; }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 20px;
      margin-bottom: 14px;
    }
    .card h2 {
      font-size: 15px; font-weight: 700; margin: 0 0 16px;
      color: var(--brand-dark);
      display: flex; align-items: center; gap: 8px;
    }
    .card h2::before {
      content: ""; display: inline-block; width: 4px; height: 15px;
      background: var(--brand); border-radius: 2px; flex-shrink: 0;
    }

    .field { margin-bottom: 16px; }
    .field:last-child { margin-bottom: 0; }
    label { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
    label.required::after { content: " *"; color: var(--danger); font-weight: 700; }

    input, select, textarea {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px;
      background: #fff; color: var(--ink);
      font-family: inherit;
      transition: border-color .15s ease, box-shadow .15s ease;
    }
    input::placeholder, textarea::placeholder { color: #a9b0a2; }
    input:focus, select:focus, textarea:focus {
      outline: none; border-color: var(--brand);
      box-shadow: 0 0 0 3px var(--brand-soft);
    }
    textarea { resize: vertical; min-height: 64px; }
    select { appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2366776c' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 10px center; background-size: 18px;
      padding-right: 34px;
    }

    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .checkbox-group { display: flex; flex-wrap: wrap; gap: 8px 6px; }
    .checkbox-group label {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 13.5px; font-weight: 400; color: var(--ink);
      background: #fbfaf6; border: 1px solid var(--line); border-radius: 999px;
      padding: 6px 12px 6px 10px; margin: 0; cursor: pointer;
    }
    .checkbox-group label:has(input:checked) {
      background: var(--brand-soft); border-color: var(--brand); color: var(--brand-dark);
    }
    .checkbox-group input { width: auto; accent-color: var(--brand); }

    .field.field-missing { background: var(--danger-soft); border-radius: 8px; box-shadow: 0 0 0 2px var(--danger); padding: 8px 10px; }
    .missing-msg { color: var(--danger); font-size: 12.5px; font-weight: 600; margin: 0 0 6px; }

    /* 送出前確認摘要 */
    .confirm-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 9998; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .confirm-box { background: #fff; border-radius: 12px; max-width: 520px; width: 100%; max-height: 88vh; overflow: auto; padding: 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.25); }
    .confirm-box h3 { margin: 0 0 4px; font-size: 17px; color: var(--brand-dark); }
    .confirm-box .confirm-sub { font-size: 12.5px; color: var(--muted); margin-bottom: 12px; }
    .confirm-row { display: grid; grid-template-columns: 96px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px dashed var(--line); font-size: 13.5px; }
    .confirm-row .k { color: var(--muted); font-weight: 600; }
    .confirm-row .v { word-break: break-word; white-space: pre-line; }
    .confirm-actions { display: flex; gap: 10px; margin-top: 16px; }
    .confirm-actions button { flex: 1; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 8px; border: none; cursor: pointer; }
    .confirm-actions .confirm-back { background: #eee; color: #333; }
    .confirm-actions .confirm-ok { background: var(--brand); color: #fff; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; white-space: pre-line; line-height: 1.55; }
    .other-input { margin-top: 8px; }

    .type-block {
      border: 1px dashed var(--line); border-radius: 8px; padding: 16px;
      margin-top: 14px; display: none; background: #fbfaf6;
    }
    .type-block .type-block-title {
      font-weight: 700; font-size: 14px; margin: 0 0 14px; color: var(--brand-dark);
    }

    .region-entry {
      margin-bottom: 12px; padding-bottom: 12px; border-bottom: 1px dashed var(--line);
    }
    .region-entry:last-child { border-bottom: none; margin-bottom: 4px; padding-bottom: 0; }
    .region-head { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
    .region-entry select { padding: 9px 10px; font-size: 14px; }
    .region-towns { display: none; margin-top: 10px; }
    .region-towns-bar {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 12px; color: var(--muted); margin-bottom: 6px;
    }
    .select-all-btn {
      background: none; border: 1px solid var(--line); border-radius: 999px;
      padding: 3px 10px; font-size: 12px; color: var(--brand-dark); cursor: pointer;
    }

    .remove-btn {
      background: var(--danger-soft); color: var(--danger); border: none; border-radius: 8px;
      padding: 8px 12px; cursor: pointer; font-size: 13px; font-weight: 600;
    }
    .add-row-btn {
      background: var(--brand-soft); color: var(--brand-dark);
      border: 1px dashed var(--brand); border-radius: 8px;
      padding: 10px 14px; cursor: pointer; font-size: 13.5px; font-weight: 600;
      width: 100%; margin-top: 6px;
    }

    button.submit {
      width: 100%; padding: 15px; font-size: 16px; font-weight: 700;
      background: var(--brand); color: #fff; border: none; border-radius: 10px;
      cursor: pointer; letter-spacing: 0.03em;
      transition: background .15s ease;
    }
    button.submit:hover:not(:disabled) { background: var(--brand-dark); }
    button.submit:disabled { background: #b9c3ba; cursor: not-allowed; }

    .msg {
      margin-top: 12px; padding: 13px 14px; border-radius: 8px;
      font-size: 14px; line-height: 1.6; display: none; white-space: pre-wrap;
    }
    .msg.success { background: var(--brand-soft); color: var(--brand-dark); display: block; }
    .msg.error { background: var(--danger-soft); color: var(--danger); display: block; }

    /* 兩欄緊湊排版 */
    .card, .type-block { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
    .card > *:not(.field) { grid-column: 1 / -1; }
    .type-block > .type-block-title { grid-column: 1 / -1; margin: 0; }
    .card h2 { margin-bottom: 4px; }
    .type-block { margin-top: 6px; }
    .field, .field:last-child { margin-bottom: 0; }
    .field:has(.checkbox-group), .field:has(textarea), .field:has(#houseLayoutDetail) { grid-column: 1 / -1; }
    @media (max-width: 480px) {
      .card, .type-block { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
<div id="toastNotice"></div>
<div class="container">
  <h1>客需資料填寫表</h1>
  <div class="subtitle">業務拜訪或電話聯繫客戶後填寫，記錄客戶購買／承租需求</div>

  <div id="draftBanner" style="display:none; background:#fff8e1; border:1px solid #e0c341; border-radius:10px; padding:14px; margin-bottom:16px; font-size:14px; color:#5a4a00;">
    偵測到瀏覽器裡有尚未送出的草稿，要繼續剛才填到一半的內容嗎？
    <div style="margin-top:10px; display:flex; gap:8px;">
      <button type="button" id="restoreDraftBtn" style="flex:1; padding:9px; background:#2f6f4e; color:#fff; border:none; border-radius:8px; cursor:pointer; font-weight:600;">繼續使用草稿</button>
      <button type="button" id="discardDraftBtn" style="flex:1; padding:9px; background:#eee; color:#333; border:none; border-radius:8px; cursor:pointer;">捨棄，重新開始</button>
    </div>
  </div>

  <!-- 一、客戶資料 -->
  <div class="card">
    <h2>一、客戶資料</h2>
    <div class="field">
      <label class="required">負責業務（可複選）</label>
      <div class="checkbox-group" id="businessCheckGroup"></div>
      <input type="text" id="businessOtherInput" class="other-input" placeholder="請輸入姓名（多位請用頓號「、」分隔）" style="display:none;">
    </div>
    <div class="field">
      <label class="required">填表日期</label>
      <input type="date" id="fillDate">
    </div>
    <div class="field">
      <label>資訊來源</label>
      <select id="sourceSelect">
        <option value="">請選擇</option>
        <option>服務中心</option><option>網路詢問</option><option>廣告來電</option>
        <option>同行介紹</option><option>客戶介紹</option><option>公部門</option><option>其他</option>
      </select>
      <input type="text" id="sourceOtherInput" class="other-input" placeholder="請輸入資訊來源" style="display:none;">
    </div>
    <div class="field">
      <label>客戶身份</label>
      <select id="identitySelect">
        <option value="">請選擇</option>
        <option>自然人</option><option>法人團體</option><option>代理人</option><option>其他</option>
      </select>
    </div>
    <div class="field">
      <label>公司／客戶名稱</label>
      <input type="text" id="clientNameInput">
    </div>
    <div class="field">
      <label>聯絡人與職稱</label>
      <input type="text" id="contactPersonInput">
    </div>
    <div class="field">
      <label>聯絡電話</label>
      <input type="text" id="contactPhoneInput">
    </div>
    <div class="field">
      <label>Line ID</label>
      <input type="text" id="lineIdInput">
    </div>
    <div class="field">
      <label>Email</label>
      <input type="text" id="emailInput">
    </div>
  </div>

  <!-- 二、物件需求 -->
  <div class="card">
    <h2>二、物件需求</h2>

    <div class="field">
      <label class="required">物件類型（可複選）</label>
      <div class="checkbox-group" id="propertyTypeGroup">
        <label><input type="checkbox" class="propertyTypeCheckbox" value="廠房">廠房</label>
        <label><input type="checkbox" class="propertyTypeCheckbox" value="土地">土地</label>
        <label><input type="checkbox" class="propertyTypeCheckbox" value="房屋">房屋</label>
      </div>
    </div>

    <div class="field">
      <label class="required">需求類型</label>
      <select id="demandTypeSelect">
        <option value="">請選擇</option>
        <option>購買</option><option>承租</option><option>皆可</option>
      </select>
    </div>

    <div class="field" id="landKindBlock" style="display:none;">
      <label>需求土地種類（可複選）</label>
      <div class="checkbox-group" id="landKindGroup">
        <label><input type="checkbox" class="landKindCheckbox" value="建廠用">建廠用</label>
        <label><input type="checkbox" class="landKindCheckbox" value="農地">農地</label>
        <label><input type="checkbox" class="landKindCheckbox" value="建地">建地</label>
        <label><input type="checkbox" class="landKindCheckbox" value="停車場用">停車場用</label>
        <label><input type="checkbox" class="landKindCheckbox" value="倉儲用">倉儲用</label>
        <label><input type="checkbox" class="landKindCheckbox" value="其他" id="landKindOtherCheckbox">其他</label>
      </div>
      <input type="text" id="landUseOtherInput" class="other-input" placeholder="請輸入土地種類／用途" style="display:none;">
    </div>

    <div class="field" id="industryBlock" style="display:none;">
      <label>產業類別</label>
      <div class="checkbox-group" id="industryCheckGroup"></div>
      <input type="text" id="industryOtherInput" class="other-input" placeholder="請輸入產業別" style="display:none;">
    </div>

    <!-- 廠房區塊 -->
    <div class="type-block" id="factoryBlock">
      <div class="type-block-title">廠房需求</div>
      <div class="field buy-field"><label>廠房需求坪數</label><input type="text" id="factoryAreaBuy"></div>
      <div class="field buy-field"><label>廠房總價上限(萬元)</label><input type="text" id="factoryPriceBuy"></div>
      <div class="field rent-field"><label>廠房需求坪數（承租）</label><input type="text" id="factoryAreaRent"></div>
      <div class="field rent-field"><label>廠房租金上限(元/坪/月)</label><input type="text" id="factoryRent"></div>
      <div class="field rent-field"><label>廠房預計租期</label><input type="text" id="factoryRentTerm" placeholder="例：3年"></div>
      <div class="field">
        <label>土地坪數需求</label>
        <input type="text" id="factoryLandArea">
      </div>
      <div class="field">
        <label>需求土地分區</label>
        <input type="text" id="factoryLandZoning" placeholder="例：乙種工業區、丁種建築用地">
      </div>
      <div class="field">
        <label class="required">廠房淨高需求（公尺）</label>
        <div class="hint">例：最低6米</div>
        <input type="text" id="factoryHeight">
      </div>
      <div class="field">
        <label class="required">電力需求</label>
        <div class="hint">例：需300KW以上</div>
        <input type="text" id="factoryPower">
      </div>
      <div class="field">
        <label class="required">用水需求</label>
        <input type="text" id="factoryWater">
      </div>
      <div class="field">
        <label>是否需要天車</label>
        <select id="factoryCrane">
          <option value="">請選擇</option><option>需要</option><option>不需要</option><option>有無皆可</option>
        </select>
      </div>
      <div class="field" id="craneTonBlock" style="display:none;">
        <label>天車需求噸數</label>
        <input type="text" id="factoryCraneTon">
      </div>
      <div class="field">
        <label>是否需要裝卸月台/碼頭</label>
        <select id="factoryDock">
          <option value="">請選擇</option><option>需要</option><option>不需要</option><option>有無皆可</option>
        </select>
      </div>
      <div class="field">
        <label>是否需要汙水處理設施</label>
        <select id="factorySewage">
          <option value="">請選擇</option><option>需要</option><option>不需要</option><option>有無皆可</option>
        </select>
      </div>
      <div class="field">
        <label class="required">廠房其他需求</label>
        <div class="hint">如：需要臨12米路、需要鄰近台積電、要鄰近高速公路...等</div>
        <textarea id="factoryOther"></textarea>
      </div>
    </div>

    <!-- 土地區塊 -->
    <div class="type-block" id="landBlock">
      <div class="type-block-title">土地需求</div>
      <div class="field buy-field"><label>土地需求面積(坪)</label><input type="text" id="landAreaBuy"></div>
      <div class="field buy-field"><label>土地總價上限(萬元)</label><input type="text" id="landPriceBuy"></div>
      <div class="field rent-field"><label>土地需求面積（承租）(坪)</label><input type="text" id="landAreaRent"></div>
      <div class="field rent-field"><label>土地租金上限(元/坪/月)</label><input type="text" id="landRent"></div>
      <div class="field rent-field"><label>土地預計租期</label><input type="text" id="landRentTerm" placeholder="例：3年"></div>
      <div class="field">
        <label>地形需求</label>
        <select id="landShape">
          <option value="">請選擇</option><option>方正</option><option>不規則皆可</option>
        </select>
      </div>
      <div class="field">
        <label>鄰路寬度需求</label>
        <input type="text" id="landRoadWidth" placeholder="例：臨8米以上道路">
      </div>
      <div class="field">
        <label>需求土地分區</label>
        <input type="text" id="landZoning" placeholder="例：乙種工業區、丁種建築用地">
      </div>
      <div class="field">
        <label>土地其他需求</label>
        <textarea id="landOther"></textarea>
      </div>
    </div>

    <!-- 房屋區塊 -->
    <div class="type-block" id="houseBlock">
      <div class="type-block-title">房屋需求</div>
      <div class="field buy-field"><label>房屋需求坪數</label><input type="text" id="houseAreaBuy"></div>
      <div class="field buy-field"><label>房屋總價上限(萬元)</label><input type="text" id="housePriceBuy"></div>
      <div class="field rent-field"><label>房屋需求坪數（承租）</label><input type="text" id="houseAreaRent"></div>
      <div class="field rent-field"><label>房屋租金上限(元/月)</label><input type="text" id="houseRent"></div>
      <div class="field rent-field"><label>房屋預計租期</label><input type="text" id="houseRentTerm" placeholder="例：1年"></div>
      <div class="field">
        <label>需求房型</label>
        <select id="houseLayoutSelect">
          <option value="">請選擇</option><option>不限</option><option>開放式格局</option><option>有格局</option>
        </select>
        <div id="houseLayoutDetail" style="display:none; margin-top:8px;">
          <span style="display:inline-flex;align-items:center;gap:3px;margin-right:12px;"><input type="number" id="houseRoomCount" style="width:60px;" min="0"> 房</span>
          <span style="display:inline-flex;align-items:center;gap:3px;margin-right:12px;"><input type="number" id="houseHallCount" style="width:60px;" min="0"> 廳</span>
          <span style="display:inline-flex;align-items:center;gap:3px;"><input type="number" id="houseBathCount" style="width:60px;" min="0"> 衛</span>
        </div>
      </div>
      <div class="field">
        <label>樓層需求</label>
        <input type="text" id="houseFloor" placeholder="例：3樓以上、不要頂樓">
      </div>
      <div class="field">
        <label>屋齡需求</label>
        <input type="text" id="houseAge" placeholder="例：15年內">
      </div>
      <div class="field">
        <label>車位需求</label>
        <select id="houseParking">
          <option value="">請選擇</option><option>需要</option><option>不需要</option><option>有無皆可</option>
        </select>
      </div>
      <div class="field">
        <label>房屋其他需求</label>
        <textarea id="houseOther"></textarea>
      </div>
    </div>
  </div>

  <!-- 三、目標區域 -->
  <div class="card">
    <h2>三、目標區域</h2>
    <div class="hint">先選縣市，再勾選想要的鄉鎮市區（可複選）；不勾鄉鎮市區代表整個縣市都可以。要選別的縣市請按「新增一筆區域」</div>
    <div id="regionEntries"></div>
    <button type="button" class="add-row-btn" id="addRegionBtn">＋ 新增一筆區域</button>
  </div>

  <!-- 四、其他資訊 -->
  <div class="card">
    <h2>四、其他資訊</h2>
    <div class="field">
      <label>進駐時間</label>
      <select id="moveInTimeSelect">
        <option value="">請選擇</option>
        <option>1個月內</option><option>3個月內</option><option>6個月內</option><option>1年內</option><option>時間彈性</option>
      </select>
    </div>
    <div class="field">
      <label>客戶急迫程度</label>
      <select id="urgencySelect">
        <option value="">請選擇</option><option>非常急</option><option>普通</option><option>不急</option>
      </select>
    </div>
    <div class="field">
      <label>是否已看過其他物件</label>
      <select id="seenOthersSelect">
        <option value="">請選擇</option><option>有</option><option>無</option>
      </select>
    </div>
    <div class="field">
      <label>是否有競爭仲介接觸</label>
      <select id="competitorSelect">
        <option value="">請選擇</option><option>有</option><option>無</option>
      </select>
    </div>
    <div class="field">
      <label>其他需求／備註</label>
      <textarea id="finalNoteInput"></textarea>
    </div>
  </div>

  <button type="button" class="submit" id="submitBtn">送出</button>
  <div id="msgBox" class="msg"></div>
</div>

<script>

function showToast(message, type, noScroll) {

  toast.style.display = 'block';

// 必填欄位沒填：用紅框標出缺的欄位，並自動捲到第一個；改到那一題紅框就會消失
function clearMissingMarks_() {
  document.querySelectorAll('.field-missing').forEach(function(f) { f.classList.remove('field-missing'); });
  document.querySelectorAll('.missing-msg').forEach(function(m) { m.remove(); });
}
function fieldLabelEl_(fieldEl) {
  return Array.prototype.slice.call(fieldEl.children).filter(function(c) { return c.tagName === 'LABEL'; })[0] || null;
}
function findFieldByLabel_(labelText) {
  var fields = Array.prototype.slice.call(document.querySelectorAll('.container .field'));
  var exact = fields.filter(function(f) { var l = fieldLabelEl_(f); return l && l.textContent.trim() === labelText; })[0];
  if (exact) return exact;
  return fields.filter(function(f) {
    var l = fieldLabelEl_(f);
    var t = l ? l.textContent.trim() : '';
    return t.length >= 2 && (t.indexOf(labelText) === 0 || labelText.indexOf(t) === 0);
  })[0] || null;
}
function markMissingFields_(labels) {
  clearMissingMarks_();
  var found = [];
  labels.forEach(function(raw) {
    var detail = (raw.match(/（(.+)）$/) || [])[1];
    var f = findFieldByLabel_(raw.replace(/（.*$/, ''));
    if (!f || found.indexOf(f) !== -1) return;
    f.classList.add('field-missing');
    var msg = document.createElement('div');
    msg.className = 'missing-msg';
    msg.textContent = detail || '這一題還沒填寫';
    var lab = fieldLabelEl_(f);
    if (lab) lab.insertAdjacentElement('afterend', msg); else f.insertBefore(msg, f.firstChild);
    found.push(f);
  });
  if (!found.length) return false;
  found.sort(function(a, b) { return (a.compareDocumentPosition(b) & 4) ? -1 : 1; });
  var first = found[0];
  if (first.scrollIntoView) first.scrollIntoView({ behavior: 'smooth', block: 'center' });
  var focusable = first.querySelector('input:not([type=checkbox]):not([type=hidden]), select, textarea');
  if (focusable) { try { focusable.focus({ preventScroll: true }); } catch (err) {} }
  return true;
}
['input', 'change'].forEach(function(evt) {
  document.querySelector('.container').addEventListener(evt, function(e) {
    var f = e.target.closest('.field');
    if (f) { f.classList.remove('field-missing'); var m = f.querySelector('.missing-msg'); if (m) m.remove(); }
  });
});

// 送出前確認摘要：把這次填的重點整理成一張清單，讓業務最後看一眼再按「確認送出」，
// 填錯可以直接按「回去修改」，不用等送出後才發現。回傳 Promise<boolean>。
// ------------------------------------------------------------
function showConfirmDialog_(title, rows) {
  return new Promise(function(resolve) {
    var overlay = document.createElement('div');
    overlay.className = 'confirm-overlay';
    var box = document.createElement('div');
    box.className = 'confirm-box';
    var h = document.createElement('h3'); h.textContent = title; box.appendChild(h);
    var sub = document.createElement('div'); sub.className = 'confirm-sub'; sub.textContent = '請確認以下內容有沒有填錯，沒問題再按「確認送出」。'; box.appendChild(sub);
    rows.forEach(function(r) {
      if (!r[1] || !String(r[1]).trim()) return;
      var row = document.createElement('div'); row.className = 'confirm-row';
      var k = document.createElement('div'); k.className = 'k'; k.textContent = r[0];
      var v = document.createElement('div'); v.className = 'v'; v.textContent = r[1];
      row.appendChild(k); row.appendChild(v); box.appendChild(row);
    });
    var actions = document.createElement('div'); actions.className = 'confirm-actions';
    var back = document.createElement('button'); back.type = 'button'; back.className = 'confirm-back'; back.textContent = '回去修改';
    var ok = document.createElement('button'); ok.type = 'button'; ok.className = 'confirm-ok'; ok.textContent = '確認送出';
    function close(result) { document.removeEventListener('keydown', onKey); overlay.remove(); resolve(result); }
    function onKey(e) { if (e.key === 'Escape') close(false); }
    back.addEventListener('click', function() { close(false); });
    ok.addEventListener('click', function() { close(true); });
    overlay.addEventListener('click', function(e) { if (e.target === overlay) close(false); });
    document.addEventListener('keydown', onKey);
    actions.appendChild(back); actions.appendChild(ok); box.appendChild(actions);
    overlay.appendChild(box);
    document.body.appendChild(overlay);
  });
}

// 目標區域：選縣市後，鄉鎮市區用勾選方式複選；一個都不勾代表整個縣市
function createRegionEntry() {
  regionEntryCount++;

  var wrap = document.createElement('div');
  wrap.className = 'region-entry';

  var head = document.createElement('div');
  head.className = 'region-head';

  var countySelect = document.createElement('select');
  countySelect.className = 'countySelect';
  var blankCounty = document.createElement('option');
  blankCounty.value = ''; blankCounty.textContent = '請選擇縣市';
  countySelect.appendChild(blankCounty);
  Object.keys(DISTRICT_DATA).forEach(function(county) {
    var o = document.createElement('option');
    o.value = county; o.textContent = county;
    countySelect.appendChild(o);
  });

  var removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'remove-btn';
  removeBtn.textContent = '刪除';
  removeBtn.addEventListener('click', function() {
    if (document.querySelectorAll('.region-entry').length <= 1) { alert('至少要保留一筆區域'); return; }
    wrap.remove();
  });

  head.appendChild(countySelect);
  head.appendChild(removeBtn);
  wrap.appendChild(head);

  var townBox = document.createElement('div');
  townBox.className = 'region-towns';
  var bar = document.createElement('div');
  bar.className = 'region-towns-bar';
  var barText = document.createElement('span');
  barText.textContent = '鄉鎮市區（可複選；都不勾＝整個縣市）';
  var allBtn = document.createElement('button');
  allBtn.type = 'button';
  allBtn.className = 'select-all-btn';
  allBtn.textContent = '全選';
  bar.appendChild(barText);
  bar.appendChild(allBtn);
  var townGroup = document.createElement('div');
  townGroup.className = 'checkbox-group';
  townBox.appendChild(bar);
  townBox.appendChild(townGroup);
  wrap.appendChild(townBox);

  countySelect.addEventListener('change', function() {
    townGroup.innerHTML = '';
    allBtn.textContent = '全選';
    var towns = DISTRICT_DATA[countySelect.value] || {};
    var names = Object.keys(towns);
    names.forEach(function(town) {
      var lbl = document.createElement('label');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.value = town; cb.className = 'townCheckbox';
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(town));
      townGroup.appendChild(lbl);
    });
    townBox.style.display = names.length ? 'block' : 'none';
  });

  allBtn.addEventListener('click', function() {
    var boxes = townGroup.querySelectorAll('.townCheckbox');
    var allChecked = Array.prototype.every.call(boxes, function(b) { return b.checked; });
    boxes.forEach(function(b) { b.checked = !allChecked; });
    allBtn.textContent = allChecked ? '全選' : '取消全選';
  });

  document.getElementById('regionEntries').appendChild(wrap);
}

document.getElementById('submitBtn').addEventListener('click', function() {
  var msgBox = document.getElementById('msgBox');
  msgBox.style.display = 'none';

  var business = getBusinessList().join('、');
  var clientName = document.getElementById('clientNameInput').value.trim();
  var propertyTypes = Array.prototype.slice.call(document.querySelectorAll('.propertyTypeCheckbox:checked')).map(function(cb) { return cb.value; });
  var demandType = document.getElementById('demandTypeSelect').value;

  var missing = [];
  if (!business) missing.push('負責業務（至少勾選一位）');
  if (!document.getElementById('fillDate').value) missing.push('填表日期');
  if (propertyTypes.length === 0) missing.push('物件類型（至少勾選一項）');
  if (!demandType) missing.push('需求類型');
  if (propertyTypes.indexOf('廠房') !== -1) {
    if (!document.getElementById('factoryHeight').value.trim()) missing.push('廠房淨高需求');
    if (!document.getElementById('factoryPower').value.trim()) missing.push('電力需求');
    if (!document.getElementById('factoryWater').value.trim()) missing.push('用水需求');
    if (!document.getElementById('factoryOther').value.trim()) missing.push('廠房其他需求');
  }

  if (missing.length > 0) {
    msgBox.className = 'msg error';
    msgBox.textContent = '請填寫以下必填欄位：\n' + missing.join('\n');
    markMissingFields_(missing);
    showToast('還有 ' + missing.length + ' 個必填欄位沒填，請看紅框標示處', 'error', true);
    return;
  }
  clearMissingMarks_();

  var industryList = Array.prototype.slice.call(document.querySelectorAll('.industryCheckbox:checked')).map(function(cb) {
    if (cb.value === '其他') return document.getElementById('industryOtherInput').value.trim();
    return cb.value;
  }).filter(function(v) { return v; });

  var landKindList = Array.prototype.slice.call(document.querySelectorAll('.landKindCheckbox:checked')).map(function(cb) {
    if (cb.value === '其他') return document.getElementById('landUseOtherInput').value.trim();
    return cb.value;
  }).filter(function(v) { return v; });

  var regionList = [];
  document.querySelectorAll('.region-entry').forEach(function(entry) {
    var county = entry.querySelector('.countySelect').value;
    if (!county) return;
    var towns = Array.prototype.slice.call(entry.querySelectorAll('.townCheckbox:checked')).map(function(cb) { return cb.value; });
    if (towns.length) {
      towns.forEach(function(t) { regionList.push(county + t); });
    } else {
      regionList.push(county);
    }
  });

  var houseLayout = document.getElementById('houseLayoutSelect').value;
  if (houseLayout === '有格局') {
    var r = document.getElementById('houseRoomCount').value.trim();
    var h = document.getElementById('houseHallCount').value.trim();
    var b = document.getElementById('houseBathCount').value.trim();
    var parts = [];
    if (r) parts.push(r + '房');
    if (h) parts.push(h + '廳');
    if (b) parts.push(b + '衛');
    houseLayout = parts.join('');
  }

  var data = {
    business: business,
    fillDate: document.getElementById('fillDate').value,
    source: getBusinessValue('sourceSelect', 'sourceOtherInput'),
    identity: document.getElementById('identitySelect').value,
    clientName: clientName,
    industry: industryList.join('、'),
    contactPerson: document.getElementById('contactPersonInput').value.trim(),
    contactPhone: document.getElementById('contactPhoneInput').value.trim(),
    lineId: document.getElementById('lineIdInput').value.trim(),
    email: document.getElementById('emailInput').value.trim(),
    propertyTypes: propertyTypes.join('、'),
    demandType: demandType,

    factoryAreaBuy: document.getElementById('factoryAreaBuy').value.trim(),
    factoryPriceBuy: document.getElementById('factoryPriceBuy').value.trim(),
    factoryAreaRent: document.getElementById('factoryAreaRent').value.trim(),
    factoryRent: document.getElementById('factoryRent').value.trim(),
    factoryRentTerm: document.getElementById('factoryRentTerm').value.trim(),
    factoryLandArea: document.getElementById('factoryLandArea').value.trim(),
    factoryLandZoning: document.getElementById('factoryLandZoning').value.trim(),
    factoryHeight: document.getElementById('factoryHeight').value.trim(),
    factoryPower: document.getElementById('factoryPower').value.trim(),
    factoryWater: document.getElementById('factoryWater').value.trim(),
    factoryCrane: document.getElementById('factoryCrane').value,
    factoryCraneTon: document.getElementById('factoryCraneTon').value.trim(),
    factoryDock: document.getElementById('factoryDock').value,
    factorySewage: document.getElementById('factorySewage').value,
    factoryOther: document.getElementById('factoryOther').value.trim(),

    landAreaBuy: document.getElementById('landAreaBuy').value.trim(),
    landPriceBuy: document.getElementById('landPriceBuy').value.trim(),
    landAreaRent: document.getElementById('landAreaRent').value.trim(),
    landRent: document.getElementById('landRent').value.trim(),
    landRentTerm: document.getElementById('landRentTerm').value.trim(),
    landShape: document.getElementById('landShape').value,
    landRoadWidth: document.getElementById('landRoadWidth').value.trim(),
    landUse: landKindList.join('、'),
    landZoning: document.getElementById('landZoning').value.trim(),
    landOther: document.getElementById('landOther').value.trim(),

    houseAreaBuy: document.getElementById('houseAreaBuy').value.trim(),
    housePriceBuy: document.getElementById('housePriceBuy').value.trim(),
    houseAreaRent: document.getElementById('houseAreaRent').value.trim(),
    houseRent: document.getElementById('houseRent').value.trim(),
    houseRentTerm: document.getElementById('houseRentTerm').value.trim(),
    houseLayout: houseLayout,
    houseFloor: document.getElementById('houseFloor').value.trim(),
    houseAge: document.getElementById('houseAge').value.trim(),
    houseParking: document.getElementById('houseParking').value,
    houseOther: document.getElementById('houseOther').value.trim(),

    region: regionList.join('、'),

    moveInTime: document.getElementById('moveInTimeSelect').value,
    urgency: document.getElementById('urgencySelect').value,
    seenOthers: document.getElementById('seenOthersSelect').value,
    competitor: document.getElementById('competitorSelect').value,
    finalNote: document.getElementById('finalNoteInput').value.trim(),
  };

  var demandParts_ = [];

  if (data.propertyTypes.indexOf('房屋') !== -1) demandParts_.push('房屋：' + [data.houseAreaBuy && ('買' + data.houseAreaBuy + '坪'), data.housePriceBuy && ('總價上限' + data.housePriceBuy + '萬'), data.houseAreaRent && ('租' + data.houseAreaRent + '坪'), data.houseRent && ('租金上限' + data.houseRent), data.houseLayout && ('房型' + data.houseLayout)].filter(Boolean).join('、'));
  showConfirmDialog_('送出前確認（客需）', [
    ['負責業務', data.business],
    ['客戶', [data.clientName, data.contactPerson, data.contactPhone].filter(Boolean).join('｜')],

  ]).then(function(confirmed) {
    if (!confirmed) return;
    doSubmit_();
  });

  function doSubmit_() {
  var submitBtn = document.getElementById('submitBtn');
  submitBtn.disabled = true;
  submitBtn.textContent = '送出中...';

  fetch(API_URL, { method: 'POST', body: JSON.stringify(data) }).then(function(r) { return r.json(); }).then(function(result) {
    submitBtn.disabled = false;
    submitBtn.textContent = '送出';
    if (result && result.success) {
      msgBox.className = 'msg success';
      msgBox.textContent = result.message || '送出成功！';

      clearDraft_();

      updateDemandTypeFields();
      document.getElementById('craneTonBlock').style.display = 'none';
      document.getElementById('houseLayoutDetail').style.display = 'none';
      document.getElementById('businessOtherInput').style.display = 'none';
      document.getElementById('industryOtherInput').style.display = 'none';
      document.getElementById('sourceOtherInput').style.display = 'none';
      document.getElementById('landUseOtherInput').style.display = 'none';

      createRegionEntry();
      document.getElementById('fillDate').value = new Date().toISOString().slice(0, 10);
    } else {
      msgBox.className = 'msg error';
      msgBox.textContent = (result && result.message) || '送出失敗，請稍後再試。';
      showToast((result && result.message) || '送出失敗，請稍後再試。', 'error');
    }
    window.scrollTo(0, 0);
  }).catch(function(err) {
    submitBtn.disabled = false;
    submitBtn.textContent = '送出';
    msgBox.className = 'msg error';
    msgBox.textContent = '送出失敗：' + (err && err.message ? err.message : err);
    showToast('送出失敗：' + (err && err.message ? err.message : err), 'error');
    window.scrollTo(0, 0);
  });
  }
});

// ------------------------------------------------------------
// 草稿暫存（存在這台電腦／手機瀏覽器的 localStorage，不用登入 Google 帳號）：
// 填到一半離開或關掉分頁，重新打開同一個網址會問要不要接著繼續。
// 草稿只存在你自己的瀏覽器裡，換裝置或換瀏覽器看不到；送出成功後草稿會自動清掉。
// ------------------------------------------------------------
var DRAFT_STORAGE_KEY = 'ruiheClientNeedsDraft';
var DRAFT_SKIP_IDS = { fillDate: true, submitBtn: true };

function collectDraft_() {
  var draft = { fields: {}, checked: [], regions: [] };
  document.querySelectorAll('.container input[id], .container select[id], .container textarea[id]').forEach(function(el) {
    if (DRAFT_SKIP_IDS[el.id] || el.type === 'checkbox' || el.type === 'button') return;
    draft.fields[el.id] = el.value;
  });
  document.querySelectorAll('.container input[type=checkbox]:checked').forEach(function(cb) {
    draft.checked.push({ cls: cb.className, value: cb.value });
  });
  document.querySelectorAll('.region-entry').forEach(function(entry) {
    var county = entry.querySelector('.countySelect').value;
    var towns = Array.prototype.slice.call(entry.querySelectorAll('.townCheckbox:checked')).map(function(c) { return c.value; });
    draft.regions.push({ county: county, towns: towns });
  });
  return draft;
}

function draftIsEmpty_(draft) {
  var hasField = Object.keys(draft.fields).some(function(k) { return String(draft.fields[k]).trim() !== ''; });
  var hasRegion = draft.regions.some(function(r) { return r.county; });
  return !hasField && !draft.checked.length && !hasRegion;
}

function saveDraftToLocalStorage_() {
  try {
    var draft = collectDraft_();
    if (draftIsEmpty_(draft)) localStorage.removeItem(DRAFT_STORAGE_KEY);
    else localStorage.setItem(DRAFT_STORAGE_KEY, JSON.stringify(draft));
  } catch (err) {
    // localStorage 被瀏覽器擋掉或滿了，暫存失敗就算了，不影響正常填寫
  }
}

function clearDraft_() {
  try { localStorage.removeItem(DRAFT_STORAGE_KEY); } catch (err) {}
}

function fireChange_(el) { el.dispatchEvent(new Event('change', { bubbles: true })); }

function restoreDraft_(draft) {
  // 1. 先還原勾選（物件類型、業務、產業類別、土地種類…），並觸發連動顯示
  var wanted = {};
  (draft.checked || []).forEach(function(c) { wanted[c.cls + '||' + c.value] = true; });
  document.querySelectorAll('.container input[type=checkbox]').forEach(function(cb) {
    var shouldCheck = !!wanted[cb.className + '||' + cb.value];
    if (cb.checked !== shouldCheck) { cb.checked = shouldCheck; fireChange_(cb); }
  });

  // 2. 還原一般欄位，下拉選單改完要觸發連動（買／租欄位、天車噸數、房型、其他…）
  Object.keys(draft.fields || {}).forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    el.value = draft.fields[id];
    if (el.tagName === 'SELECT') fireChange_(el);
  });
  updatePropertyTypeBlocks();
  updateDemandTypeFields();

  // 3. 目標區域：逐筆重建，縣市選好後再把鄉鎮勾回去
  var regions = (draft.regions || []).filter(function(r) { return r.county; });
  document.getElementById('regionEntries').innerHTML = '';
  if (!regions.length) createRegionEntry();
  regions.forEach(function(r) {
    createRegionEntry();
    var entries = document.querySelectorAll('.region-entry');
    var entry = entries[entries.length - 1];
    var countySel = entry.querySelector('.countySelect');
    countySel.value = r.county;
    fireChange_(countySel);
    (r.towns || []).forEach(function(t) {
      Array.prototype.slice.call(entry.querySelectorAll('.townCheckbox')).forEach(function(cb) {
        if (cb.value === t) cb.checked = true;
      });
    });
  });
}

// 載入完成後檢查有沒有草稿，有的話顯示提示橫幅（不自動套用，等使用者按按鈕）
var pendingDraft_ = null;
function initDraftBanner_() {
  try {
    var raw = localStorage.getItem(DRAFT_STORAGE_KEY);
    if (raw) pendingDraft_ = JSON.parse(raw);
  } catch (err) { pendingDraft_ = null; }
  if (pendingDraft_ && !draftIsEmpty_(pendingDraft_)) {
    document.getElementById('draftBanner').style.display = 'block';
  }
}
document.getElementById('restoreDraftBtn').addEventListener('click', function() {
  if (pendingDraft_) restoreDraft_(pendingDraft_);
  document.getElementById('draftBanner').style.display = 'none';
});
document.getElementById('discardDraftBtn').addEventListener('click', function() {
  clearDraft_();
  pendingDraft_ = null;
  document.getElementById('draftBanner').style.display = 'none';
});

// 自動暫存：欄位有變動時（停止輸入 1 秒後才存），加上每 15 秒定期存一次保險。
// 草稿橫幅還在、尚未決定要不要還原時先不存，避免把舊草稿蓋成空白。
var draftSaveTimer_ = null;
['input', 'change'].forEach(function(evtName) {
  document.querySelector('.container').addEventListener(evtName, function() {
    if (document.getElementById('draftBanner').style.display === 'block') return;
    clearTimeout(draftSaveTimer_);
    draftSaveTimer_ = setTimeout(saveDraftToLocalStorage_, 1000);
  });
});
setInterval(function() {
  if (document.getElementById('draftBanner').style.display === 'block') return;
  saveDraftToLocalStorage_();
}, 15000);
</script>
