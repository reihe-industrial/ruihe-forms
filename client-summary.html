<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>客需簡表｜瑞禾不動產</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --ink: #1c2b22;
      --muted: #66776c;
      --paper: #f3f1e9;
      --card: #ffffff;
      --line: #dfe2d7;
      --brand: #2f6f4e;
      --brand-dark: #1e4a32;
      --brand-soft: #e9f1ec;
      --danger: #a3352c;
      --danger-soft: #fbebe9;
      --radius: 10px;
      --t-factory: #3d5a80;  --t-factory-soft: #e6ecf4;
      --t-land: #8a6a1f;     --t-land-soft: #f5eedb;
      --t-house: #8c3f5a;    --t-house-soft: #f6e7ec;
    }
    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--paper); margin: 0; padding: 20px 16px 60px;
      color: var(--ink); line-height: 1.5;
    }
    .container { max-width: 1180px; margin: 0 auto; }
    .narrow { max-width: 640px; }

    .site-nav { display: flex; gap: 6px; overflow-x: auto; margin: 0 0 16px; padding-bottom: 2px; -webkit-overflow-scrolling: touch; }
    .site-nav a { flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; background: #fff; border: 1px solid var(--line);
      color: var(--ink); font-size: 13.5px; font-weight: 600; text-decoration: none; white-space: nowrap; }
    .site-nav a:hover { border-color: var(--brand); color: var(--brand); }
    .site-nav a.active { background: var(--brand); border-color: var(--brand); color: #fff; }

    h1 {
      font-family: "Noto Serif TC", "Noto Sans TC", serif;
      font-size: 23px; font-weight: 700; letter-spacing: 0.02em;
      margin: 4px 0 6px; color: var(--brand-dark);
    }
    .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 18px; }

    .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
    .card h2 { font-size: 15px; font-weight: 700; margin: 0 0 16px; color: var(--brand-dark); display: flex; align-items: center; gap: 8px; }
    .card h2::before { content: ""; display: inline-block; width: 4px; height: 15px; background: var(--brand); border-radius: 2px; flex-shrink: 0; }

    .field { margin-bottom: 16px; }
    label, .flabel { display: block; font-size: 13.5px; font-weight: 600; color: var(--ink); margin-bottom: 5px; }
    label.required::after { content: " *"; color: var(--danger); font-weight: 700; }
    .hint { font-size: 12.5px; color: var(--muted); margin: 2px 0 6px; line-height: 1.55; }
    input, select {
      width: 100%; padding: 10px 12px; font-size: 15px;
      border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-family: inherit;
    }
    input:focus, select:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
    select { appearance: none; -webkit-appearance: none;
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2366776c' stroke-width='2'%3e%3cpath d='M6 9l6 6 6-6'/%3e%3c/svg%3e");
      background-repeat: no-repeat; background-position: right 10px center; background-size: 18px; padding-right: 34px; }
    button { font-family: inherit; }
    button:focus-visible, summary:focus-visible, a:focus-visible { outline: 3px solid var(--brand-soft); outline-offset: 2px; }

    .btn { border: none; border-radius: 8px; background: var(--brand); color: #fff; font-size: 15px; font-weight: 700; padding: 11px 18px; cursor: pointer; }
    .btn:disabled { background: #b9c3ba; cursor: not-allowed; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); font-weight: 600; font-size: 13.5px; padding: 7px 13px; }
    .btn.ghost:hover { border-color: var(--brand); color: var(--brand); }
    .btn.ghost:disabled { background: #fff; color: #a9b0a2; }

    .msg { display: none; margin-top: 12px; padding: 10px 12px; border-radius: 8px; font-size: 14px; }
    .msg.error { display: block; background: var(--danger-soft); color: var(--danger); }
    .login-note { font-size: 12.5px; color: var(--muted); margin-top: 10px; }

    /* 登入後的頂列 */
    .topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 14px; }
    .topbar .who { font-weight: 700; font-size: 14px; }
    .topbar .status { font-size: 13px; color: var(--muted); flex: 1 1 auto; }
    .topbar .status.warn { color: var(--danger); }
    .topbar .actions { display: flex; gap: 6px; }

    /* 篩選 */
    .filters { padding: 16px 18px; }
    .filter-toggle { display: none; }
    .filter-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 18px; align-items: end; }
    .filter-grid .span2 { grid-column: span 2; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chips button {
      border: 1px solid var(--line); background: #fbfaf6; color: var(--ink); border-radius: 999px;
      padding: 6px 13px; font-size: 13.5px; cursor: pointer;
    }
    .chips button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: #fff; font-weight: 600; }
    .range { display: flex; align-items: center; gap: 6px; }
    .range input { padding: 9px 10px; }
    .range span { color: var(--muted); flex: 0 0 auto; }
    .row-sel { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .filter-foot { grid-column: 2 / -1; display: flex; justify-content: flex-end; }
    @media (max-width: 899px) { .filter-foot { grid-column: auto; } }

    /* 結果列 */
    .resultbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 4px 2px 10px; }
    .count { font-size: 15px; font-weight: 700; color: var(--brand-dark); }
    .count small { font-weight: 400; color: var(--muted); font-size: 13px; margin-left: 6px; }
    .sort-mobile { display: none; max-width: 180px; padding: 7px 30px 7px 10px; font-size: 13.5px; }

    .tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 5px; padding: 1px 7px; white-space: nowrap; background: #eef0ea; color: var(--muted); }
    .tag.t-factory { background: var(--t-factory-soft); color: var(--t-factory); }
    .tag.t-land { background: var(--t-land-soft); color: var(--t-land); }
    .tag.t-house { background: var(--t-house-soft); color: var(--t-house); }
    .tag.rs { background: #fff; border: 1px solid var(--line); color: var(--ink); }

    /* 電腦：表格 */
    .table-wrap { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); overflow: auto; max-height: calc(100vh - 120px); }
    table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
    th, td { padding: 9px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    th { position: sticky; top: 0; background: #f8f7f2; z-index: 1; white-space: nowrap; padding: 0; }
    th button { all: unset; display: block; padding: 10px; font-weight: 700; font-size: 13px; color: var(--brand-dark); cursor: pointer; white-space: nowrap; }
    th button:focus-visible { outline: 3px solid var(--brand-soft); }
    th .arrow { color: var(--brand); margin-left: 3px; font-size: 11px; }
    td.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    td { white-space: nowrap; }
    td.wrap { white-space: normal; min-width: 9em; max-width: 18em; }
    tbody tr.main { cursor: pointer; }
    tbody tr.main.open { background: #f4f8f5; }
    tr.detail td { background: #fbfbf8; white-space: normal; }
    .detail-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 22px; font-size: 13.5px; }
    .detail-grid div { display: grid; grid-template-columns: 9.5em 1fr; gap: 8px; }
    .detail-grid span:first-child { color: var(--muted); }
    .mine { display: inline-block; font-size: 11.5px; font-weight: 700; color: var(--brand); border: 1px solid var(--brand); border-radius: 5px; padding: 0 5px; margin-left: 4px; }
    .edit-link { color: var(--brand); font-weight: 600; font-size: 13.5px; text-decoration: none; }
    .demand-lines { font-size: 13.5px; }
    .demand-lines div + div { margin-top: 2px; }
    .tracks .track-row { border-top: 1px dashed var(--line); padding: 8px 0; font-size: 13.5px; }
    .tracks .hint { margin: 2px 0; }
    tbody tr:hover { background: #fafaf5; }

    /* 手機：卡片 */
    .cards { display: grid; gap: 10px; }
    .item { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
    .item > summary { list-style: none; cursor: pointer; padding: 14px 14px 12px; }
    .item > summary::-webkit-details-marker { display: none; }
    .item-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .item-name { font-size: 16px; font-weight: 700; margin-right: auto; }
    .item-price { display: flex; align-items: baseline; gap: 10px; margin-top: 6px; flex-wrap: wrap; }
    .item-price b { font-size: 19px; color: var(--brand-dark); }
    .item-price span { font-size: 13.5px; color: var(--muted); }
    .item-meta { font-size: 13.5px; color: var(--ink); margin-top: 3px; }
    .item-meta.muted { color: var(--muted); }
    .item-more-hint { font-size: 12.5px; color: var(--brand); margin-top: 6px; }
    .item[open] .item-more-hint .open-t { display: none; }
    .item:not([open]) .item-more-hint .close-t { display: none; }
    .item-more { margin: 0; padding: 4px 14px 14px; border-top: 1px dashed var(--line); display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13.5px; }
    .item-more dt { color: var(--muted); padding-top: 6px; }
    .item-more dd { margin: 0; padding-top: 6px; }

    .empty { text-align: center; padding: 40px 16px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: var(--radius); }
    .loading { text-align: center; padding: 40px 16px; color: var(--muted); }

    #toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); z-index: 50; background: var(--brand-dark); color: #fff;
      padding: 10px 18px; border-radius: 999px; font-size: 14px; font-weight: 600; box-shadow: 0 4px 16px rgba(0,0,0,.18); display: none; max-width: 90%; text-align: center; }
    #toast.error { background: var(--danger); }

    @media (max-width: 899px) {
      .filter-toggle { display: flex; width: 100%; justify-content: space-between; align-items: center; background: none; border: none; padding: 0; font-size: 15px; font-weight: 700; color: var(--brand-dark); cursor: pointer; }
      .filters:not(.open) .filter-body { display: none; }
      .filters.open .filter-toggle { margin-bottom: 14px; }
      .filter-grid { grid-template-columns: 1fr; gap: 14px; }
      .filter-grid .span2 { grid-column: auto; }
      .sort-mobile { display: block; }
    }
    @media (prefers-reduced-motion: no-preference) {
      .item[open] .item-more { animation: open .15s ease-out; }
      @keyframes open { from { opacity: 0; } to { opacity: 1; } }
    }
      /* 精簡表格：字換行、不用左右捲（115/10/19） */
    .table-wrap.compact { overflow-x: auto; }
    .table-wrap.compact table { width: 100%; }
    .table-wrap.compact th, .table-wrap.compact td { white-space: normal; word-break: break-word; vertical-align: top; }
  </style>

  <div class="container">
    <nav class="site-nav" id="siteNav" aria-label="表單選單">
    <a href="index.html" data-key="home" data-home="1">登入</a>
    <a href="listing.html" data-key="listing">新增物件</a>
    <a href="client-needs.html" data-key="needs">新增客需</a>

    <span data-auth="1" aria-hidden="true" style="display:none;flex:0 0 1px;background:#dfe2d7;margin:4px 4px;"></span>
    <a href="listing.html?mode=edit" data-key="edit" data-auth="1" style="display:none;">修改物件／客需／物件配對</a>

    <a href="master-table.html" data-key="master" data-auth="1" data-roles="主管,秘書,管理員" style="display:none;">物件總表</a>
    <a href="secretary.html" data-key="secretary" data-auth="1" data-roles="秘書,管理員" style="display:none;">秘書專區</a>
    <a href="help.html" data-key="help" data-auth="1" style="display:none;">使用說明</a>
  </nav>
  <script>
  (function() {
    var page = location.pathname.split('/').pop();
    var edit = /[?&]mode=edit(&|$)/.test(location.search);
    var key = page === 'land-registry.html' ? 'registry' : page === 'summary.html' ? 'summary'
      : page === 'master-table.html' ? 'master' : page === 'secretary.html' ? 'secretary'
      : page === 'client-summary.html' ? 'csummary' : page === 'map.html' ? 'map' : page === 'matching.html' ? 'matching'
      : page === 'client-needs.html' ? (edit ? 'edit' : 'needs')
      : (edit ? 'edit' : 'listing');
    // 登入後才看得到的連結（data-auth）；再依身分（data-roles）顯示：這個分頁登入的人、身分，存在 sessionStorage
    window.ruiheUpdateNav_ = function() {
      var o = null;
      try { o = JSON.parse(sessionStorage.getItem('ruihe_login_v1') || 'null'); } catch (e) {}
      var loggedIn = !!(o && o.name && o.code), role = (o && o.role) || '';
      var els = document.querySelectorAll('#siteNav [data-auth]');
      for (var j = 0; j < els.length; j++) {
        var roles = els[j].getAttribute('data-roles');
        var okRole = !roles || roles.split(',').indexOf(role) !== -1;
        els[j].style.display = (loggedIn && okRole) ? '' : 'none';
      }
      var home = document.querySelector('#siteNav [data-home]');
      if (home) home.textContent = loggedIn ? '首頁' : '登入';
    };
    // 預先把「新增物件」表單的選項（業務名單、地段）載到這台裝置，第一次打開新增物件就不用等
    if (page !== 'listing.html') {
      setTimeout(function() {
        try {
          if (localStorage.getItem('ruihe_listing_options_v1')) return;
          fetch('https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec', { method: 'POST', body: JSON.stringify({ fn: 'getListingFormOptions', args: [] }) })
            .then(function(r) { return r.json(); })
            .then(function(res) { if (res && res.ok && res.result && res.result.districtData && Object.keys(res.result.districtData).length) localStorage.setItem('ruihe_listing_options_v1', JSON.stringify(res.result)); })
            .catch(function() {});
        } catch (e) {}
      }, 2500);
    }
    window.ruiheUpdateNav_();
    var links = document.querySelectorAll('#siteNav a');
    for (var i = 0; i < links.length; i++) {
      if (links[i].getAttribute('data-key') === key) { links[i].className = 'active'; links[i].setAttribute('aria-current', 'page'); }
    }
  })();
  </script>

    <h1>客需簡表</h1>
    <div class="subtitle">全公司的客戶需求</div>

    <div class="card narrow" id="loginView">
      <h2>登入</h2>
      <div class="field">
        <label class="required" for="loginName">姓名</label>
        <select id="loginName"><option value="">載入中…</option></select>
      </div>
      <div class="field">
        <label class="required" for="loginCode">通關碼</label>
        <div class="hint">輸入修改案件用的同一組通關碼（英文和數字，不分大小寫）</div>
        <input type="password" id="loginCode" autocomplete="off" autocapitalize="characters" spellcheck="false" maxlength="20">
      </div>
      <button type="button" class="btn" id="loginBtn" style="width:100%;">登入</button>
      <div class="msg" id="loginMsg"></div>
      <div class="login-note">在共用電腦上看完，請按「登出」。</div>
    </div>

    <div id="mainView" hidden>
      <div class="topbar">
        <span class="who" id="whoName"></span>
        <span class="status" id="statusText"></span>
        <span class="actions">
          <button type="button" class="btn ghost" id="refreshBtn">重新整理</button>
          <button type="button" class="btn ghost" id="logoutBtn">登出</button>
        </span>
      </div>

      <div class="card filters" id="filterCard">
        <button type="button" class="filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterBody">
          <span id="filterToggleText">篩選</span><span aria-hidden="true">▾</span>
        </button>
        <div class="filter-body" id="filterBody">
          <div class="filter-grid">
            <div class="span2">
              <span class="flabel">物件類型</span>
              <div class="chips" id="typeChips" role="group" aria-label="物件類型"></div>
            </div>
            <div>
              <span class="flabel">買／租</span>
              <div class="chips" id="rsChips" role="group" aria-label="買／租"></div>
            </div>
            <div>
              <span class="flabel">負責業務</span>
              <div class="chips" id="mineChips" role="group" aria-label="負責業務"></div>
            </div>
            <div class="span2">
              <span class="flabel">區域</span>
              <div class="row-sel">
                <select id="fCounty" aria-label="縣市"><option value="">全部縣市</option></select>
                <select id="fTown" aria-label="鄉鎮市區"><option value="">先選縣市</option></select>
              </div>
            </div>
            <div class="span2">
              <label for="fKeyword">關鍵字</label>
              <input type="search" id="fKeyword" placeholder="產業、業務、區域、需求內容" autocomplete="off">
            </div>
            <div>
              <label for="fArea">物件坪數</label>
              <input type="number" inputmode="decimal" step="any" min="0" id="fArea" placeholder="例：300">
            </div>
            <div>
              <label for="fPrice">物件總價（萬）</label>
              <input type="number" inputmode="decimal" step="any" min="0" id="fPrice" placeholder="例：3000">
            </div>
            <div>
              <label for="fRent">物件租金（元）</label>
              <input type="number" inputmode="decimal" step="any" min="0" id="fRent" placeholder="廠房、土地每坪每月；房屋每月">
            </div>
            <div class="filter-foot"><button type="button" class="btn ghost" id="clearBtn">清除篩選</button></div>
          </div>
        </div>
      </div>

      <div class="resultbar">
        <div class="count" id="countText" aria-live="polite"></div>
        <select class="sort-mobile" id="sortMobile" aria-label="排序">
          <option value="">最新在前</option>
          <option value="urgency|1">最急的在前</option>
        </select>
      </div>

      <div id="results"><div class="loading">讀取中…</div></div>
    </div>
  </div>

<script>
var API_URL = 'https://script.google.com/macros/s/AKfycbz6EXnxZb40rln8q9xTaD_TiABT5leWT-R20P5DAQmgLwhiyLvVsI8mqC4Df4wT01zP/exec';   // 客需後端
var LISTING_API_URL = 'https://script.google.com/macros/s/AKfycbx8cp8ArkFb4RXXom9UCR2cAqc8MdU6AZlBznwkSx34tQoYR2xEH0I1oJzouip-fyJJQw/exec'; // 物件後端（姓名清單）

// ---------- 讀資料等太久自動重試（115/10/15）----------
// 只針對「讀資料」的請求（不會改到資料的），超過 20 秒沒回應就放棄這次、自動再試一次；
// 兩次都沒回應就回「連線比較慢，請按重新整理」。送出、儲存這類會改資料的請求不重試（避免重複）。
(function() {
  if (window.__ruiheFetchWrapped || !window.fetch) return;
  window.__ruiheFetchWrapped = true;
  var orig = window.fetch.bind(window);
  var READS = ['summaryGetListings', 'clientSummaryGet', 'masterTableGet', 'adminListPeople', 'regListRequests', 'editListCases', 'clientEditList',
    'editLoadCase', 'clientEditLoad', 'clientReminders', 'contractReminders', 'googleStatus', 'getEditLoginOptions', 'getListingFormOptions',
    'getListingFormPersons', 'myVisibleNames', 'adminLoginLog', 'clientTracksView', 'submissionStatus', 'getLandRegistryFormOptions'];
  function once(url, opts) {
    if (!window.AbortController) return orig(url, opts);
    var ctrl = new AbortController(), timer = setTimeout(function() { ctrl.abort(); }, 20000);
    var o = {}; for (var k in opts) o[k] = opts[k]; o.signal = ctrl.signal;
    return orig(url, o).then(function(r) { clearTimeout(timer); return r; }, function(e) { clearTimeout(timer); throw e; });
  }
  window.fetch = function(url, opts) {
    var fn = '';
    try { if (opts && opts.method === 'POST' && typeof opts.body === 'string' && /script\.google\.com/.test(String(url))) fn = (JSON.parse(opts.body) || {}).fn || ''; } catch (e) {}
    var isTokenVerify = fn === 'summaryVerifyLogin' && /"S_[A-Z0-9]+"/.test(opts.body);   // 換頁時用登入憑證驗證＝只讀

    cols.forEach(function(col) {
      var kind = field === 'area' ? 'area' : field === 'price' ? 'price' : (t === '房屋' ? 'rentMonth' : 'rentPing');
      if (inNeedRange(cell(it.row, col), kind, v) === true) hit = true;
    });
  });
  return hit;
}
function filtered() {
  var words = filters.keyword.trim().toLowerCase().split(/\s+/).filter(Boolean);
  var area = num(filters.area), price = num(filters.price), rent = num(filters.rent);
  return items.filter(function(it) {
    if (filters.type && it.types.indexOf(filters.type) === -1) return false;
    if (filters.rs === '買' && !wantsBuy(it)) return false;
    if (filters.rs === '租' && !wantsRent(it)) return false;
    if (filters.mine && auth && it.agents.indexOf(auth.name) === -1) return false;
    if (filters.county && !it.regions.some(function(r) {
      return r.county === filters.county && (!filters.town || !r.town || r.town === filters.town);
    })) return false;
    for (var i = 0; i < words.length; i++) if (it.search.indexOf(words[i]) === -1) return false;
    if (area !== null && !matchNeed(it, 'area', area)) return false;
    if (price !== null && !matchNeed(it, 'price', price)) return false;
    if (rent !== null && !matchNeed(it, 'rent', rent)) return false;
    return true;
  });
}
function activeFilterCount() {
  var n = 0;
  ['type', 'rs', 'mine', 'county', 'area', 'price', 'rent'].forEach(function(k) { if (filters[k]) n++; });
  if (filters.keyword.trim()) n++;
  return n;
}
var SORT_KEYS = {
  agent: function(it) { return cell(it.row, '負責業務') || null; },
  fillDate: function(it) { return cell(it.row, '填表日期') || null; },
  types: function(it) { return cell(it.row, '物件類型') || null; },
  demand: function(it) { return it.demand || null; },
  region: function(it) { return cell(it.row, '目標區域') || null; },
  industry: function(it) { return cell(it.row, '產業類別') || null; },
  moveIn: function(it) { return cell(it.row, '進駐時間') || null; },
  urgency: function(it) { return it.urgency === -1 ? null : it.urgency; },
};
function sortList(list) {
  if (!sortState.key) return list.slice().sort(function(a, b) { return a.order - b.order; });
  var f = SORT_KEYS[sortState.key], dir = sortState.dir;
  return list.slice().sort(function(a, b) {
    var va = f(a), vb = f(b);
    if (va === null && vb === null) return a.order - b.order;
    if (va === null) return 1;
    if (vb === null) return -1;
    var c = typeof va === 'number' ? va - vb : String(va).localeCompare(String(vb), 'zh-Hant');
    return c ? c * dir : a.order - b.order;
  });
}
function saveFilters() { try { sessionStorage.setItem(FILTER_KEY, JSON.stringify({ f: filters, s: sortState })); } catch (e) {} }
function loadFilters() {
  try {
    var o = JSON.parse(sessionStorage.getItem(FILTER_KEY) || 'null');
    if (o && o.f) { var b = emptyFilters(); for (var k in b) if (o.f[k] != null) b[k] = o.f[k]; filters = b; }
    if (o && o.s && (o.s.key === '' || SORT_KEYS[o.s.key])) sortState = { key: o.s.key, dir: o.s.dir === -1 ? -1 : 1 };
  } catch (e) {}
}
function syncFilterInputs() {
  $('fKeyword').value = filters.keyword; $('fArea').value = filters.area; $('fPrice').value = filters.price; $('fRent').value = filters.rent;
}

// ---------------- 畫面 ----------------
function applyAndRender() {
  saveFilters();
  var n = activeFilterCount();
  $('filterToggleText').textContent = n ? '篩選（已套用 ' + n + ' 項）' : '篩選';
  if (!data) return;
  var list = sortList(filtered());
  $('countText').innerHTML = '共 ' + list.length + ' 筆' + (list.length !== items.length ? '<small>全部 ' + items.length + ' 筆</small>' : '');
  var sv = sortState.key ? sortState.key + '|' + sortState.dir : '';
  $('sortMobile').value = sv;
  if ($('sortMobile').value !== sv) $('sortMobile').value = '';
  var box = $('results');
  if (!items.length) { box.innerHTML = '<div class="empty">目前沒有客需資料。</div>'; return; }
  if (!list.length) { box.innerHTML = '<div class="empty">沒有符合條件的客需。<br><button type="button" class="btn ghost" style="margin-top:12px;" onclick="clearFilters()">清除篩選</button></div>'; return; }
  box.innerHTML = DESKTOP_QUERY.matches ? tableHtml(list) : cardsHtml(list);
}
function typeTags(it) {
  return it.types.map(function(t) {
    var cls = t === '廠房' ? 't-factory' : t === '土地' ? 't-land' : t === '房屋' ? 't-house' : '';
    return '<span class="tag ' + cls + '">' + esc(t) + '</span>';
  }).join(' ');
}
function isMine(it) { return auth && it.agents.indexOf(auth.name) !== -1; }
function myRole() { return serverRole_ || sharedRole_(); }
function isSecretary() { return myRole() === '秘書' || myRole() === '管理員'; }
function isManager() { return myRole() === '主管' || isSecretary(); }
var trackCache_ = {}; // 主管、秘書看過的追蹤紀錄 { key: { loading, error, records } }
function tracksHtml(it) {
  if (!isManager()) return '';
  var t = trackCache_[it.key];
  var inner;
  if (!t) inner = '<button type="button" class="btn ghost track-btn" data-key="' + esc(it.key) + '">看追蹤紀錄</button>';
  else if (t.loading) inner = '<div class="hint">讀取中…</div>';
  else if (t.error) inner = '<div class="hint">讀取失敗：' + esc(t.error) + '</div><button type="button" class="btn ghost track-btn" data-key="' + esc(it.key) + '">再試一次</button>';
  else if (!t.records.length) inner = '<div class="hint">還沒有追蹤紀錄。</div>';
  else inner = t.records.map(function(r) {
    return '<div class="track-row"><b>' + esc(r.date) + '</b> <span class="tag">' + esc(r.method) + '</span> <span class="hint" style="display:inline;">' + esc(r.author) + '</span>' +
      (r.listing ? '<div class="hint">帶看：' + esc(r.listing) + '</div>' : '') +
      '<div style="white-space:pre-wrap;">' + esc(r.content) + '</div>' + (r.next ? '<div class="hint">下次聯絡：' + esc(r.next) + '</div>' : '') + '</div>';
  }).join('');
  return '<div class="tracks"><div class="flabel" style="margin-top:12px;">追蹤紀錄</div>' + inner + '</div>';
}
function loadTracks(key) {
  trackCache_[key] = { loading: true };
  applyAndRender();
  post(API_URL, 'clientTracksView', [auth.name, auth.code, key])
    .then(function(res) { trackCache_[key] = { records: res.records || [] }; })
    .catch(function(err) {
      if (isAuthError(err)) { logout(err.message); return; }
      trackCache_[key] = { error: err.message || '連不上系統' };
    })
    .then(function() { if (data) applyAndRender(); });
}
function agentHtml(it) {
  return esc(cell(it.row, '負責業務')) + (isMine(it) ? '<span class="mine">我的</span>' : '');
}
function editLinkHtml(it) {
  return isMine(it) || isSecretary() ? '<a class="edit-link" href="client-needs.html?mode=edit&key=' + encodeURIComponent(it.key) + '">修改／追蹤</a>' : '';
}
function detailHtml(it) {
  var rest = data.columns.filter(function(c) { return c.charAt(0) !== '_' && SHOWN.indexOf(c) === -1 && String(cell(it.row, c)).trim() !== ''; });
  var body = !rest.length ? '<div class="hint">沒有其他資料</div>' : '<div class="detail-grid">' + rest.map(function(c) {
    return '<div><span>' + esc(c) + '</span><span>' + esc(cell(it.row, c)) + '</span></div>';
  }).join('') + '</div>';
  return body + tracksHtml(it);
}
var TABLE_COLS = [
  ['agent', '負責業務'], ['fillDate', '填表日期'], ['types', '物件類型'], ['demand', '需求類型'], [null, '坪數／預算'],
  ['region', '目標區域'], ['industry', '產業類別'], ['moveIn', '進駐時間'], ['urgency', '急迫程度'], [null, '']
];
function tableHtml(list) {
  var head = TABLE_COLS.map(function(c) {
    if (!c[0]) return '<th><button type="button" tabindex="-1" style="cursor:default;">' + esc(c[1]) + '</button></th>';
    var on = sortState.key === c[0];
    var arrow = on ? '<span class="arrow">' + (sortState.dir === 1 ? '▲' : '▼') + '</span>' : '';
    return '<th aria-sort="' + (on ? (sortState.dir === 1 ? 'ascending' : 'descending') : 'none') + '"><button type="button" data-sort="' + c[0] + '">' + esc(c[1]) + arrow + '</button></th>';
  }).join('');
  var body = list.map(function(it) {
    var open = !!openKeys[it.key];
    var r = it.row;
    var main = '<tr class="main' + (open ? ' open' : '') + '" data-key="' + esc(it.key) + '" aria-expanded="' + open + '">' +
      '<td>' + agentHtml(it) + '</td><td>' + esc(cell(r, '填表日期')) + '</td><td>' + typeTags(it) + '</td><td>' + esc(it.demand) + '</td>' +
      '<td class="wrap"><div class="demand-lines">' + demandLines(it).map(function(l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div></td>' +
      '<td class="wrap">' + esc(cell(r, '目標區域')) + '</td><td class="wrap">' + esc(cell(r, '產業類別')) + '</td>' +
      '<td>' + esc(cell(r, '進駐時間')) + '</td><td>' + esc(cell(r, '客戶急迫程度')) + '</td>' +
      '<td>' + editLinkHtml(it) + '</td></tr>';
    return main + (open ? '<tr class="detail"><td colspan="' + TABLE_COLS.length + '">' + detailHtml(it) + '</td></tr>' : '');
  }).join('');
  return '<div class="table-wrap compact"><table><thead><tr>' + head + '</tr></thead><tbody>' + body + '</tbody></table></div>';
}
function cardsHtml(list) {
  return '<div class="cards">' + list.map(function(it) {
    var r = it.row;
    return '<details class="item" data-key="' + esc(it.key) + '"' + (openKeys[it.key] ? ' open' : '') + '><summary>' +
      '<div class="item-top"><span class="item-name">' + agentHtml(it) + '</span>' + typeTags(it) +
        (it.demand ? '<span class="tag rs">' + esc(it.demand) + '</span>' : '') + '</div>' +
      '<div class="item-meta demand-lines" style="margin-top:6px;">' + demandLines(it).map(function(l) { return '<div>' + esc(l) + '</div>'; }).join('') + '</div>' +
      (cell(r, '目標區域') ? '<div class="item-meta">區域：' + esc(cell(r, '目標區域')) + '</div>' : '') +
      (cell(r, '產業類別') ? '<div class="item-meta">產業：' + esc(cell(r, '產業類別')) + '</div>' : '') +
      ([cell(r, '進駐時間'), cell(r, '客戶急迫程度')].filter(Boolean).length ? '<div class="item-meta muted">' + esc([cell(r, '進駐時間'), cell(r, '客戶急迫程度')].filter(Boolean).join('｜')) + '</div>' : '') +
      '<div class="item-more-hint"><span class="open-t">看其他欄位</span><span class="close-t">收起</span></div>' +
      '</summary><div class="item-more" style="display:block;">' + detailHtml(it) +
      (editLinkHtml(it) ? '<div style="margin-top:10px;">' + editLinkHtml(it) + '</div>' : '') + '</div></details>';
  }).join('') + '</div>';
}
function updateStatus() {
  var el = $('statusText');
  if (busy) { el.textContent = '檢查新資料中…'; el.className = 'status'; return; }
  if (!data) { el.textContent = ''; return; }
  if (lastCheckFailed) { el.textContent = '連不上系統，顯示的是 ' + timeText(data.checkedAt) + ' 的資料'; el.className = 'status warn'; }
  else { el.textContent = '最後檢查 ' + timeText(data.checkedAt) + '（每 5 分鐘自動檢查）'; el.className = 'status'; }
}
function clearFilters() { filters = emptyFilters(); syncFilterInputs(); buildFilterOptions(); applyAndRender(); }

// ---------------- 快取／檢查新版本 ----------------
function loadCache() { try { var c = JSON.parse(localStorage.getItem(CACHE_KEY) || 'null'); if (c && c.version && c.rows) return c; } catch (e) {} return null; }
function saveCache() { try { localStorage.setItem(CACHE_KEY, JSON.stringify(data)); } catch (e) {} }
function clearCache() { try { localStorage.removeItem(CACHE_KEY); } catch (e) {} }

// 第一次（登入）：伺服器回應前不顯示任何資料；之後在背景檢查
function checkForUpdates(manual, isLogin) {
  if (!auth || busy) return Promise.resolve();
  busy = true; $('refreshBtn').disabled = true; updateStatus();
  var cached = isLogin ? loadCache() : data;
  return post(API_URL, 'clientSummaryGet', [auth.name, auth.code, cached ? cached.version : ''])
    .then(function(res) {
      lastCheckFailed = false;
      if (res.role) {
        var changed = serverRole_ && serverRole_ !== res.role;
        serverRole_ = res.role;
        if (auth && !isLogin) sharedLoginSet_(auth.name, auth.code, res.role);
        if (changed && data) applyAndRender();
      }
      if (res.unchanged && cached) {
        var first = !data;
        data = cached; data.checkedAt = Date.now(); saveCache();
        if (first) { buildItems(); applyAndRender(); }
        if (manual) toast('已經是最新資料');
      } else {
        var had = !!data;
        data = { version: res.version, columns: res.columns || [], rows: res.rows || [], checkedAt: Date.now() };
        saveCache(); buildItems(); applyAndRender();
        if (had) toast('已更新到最新資料');
      }
    })
    .catch(function(err) {
      if (isAuthError(err)) { logout(err.message); throw err; }
      lastCheckFailed = true;
      if (isLogin) throw err;
      if (manual) toast('連不上系統，請稍後再試', true);
    })
    .then(function() { busy = false; $('refreshBtn').disabled = false; updateStatus(); },
          function(err) { busy = false; $('refreshBtn').disabled = false; updateStatus(); throw err; });
}
function startPolling() { stopPolling(); pollTimer = setInterval(function() { if (!document.hidden) checkForUpdates(false).catch(function() {}); }, POLL_MS); }
function stopPolling() { if (pollTimer) clearInterval(pollTimer); pollTimer = null; }
document.addEventListener('visibilitychange', function() {
  if (!document.hidden && auth && data && Date.now() - data.checkedAt >= POLL_MS) checkForUpdates(false).catch(function() {});
});

// ---------------- 登入／登出 ----------------
function loadLoginOptions() {
  loadLoginNames_($('loginName'), function() {
    return post(LISTING_API_URL, 'getEditLoginOptions', []).then(function(res) { return res.personList || []; });
  }, function(err) {
    $('loginName').innerHTML = '<option value="">載入失敗，請重新整理頁面</option>';
    showLoginError(err.message || '連不上系統');
  });
}
function showLoginError(text) { var m = $('loginMsg'); m.textContent = text; m.className = 'msg error'; }
function login(auto) {
  var name = auto ? auto.name : $('loginName').value, code = auto ? auto.code : $('loginCode').value.replace(/\s+/g, '');
  if (!name || !code) { showLoginError('請選擇姓名並輸入通關碼。'); return; }
  var btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '登入中…'; $('loginMsg').className = 'msg';
  var slowTimer = setTimeout(function() { if (btn.disabled) btn.textContent = '讀取中，第一次比較久…'; }, 4000);
  auth = { name: name, code: code };
  loadFilters(); syncFilterInputs();
  // 自動登入（這個分頁已經登入過）而且有上次的資料：先顯示，背景檢查（後端會再驗證）
  var cachedNow = auto ? loadCache() : null;
  if (cachedNow) {
    data = cachedNow; buildItems();
    $('whoName').textContent = name;
    $('loginView').hidden = true; $('mainView').hidden = false;
    applyAndRender(); updateStatus(); startPolling();
    clearTimeout(slowTimer); btn.disabled = false; btn.textContent = '登入';
    checkForUpdates(false).catch(function() {});
    return;
  }
  checkForUpdates(false, true).then(function() {
    sharedLoginSet_(name, code, serverRole_);
    $('loginCode').value = '';
    $('whoName').textContent = name;
    $('loginView').hidden = true; $('mainView').hidden = false;
    applyAndRender(); updateStatus(); startPolling();
  }).catch(function(err) {
    auth = null; data = null;
    if (isAuthError(err)) { sharedLoginClear_(); ruiheGoHome_(err.message); return; }
    if (/只有.{0,6}可以/.test(err.message || '')) { ruiheGoHome_(err.message); return; }
    showLoginError(err.message || '連不上系統');
  }).then(function() { clearTimeout(slowTimer); btn.disabled = false; btn.textContent = '登入'; });
}
function logout(reason) { logoutLocal_(reason); ruiheGoHome_(reason); }
function logoutLocal_(reason) {
  sharedLoginClear_();
  serverRole_ = ''; trackCache_ = {};
  auth = null; data = null; items = []; openKeys = {};
  stopPolling(); clearCache();
  $('mainView').hidden = true; $('loginView').hidden = false;
  $('results').innerHTML = '<div class="loading">讀取中…</div>';
  if (reason) showLoginError(reason); else $('loginMsg').className = 'msg';
}

// ---------------- 事件 ----------------
$('loginBtn').addEventListener('click', function() { login(); });
$('loginCode').addEventListener('keydown', function(e) { if (e.key === 'Enter') login(); });
$('refreshBtn').addEventListener('click', function() { checkForUpdates(true).catch(function() {}); });
$('logoutBtn').addEventListener('click', function() { logout(); });
$('clearBtn').addEventListener('click', clearFilters);
$('filterToggle').addEventListener('click', function() {
  var card = $('filterCard'), open = !card.classList.contains('open');
  card.classList.toggle('open', open); this.setAttribute('aria-expanded', String(open));
});
$('fCounty').addEventListener('change', function() { filters.county = this.value; filters.town = ''; buildTownOptions(); applyAndRender(); });
$('fTown').addEventListener('change', function() { filters.town = this.value; applyAndRender(); });
var kwTimer = null;
$('fKeyword').addEventListener('input', function() { var v = this.value; clearTimeout(kwTimer); kwTimer = setTimeout(function() { filters.keyword = v; applyAndRender(); }, 200); });
[['fArea', 'area'], ['fPrice', 'price'], ['fRent', 'rent']].forEach(function(p) {
  $(p[0]).addEventListener('input', function() { filters[p[1]] = this.value; applyAndRender(); });
});
$('sortMobile').addEventListener('change', function() {
  var v = this.value;
  sortState = v ? { key: v.split('|')[0], dir: parseInt(v.split('|')[1], 10) } : { key: '', dir: 1 };
  applyAndRender();
});
$('results').addEventListener('click', function(e) {
  var tb = e.target.closest('.track-btn');
  if (tb) { loadTracks(tb.getAttribute('data-key')); return; }
  var b = e.target.closest('th button[data-sort]');
  if (b) {
    var k = b.getAttribute('data-sort');
    if (sortState.key !== k) sortState = { key: k, dir: 1 };
    else if (sortState.dir === 1) sortState = { key: k, dir: -1 };
    else sortState = { key: '', dir: 1 };
    applyAndRender();
    return;
  }
  if (e.target.closest('a')) return;
  var tr = e.target.closest('tr.main');
  if (tr) { var key = tr.getAttribute('data-key'); openKeys[key] = !openKeys[key]; applyAndRender(); }
});
$('results').addEventListener('toggle', function(e) {
  var d = e.target;
  if (d.classList && d.classList.contains('item')) openKeys[d.getAttribute('data-key')] = d.open;
}, true);
var lastDesktop = DESKTOP_QUERY.matches;
window.addEventListener('resize', function() { if (DESKTOP_QUERY.matches !== lastDesktop) { lastDesktop = DESKTOP_QUERY.matches; if (data) applyAndRender(); } });

loadLoginOptions();
idleWatch_(function() { return !!auth; }, function(msg) { logout(msg); });
if (sharedLoginGet_()) login(sharedLoginGet_()); else ruiheGoHome_();
</script>
</body>
</html>
